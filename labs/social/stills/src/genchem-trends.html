<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--green:#1f3d2e;--gold:#b8923d;--cream:#f3eee1;--pine:#15291d;}
  *{margin:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;}
  body{background:var(--pine);background-image:radial-gradient(900px 700px at 50% 8%,rgba(31,61,46,.95),var(--pine));
    color:var(--cream);font-family:'DM Sans',sans-serif;padding:96px 88px;display:flex;flex-direction:column;}
  .mark{position:absolute;top:96px;right:88px;font-family:'Playfair Display',serif;font-size:30px;font-weight:700;}
  .mark .g{color:var(--gold);}
  .kick{font-size:26px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:'Playfair Display',serif;font-size:84px;line-height:1.02;font-weight:800;margin:26px 0 10px;}
  h1 em{color:var(--gold);font-style:italic;}
  .sub{font-size:32px;color:rgba(243,238,225,.62);margin-bottom:30px;}
  .grid{flex:1;display:flex;align-items:center;justify-content:center;}
  .legend{margin-top:8px;display:flex;flex-direction:column;gap:22px;}
  .lrow{display:flex;align-items:center;gap:24px;font-size:34px;font-weight:600;}
  .swatch{width:60px;height:14px;border-radius:8px;flex:none;}
  .lrow b{color:var(--gold);}
  .foot{margin-top:34px;font-family:'Playfair Display',serif;font-style:italic;font-size:32px;color:rgba(243,238,225,.72);}
</style></head>
<body>
  <div class="mark">Ace<span style="opacity:.85">The</span><span class="g">DAT</span></div>
  <div class="kick">DAT in 60 seconds · Gen Chem</div>
  <h1>The trend everyone <em>overthinks.</em></h1>
  <div class="sub">Radius vs ionization energy. Pin one arrow, the rest follow.</div>

  <div class="grid">
    <svg width="640" height="560" viewBox="0 0 640 560">
      <!-- periodic grid frame -->
      <rect x="70" y="70" width="500" height="420" rx="14" fill="none" stroke="rgba(243,238,225,.22)" stroke-width="3"/>
      <!-- faint cells -->
      <g stroke="rgba(243,238,225,.10)" stroke-width="2">
        <line x1="195" y1="70" x2="195" y2="490"/><line x1="320" y1="70" x2="320" y2="490"/><line x1="445" y1="70" x2="445" y2="490"/>
        <line x1="70" y1="175" x2="570" y2="175"/><line x1="70" y1="280" x2="570" y2="280"/><line x1="70" y1="385" x2="570" y2="385"/>
      </g>
      <!-- radius arrows (gold): grows left + down -->
      <defs>
        <marker id="ag" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8923d"/></marker>
        <marker id="ac" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5FA874"/></marker>
      </defs>
      <!-- radius: arrow pointing left (bigger toward left) and down -->
      <line x1="540" y1="525" x2="100" y2="525" stroke="#b8923d" stroke-width="7" marker-end="url(#ag)"/>
      <text x="320" y="552" text-anchor="middle" font-size="26" font-weight="700" fill="#b8923d" font-family="DM Sans">radius grows ←</text>
      <line x1="40" y1="90" x2="40" y2="470" stroke="#b8923d" stroke-width="7" marker-end="url(#ag)"/>
      <!-- ionization energy: arrow up + right (green) -->
      <line x1="100" y1="40" x2="540" y2="40" stroke="#5FA874" stroke-width="7" marker-end="url(#ac)"/>
      <text x="320" y="28" text-anchor="middle" font-size="26" font-weight="700" fill="#5FA874" font-family="DM Sans">ionization energy →</text>
      <line x1="600" y1="470" x2="600" y2="90" stroke="#5FA874" stroke-width="7" marker-end="url(#ac)"/>
    </svg>
  </div>

  <div class="legend">
    <div class="lrow"><span class="swatch" style="background:#b8923d"></span>Atomic radius shrinks <b>left to right</b>, grows down</div>
    <div class="lrow"><span class="swatch" style="background:#5FA874"></span>Ionization energy climbs <b>right and up</b></div>
  </div>
  <div class="foot">Guaranteed points once the arrows are locked.</div>
</body></html>
