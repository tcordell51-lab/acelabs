<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--green:#1f3d2e;--gold:#b8923d;--cream:#f3eee1;--pine:#15291d;--ink:#243b30;}
  *{margin:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;}
  body{background:var(--pine);background-image:radial-gradient(900px 700px at 50% 8%,rgba(31,61,46,.95),var(--pine));
    color:var(--cream);font-family:'DM Sans',sans-serif;padding:96px 88px;display:flex;flex-direction:column;}
  .kick{font-size:26px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:'Playfair Display',serif;font-size:92px;line-height:1.02;font-weight:800;margin:26px 0 0;}
  h1 em{color:var(--gold);font-style:italic;}
  .ring{flex:1;display:flex;align-items:center;justify-content:center;}
  .legend{margin-top:8px;}
  .lrow{display:flex;align-items:center;gap:22px;padding:20px 0;border-top:1px solid rgba(243,238,225,.16);}
  .dot{width:26px;height:26px;border-radius:50%;flex:none;}
  .ltext{font-size:34px;font-weight:600;}
  .ltext b{color:var(--gold);}
  .foot{margin-top:30px;font-family:'Playfair Display',serif;font-style:italic;font-size:30px;color:rgba(243,238,225,.7);}
  .mark{position:absolute;top:96px;right:88px;font-family:'Playfair Display',serif;font-size:30px;font-weight:700;}
  .mark .g{color:var(--gold);}
</style></head>
<body>
  <div class="mark">Ace<span style="opacity:.85">The</span><span class="g">DAT</span></div>
  <div class="kick">DAT in 60 seconds · Orgo</div>
  <h1>Everyone gets EAS<br><em>directors</em> backwards.</h1>

  <div class="ring">
    <svg width="560" height="600" viewBox="0 0 560 600">
      <!-- benzene hexagon -->
      <g fill="none" stroke="#f3eee1" stroke-width="6">
        <polygon points="280,140 420,220 420,380 280,460 140,380 140,220"/>
      </g>
      <!-- inner circle (aromatic) -->
      <circle cx="280" cy="300" r="92" fill="none" stroke="#b8923d" stroke-width="5" stroke-dasharray="3 16" stroke-linecap="round"/>
      <!-- substituent at top (ipso) -->
      <line x1="280" y1="140" x2="280" y2="70" stroke="#f3eee1" stroke-width="6"/>
      <circle cx="280" cy="50" r="30" fill="#b8923d"/>
      <text x="280" y="60" text-anchor="middle" font-family="DM Sans" font-size="30" font-weight="800" fill="#15291d">G</text>
      <!-- ortho (top two adjacent) -->
      <circle cx="420" cy="220" r="26" fill="#5FA874"/><text x="420" y="230" text-anchor="middle" font-size="24" font-weight="700" fill="#15291d" font-family="DM Sans">o</text>
      <circle cx="140" cy="220" r="26" fill="#5FA874"/><text x="140" y="230" text-anchor="middle" font-size="24" font-weight="700" fill="#15291d" font-family="DM Sans">o</text>
      <!-- meta -->
      <circle cx="420" cy="380" r="26" fill="#D55E00"/><text x="420" y="390" text-anchor="middle" font-size="24" font-weight="700" fill="#f3eee1" font-family="DM Sans">m</text>
      <circle cx="140" cy="380" r="26" fill="#D55E00"/><text x="140" y="390" text-anchor="middle" font-size="24" font-weight="700" fill="#f3eee1" font-family="DM Sans">m</text>
      <!-- para -->
      <circle cx="280" cy="460" r="28" fill="#5FA874"/><text x="280" y="470" text-anchor="middle" font-size="24" font-weight="700" fill="#15291d" font-family="DM Sans">p</text>
    </svg>
  </div>

  <div class="legend">
    <div class="lrow"><span class="dot" style="background:#5FA874"></span><span class="ltext"><b>Donor</b> (lone pair / alkyl) → ortho / para</span></div>
    <div class="lrow"><span class="dot" style="background:#D55E00"></span><span class="ltext"><b>Withdrawer</b> → meta</span></div>
    <div class="lrow"><span class="dot" style="background:#b8923d"></span><span class="ltext"><b>Halogen</b> = exception: deactivates BUT o / p</span></div>
  </div>
  <div class="foot">σ-withdraws for speed, π-donates for position.</div>
</body></html>
