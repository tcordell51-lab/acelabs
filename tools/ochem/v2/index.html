<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ace Labs · Organic Chemistry (v2 course engine)</title>
<meta name="description" content="A guided, module-based organic chemistry course — a prerequisite skill tree, a five-stage self-teaching flow, and earned mastery. DAT-scoped."/>
<style>
:root{
  --bg:#f4efe6; --paper:#fffdf7; --paper-2:#f8f2e5; --raise:#fbf6ec;
  --ink:#12241c; --ink-2:#3d4c44; --ink-3:#71776f; --ink-soft:#9aa39e;
  --line:rgba(19,36,28,.12); --line-2:rgba(19,36,28,.07);
  --gold:#8c6f2e; --gold-hi:#a9863b; --gold-wash:rgba(201,168,76,.12);
  --teal:#1f4636;
  --t0:#2c7a5b; --t1:#9a7c26; --t2:#8a5f22; --t3:#4c6774;
  --good:#1c7a52; --good-wash:rgba(28,122,82,.11);
  --trap:#a8371c; --trap-wash:rgba(168,55,28,.10);
  --shadow:0 1px 2px rgba(19,36,28,.05),0 12px 30px rgba(19,36,28,.07);
  --serif:Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono','Menlo',monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1411; --paper:#121b16; --paper-2:#16211b; --raise:#1a271f;
  --ink:#ece6d7; --ink-2:#b7b0a0; --ink-3:#867f72; --ink-soft:#6b6558;
  --line:rgba(201,168,76,.15); --line-2:rgba(236,230,215,.08);
  --gold:#C9A84C; --gold-hi:#E6D08A; --gold-wash:rgba(201,168,76,.10); --teal:#3A6B54;
  --t0:#4FA07E; --t1:#C9A84C; --t2:#C79149; --t3:#93AAB8;
  --good:#57B487; --good-wash:rgba(87,180,135,.12);
  --trap:#E36A4B; --trap-wash:rgba(227,106,75,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.34);
}}
:root[data-theme="light"]{
  --bg:#f4efe6; --paper:#fffdf7; --paper-2:#f8f2e5; --raise:#fbf6ec;
  --ink:#12241c; --ink-2:#3d4c44; --ink-3:#71776f;
  --line:rgba(19,36,28,.12); --line-2:rgba(19,36,28,.07);
  --gold:#8c6f2e; --gold-hi:#a9863b; --gold-wash:rgba(201,168,76,.12); --teal:#1f4636;
  --t0:#2c7a5b; --t1:#9a7c26; --t2:#8a5f22; --t3:#4c6774;
  --good:#1c7a52; --good-wash:rgba(28,122,82,.11); --trap:#a8371c; --trap-wash:rgba(168,55,28,.10);
}
:root[data-theme="dark"]{
  --bg:#0d1411; --paper:#121b16; --paper-2:#16211b; --raise:#1a271f;
  --ink:#ece6d7; --ink-2:#b7b0a0; --ink-3:#867f72;
  --line:rgba(201,168,76,.15); --line-2:rgba(236,230,215,.08);
  --gold:#C9A84C; --gold-hi:#E6D08A; --gold-wash:rgba(201,168,76,.10); --teal:#3A6B54;
  --t0:#4FA07E; --t1:#C9A84C; --t2:#C79149; --t3:#93AAB8;
  --good:#57B487; --good-wash:rgba(87,180,135,.12); --trap:#E36A4B; --trap-wash:rgba(227,106,75,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:var(--mono)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

/* TOP BAR */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 22px;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:18px;font-weight:700}
.brand em{font-style:italic;color:var(--gold)}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-left:8px;vertical-align:middle}
.top .spacer{flex:1}
.top .stat{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.top .stat b{color:var(--gold);font-weight:700}
.icon-btn{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;color:var(--ink-2);font-size:11px;font-family:var(--mono);letter-spacing:.06em;padding:6px 10px}

/* LAYOUT */
.shell{display:grid;grid-template-columns:minmax(300px,340px) 1fr;gap:0;min-height:calc(100vh - 52px)}
@media (max-width:860px){.shell{grid-template-columns:1fr}.tree-pane{border-right:none;border-bottom:1px solid var(--line)}}
.tree-pane{border-right:1px solid var(--line);padding:22px 18px 40px;overflow-y:auto}
.main-pane{padding:26px 30px 60px;max-width:820px}

/* TREE */
.tree-h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.tree-sub{font-size:12.5px;color:var(--ink-3);margin:0 0 18px}
.tier-block{margin-bottom:20px}
.tier-lbl{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);font-weight:700;margin:0 0 9px}
.tier-lbl::after{content:"";flex:1;height:1px;background:var(--line-2)}
.t0b{--tc:var(--t0)} .t1b{--tc:var(--t1)} .t2b{--tc:var(--t2)} .t3b{--tc:var(--t3)}
.node{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--tc,var(--gold));border-radius:9px;padding:9px 11px;margin-bottom:7px;color:var(--ink);transition:transform .12s,box-shadow .12s,border-color .12s}
.node:hover:not(:disabled){transform:translateX(2px);box-shadow:var(--shadow)}
.node:disabled{cursor:not-allowed;opacity:.5}
.node.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-wash),var(--shadow)}
.node .nm{font-family:var(--serif);font-size:14.5px;font-weight:600;line-height:1.15;flex:1}
.node .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--ink-soft)}
.node.s-mastered .dot{background:var(--good);border-color:var(--good)}
.node.s-partial .dot{background:var(--gold);border-color:var(--gold)}
.node.s-unlocked .dot{background:transparent;border-color:var(--tc,var(--gold))}
.node.s-locked .dot{background:var(--line);border-color:var(--line-2)}
.node .lk{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

/* MAIN — home */
.hero{padding:8px 0 4px}
.hero .eye{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
.hero h1{font-size:clamp(28px,4.4vw,42px);margin:0 0 14px}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{font-size:16px;color:var(--ink-2);max-width:62ch;margin:0 0 8px}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--teal);color:#fdf8ec;border:none;border-radius:99px;padding:11px 22px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cta.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);margin-left:8px}
.pathnote{margin-top:26px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--t0);border-radius:10px;font-size:13.5px;color:var(--ink-2)}
.pathnote b{color:var(--ink)}

/* MODULE VIEW */
.mod-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.mod-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mc,var(--gold));font-weight:700}
.mod-view h2{font-size:clamp(23px,3.4vw,31px);margin:0}
.mod-sub{color:var(--ink-2);font-size:15px;margin:6px 0 20px}
.stage-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3);background:var(--paper)}
.pill.cur{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700}
.pill.done{color:var(--good);border-color:var(--good)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px 26px;box-shadow:var(--shadow);margin-bottom:18px}
.card h3{font-size:20px;margin:0 0 12px}
.card p{color:var(--ink-2);font-size:15px;margin:0 0 12px}
.card p:last-child{margin-bottom:0}
.card b{color:var(--ink)}
.rule{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0;font-size:14px}
.rule .rl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.trapbox{background:var(--trap-wash);border:1px solid color-mix(in srgb,var(--trap) 30%, transparent);border-radius:10px;padding:14px 16px;margin:14px 0;font-size:14px}
.trapbox .rl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--trap);margin-bottom:6px;font-weight:700}
.coachbox{background:var(--gold-wash);border:1px solid color-mix(in srgb,var(--gold) 34%,transparent);border-radius:10px;padding:14px 16px;margin:14px 0;font-size:14px}
.coachbox .rl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-weight:700}
.depthnote{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);border-left:2px solid var(--t3);padding:5px 0 5px 12px;margin:14px 0;letter-spacing:.01em;line-height:1.5}
.depthnote b{color:var(--ink-2)}
.fischer{font-family:var(--mono);font-size:15px;line-height:1.5;white-space:pre;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0;color:var(--ink);overflow-x:auto}
.step{border-left:2px solid var(--line);padding:2px 0 2px 16px;margin:14px 0}
.step .what{font-size:15px;color:var(--ink);font-weight:500}
.step .why{font-size:13.5px;color:var(--ink-3);margin-top:3px}
.predict{background:var(--gold-wash);border:1px dashed var(--gold);border-radius:9px;padding:12px 14px;margin:10px 0}
.predict .q{font-size:14px;color:var(--ink);font-weight:600}
.predict .hint{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.reveal-btn,.next-btn{background:var(--teal);color:#fdf8ec;border:none;border-radius:8px;padding:9px 18px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-top:8px}
.next-btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.opts{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.opt{text-align:left;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:12px 15px;font-size:14.5px;color:var(--ink);display:flex;gap:10px;align-items:flex-start;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .lt{font-family:var(--mono);font-weight:700;color:var(--ink-3);flex-shrink:0}
.opt.correct{background:var(--good-wash);border-color:var(--good)}
.opt.wrong{background:var(--trap-wash);border-color:var(--trap)}
.opt:disabled{cursor:default}
.fb{border-radius:9px;padding:12px 15px;margin:10px 0;font-size:14px;line-height:1.5}
.fb.good{background:var(--good-wash);border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
.fb.bad{background:var(--trap-wash);border:1px solid color-mix(in srgb,var(--trap) 30%,transparent)}
.fb .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.fb.good .lab{color:var(--good)} .fb.bad .lab{color:var(--trap)}
.mastery-meter{display:flex;align-items:center;gap:10px;margin:6px 0 16px;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.streak{display:flex;gap:5px}
.streak i{width:22px;height:6px;border-radius:3px;background:var(--line);display:block}
.streak i.on{background:var(--good)}
.celebrate{background:var(--good-wash);border:1px solid color-mix(in srgb,var(--good) 34%,transparent);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.celebrate h3{color:var(--good);margin:0 0 8px}
.celebrate p{font-size:14.5px;color:var(--ink-2);margin:0}
.locked-note{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 24px;color:var(--ink-2)}
.locked-note b{color:var(--ink)}
.footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line-2);font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
.watch-btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1a1206;border:none;border-radius:8px;padding:10px 18px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 16px}
.vid-modal{position:fixed;inset:0;z-index:100;background:rgba(4,8,6,.74);display:none;align-items:center;justify-content:center;padding:18px}
.vid-modal.show{display:flex}
.vid-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;width:min(400px,94vw);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:94vh}
.vid-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.vid-head .vt{font-family:var(--serif);font-weight:600;font-size:15px}
.vid-x{background:var(--paper-2);border:1px solid var(--line);border-radius:7px;font-family:var(--mono);font-size:11px;padding:5px 11px;color:var(--ink-2);cursor:pointer}
.vid-body{position:relative;width:100%;aspect-ratio:9/16;background:#000}
.vid-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (prefers-reduced-motion:no-preference){.card,.mod-view,.hero{animation:fade .4s ease both}@keyframes fade{from{opacity:0;transform:translateY(5px)}}}

/* ---- FIGURES (the visual layer) ---- */
.fig{margin:0 0 18px;background:linear-gradient(180deg,var(--raise),var(--paper));border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;box-shadow:var(--shadow)}
.fig .figscroll{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-width:100%}
.fig .cap{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--ink-3);margin-top:11px;text-align:center;max-width:60ch;margin-left:auto;margin-right:auto}
.fig .cap b{color:var(--ink-2);font-weight:600}
.fig text{font-family:var(--sans)}
.fig .atom{font-family:var(--serif);font-size:16px;fill:var(--ink);font-weight:600}
.fig .sub{font-size:11px;fill:var(--ink-2)}
.fig .lbl{font-family:var(--mono);font-size:12px;fill:var(--ink-2)}
.fig .tag{font-family:var(--mono);font-size:10px;letter-spacing:.05em;font-weight:700;text-transform:uppercase}
.fig .bond{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.fig .thin{stroke:var(--line);stroke-width:1.5}
.homefigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:24px}
.homefigs .fig{margin:0}
@media (prefers-reduced-motion:no-preference){
  .fig .pulse{animation:figpulse 2.4s ease-in-out infinite}
  @keyframes figpulse{0%,100%{opacity:.4}50%{opacity:1}}
  .fig .flow{stroke-dasharray:5 5;animation:figflow 1s linear infinite}
  @keyframes figflow{to{stroke-dashoffset:-20}}
}

/* ============ FEEL v2 — premium polish ============ */
body{
  background:
    radial-gradient(1100px 560px at 12% -8%, color-mix(in srgb,var(--gold) 8%, transparent), transparent 58%),
    radial-gradient(900px 520px at 102% -2%, color-mix(in srgb,var(--teal) 12%, transparent), transparent 54%),
    var(--bg);
  background-attachment:fixed;
}
.top{padding:11px 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%, transparent)}
.top .stat{display:none}
.icon-btn{transition:border-color .15s,color .15s,transform .1s}
.icon-btn:hover{border-color:var(--gold);color:var(--ink)}
.icon-btn:active{transform:translateY(1px)}
/* progress ring in the top bar */
.pring{position:relative;width:36px;height:36px;flex-shrink:0}
.pring svg{transform:rotate(-90deg);display:block}
.pring .rbg{fill:none;stroke:var(--line);stroke-width:4}
.pring .rfg{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.pring .rnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--gold)}
.pring .rlab{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}

/* tree nodes — livelier */
.node{transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .14s,border-color .14s,background .14s}
.node:hover:not(:disabled){transform:translateX(3px);border-left-width:5px}
.node.active{background:color-mix(in srgb,var(--gold) 7%,var(--paper));border-left-width:5px}
.node .dot{transition:transform .2s,background .2s}
.node.s-mastered .dot{box-shadow:0 0 0 3px var(--good-wash)}
.node:hover:not(:disabled) .dot{transform:scale(1.25)}

/* cards + surfaces */
.card{background:linear-gradient(180deg,var(--raise),var(--paper));border-radius:16px;transition:box-shadow .25s}
.rule,.trapbox,.coachbox{transition:transform .15s,box-shadow .15s}
.rule:hover,.trapbox:hover,.coachbox:hover{transform:translateX(2px)}

/* buttons — tactile */
.next-btn,.reveal-btn,.cta{background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 88%,#fff),var(--teal));box-shadow:0 2px 0 color-mix(in srgb,var(--teal) 55%,#000),var(--shadow);transition:transform .1s,box-shadow .1s,filter .15s}
.next-btn:hover,.reveal-btn:hover,.cta:hover{filter:brightness(1.08)}
.next-btn:active,.reveal-btn:active,.cta:active{transform:translateY(2px);box-shadow:0 0 0 color-mix(in srgb,var(--teal) 55%,#000),var(--shadow)}
.next-btn.ghost,.cta.ghost{background:transparent;box-shadow:none}
.watch-btn{background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 2px 0 color-mix(in srgb,var(--gold) 55%,#000),var(--shadow);transition:transform .1s,filter .15s}
.watch-btn:hover{filter:brightness(1.06)}
.watch-btn:active{transform:translateY(2px)}

/* options — nicer select + reveal mark */
.opt{position:relative;transition:border-color .14s,background .14s,transform .1s}
.opt:hover:not(:disabled){transform:translateX(2px)}
.opt:active:not(:disabled){transform:translateX(0) scale(.995)}
.opt .lt{width:20px;height:20px;border-radius:6px;background:var(--paper);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.opt.correct .lt{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong .lt{background:var(--trap);color:#fff;border-color:var(--trap)}
.opt.correct::after{content:"correct";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--good);font-weight:700}
.opt.wrong::after{content:"your pick";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--trap);font-weight:700}

/* stage pills + progress track */
.pill{transition:background .15s,color .15s,border-color .15s,transform .1s}
.pill:hover{transform:translateY(-1px)}
.stage-track{height:5px;border-radius:99px;background:var(--line-2);overflow:hidden;margin:-12px 0 22px}
.stage-track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .55s cubic-bezier(.2,.8,.2,1)}

/* stage body slide-in */
@media (prefers-reduced-motion:no-preference){
  #stageBody{animation:stageIn .34s cubic-bezier(.2,.8,.2,1) both}
  @keyframes stageIn{from{opacity:0;transform:translateY(10px)}}
}

/* feedback pop */
@media (prefers-reduced-motion:no-preference){
  .fb{animation:fbpop .28s cubic-bezier(.2,.9,.2,1.2) both}
  @keyframes fbpop{from{opacity:0;transform:scale(.97)}}
}

/* mastery — a real moment */
.celebrate{position:relative;overflow:hidden;text-align:center;padding:30px 24px}
.celebrate .seal{width:66px;height:66px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--gold-hi),var(--gold));display:grid;place-items:center;box-shadow:0 0 0 6px var(--gold-wash),var(--shadow)}
.celebrate .seal svg{width:34px;height:34px}
.celebrate h3{font-size:24px}
@media (prefers-reduced-motion:no-preference){
  .celebrate .seal{animation:sealpop .6s cubic-bezier(.2,1.4,.3,1) both}
  @keyframes sealpop{from{transform:scale(0) rotate(-25deg);opacity:0}}
  .celebrate::before{content:"";position:absolute;inset:-40% -10% auto;height:200%;background:radial-gradient(circle at 50% 0,var(--gold-wash),transparent 45%);animation:rays 3.5s ease-in-out infinite;pointer-events:none}
  @keyframes rays{0%,100%{opacity:.4}50%{opacity:.85}}
}
.streak i{transition:background .3s,transform .3s}
.streak i.on{animation:dotpop .3s cubic-bezier(.2,1.5,.3,1) both}
@keyframes dotpop{from{transform:scaleX(.2)}}

/* ---- interactive figure controls ---- */
.figctrl{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.figbtn{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-3);cursor:pointer;transition:all .15s}
.figbtn:hover{border-color:var(--gold);color:var(--ink);transform:translateY(-1px)}
.figbtn.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.figdetail{margin:11px auto 0;max-width:52ch;text-align:center;font-size:13px;line-height:1.5;color:var(--ink-2);min-height:1.5em;transition:opacity .2s}
.figdetail b{color:var(--gold)}
.fig .hot{cursor:pointer;transition:opacity .18s,transform .12s}
.fig .hot:hover{opacity:1}
.fig.dim .hot:not(.sel){opacity:.28}
.fig .hotbox{transition:stroke-width .15s,stroke .15s}
.fig .hot.sel .hotbox,.fig .hot:hover .hotbox{stroke:var(--gold);stroke-width:2.5}
.fig .seat{transition:r .2s,opacity .2s,fill .2s}
</style>

<script>
"use strict";
/* ============================================================
   Ace Labs — Organic Chemistry v2 course engine
   Self-contained. State in localStorage 'ochem-v2'.
   Chemistry in the Stereochemistry module verified against
   Master Organic Chemistry (Fischer R/S rules; lactic acid
   L=(S), D=(R)).
   ============================================================ */

/* ---- MODULE TREE (SKILLS) ---- */
const MODS = [
  // Tier 0 — Foundations
  {id:'bonding', tier:0, name:'Bonding, Resonance & Arrow-Pushing', prereqs:[]},
  {id:'nomen',   tier:0, name:'Functional Groups & Nomenclature', prereqs:['bonding']},
  {id:'acidbase',tier:0, name:'Acid–Base & pKa', prereqs:['bonding']},
  {id:'stereo',  tier:0, name:'Stereochemistry', prereqs:['bonding']},
  // Tier 1 — Core reactions
  {id:'radical', tier:1, name:'Alkanes & Radical Halogenation', prereqs:['bonding','nomen']},
  {id:'subelim', tier:1, name:'Substitution & Elimination', prereqs:['acidbase','stereo']},
  {id:'alkene',  tier:1, name:'Alkene Addition', prereqs:['stereo','subelim']},
  {id:'alkyne',  tier:1, name:'Alkynes', prereqs:['alkene']},
  {id:'alcohol', tier:1, name:'Alcohols', prereqs:['subelim']},
  {id:'ether',   tier:1, name:'Ethers & Epoxides', prereqs:['alcohol']},
  // Tier 2 — Patterns
  {id:'aromatic',tier:2, name:'Aromaticity & EAS', prereqs:['alkene','acidbase']},
  {id:'carbonyl',tier:2, name:'Aldehydes & Ketones', prereqs:['alkene','acidbase']},
  {id:'acids',   tier:2, name:'Carboxylic Acids & Derivatives', prereqs:['carbonyl']},
  {id:'enolate', tier:2, name:'Enols, Enolates, Aldol & Claisen', prereqs:['carbonyl','acidbase']},
  {id:'amine',   tier:2, name:'Amines', prereqs:['subelim','acidbase']},
  {id:'diene',   tier:2, name:'Dienes & Diels–Alder', prereqs:['alkene','aromatic']},
  // Tier 3 — Test-day & integration
  {id:'spec',    tier:3, name:'Spectroscopy — IR / NMR', prereqs:['nomen']},
  {id:'rcd',     tier:3, name:'Reaction-Coordinate Diagrams', prereqs:['subelim']},
  {id:'synth',   tier:3, name:'Multi-step Synthesis & Retrosynthesis', prereqs:['alkene','carbonyl','aromatic','acids']},
  {id:'labtech', tier:3, name:'Lab Techniques & Qual Analysis', prereqs:['spec']},
];
const MOD_BY_ID = Object.fromEntries(MODS.map(m=>[m.id,m]));
const TIERS = [
  {n:0, label:'Tier 0 · Foundations', cls:'t0b'},
  {n:1, label:'Tier 1 · Core Reactions', cls:'t1b'},
  {n:2, label:'Tier 2 · Patterns & Advanced', cls:'t2b'},
  {n:3, label:'Tier 3 · Test-Day & Integration', cls:'t3b'},
];

/* ---- PRACTICE BANK (Stereochemistry) — MOC-verified ---- */
const BANK = {
  st1:{skill:'stereo',diff:1,q:'A carbon must have how many different groups to be a stereocenter (chirality center)?',
    opts:['Two','Three','Four different groups','Any four groups'],correct:2,
    why:'A tetrahedral carbon is a stereocenter when all four attached groups are different — that is what makes the molecule non-superimposable on its mirror image.',
    diag:{0:'Two different groups cannot give a non-superimposable mirror image.',1:'Three different groups (plus one repeat) is not a stereocenter.',3:'Four groups is necessary but they must be DIFFERENT from one another.'}},
  st2:{skill:'stereo',diff:2,q:'Assigning CIP priority: which atom directly attached to a carbon has the HIGHEST priority — Br, O, N, or C?',
    opts:['C','N','O','Br'],correct:3,
    why:'CIP ranks by atomic number at the first point of difference. Br (35) > O (8) > N (7) > C (6). Bromine wins.',
    diag:{0:'Carbon is the LOWEST of these (Z=6).',1:'Nitrogen (7) beats carbon but loses to O and Br.',2:'Oxygen (8) is high but Br (35) is higher.'}},
  st3:{skill:'stereo',diff:2,q:'When the lowest-priority group points TOWARD you (out of the page), you determine 1→2→3 as drawn and then…',
    opts:['Keep the result','Reverse the result','Re-rank the groups','It cannot be assigned'],correct:1,
    why:'R/S is defined with the lowest priority pointing AWAY. If it points toward you, you see the mirror sense, so you flip the observed direction.',
    diag:{0:'Keeping it gives the enantiomer of the true configuration.',2:'Priorities do not change with viewing angle.',3:'It is assignable — you just reverse.'}},
  st4:{skill:'stereo',diff:2,q:'In a Fischer projection, the HORIZONTAL bonds point…',
    opts:['Away from you (dashes)','Toward you (wedges)','In the plane','It depends on the molecule'],correct:1,
    why:'Fischer convention: horizontal lines come toward the viewer (wedges); vertical lines go away (dashes). This is why a horizontal lowest-priority group triggers the flip rule.',
    diag:{0:'That describes the VERTICAL bonds.',2:'Fischer bonds are explicitly out-of-plane, not in-plane.',3:'The convention is fixed, not molecule-dependent.'}},
  st5:{skill:'stereo',diff:3,q:'Lactic acid is drawn in a Fischer projection with COOH on top, CH₃ on bottom, OH on the LEFT and H on the right. What is it?',
    opts:['D-lactic acid, (R)','L-lactic acid, (S)','D-lactic acid, (S)','L-lactic acid, (R)'],correct:1,
    why:'OH on the left of the Fischer (most-oxidized group on top) makes it L. Working the CIP: priorities OH>COOH>CH₃>H; H is horizontal (toward you) so reverse. The traced 1→2→3 is clockwise as drawn, reversed to counter-clockwise → (S). L-lactic acid is (S). (Master Organic Chemistry: OH-left = L and = S.)',
    diag:{0:'OH on the LEFT is L, not D; and L-lactic is (S), not (R).',2:'The L/(S) pairing is right for the direction but this is L, not D.',3:'It is L, but L-lactic acid is (S), not (R) — you likely forgot to reverse for the horizontal H.'}},
  st6:{skill:'stereo',diff:3,q:'Two molecules are mirror images but NOT superimposable, and have identical physical properties except the sign of optical rotation. They are…',
    opts:['Diastereomers','Enantiomers','Constitutional isomers','Conformers'],correct:1,
    why:'Non-superimposable mirror images are enantiomers; they share all scalar physical properties (mp, bp, density) and rotate plane-polarized light equally but oppositely.',
    diag:{0:'Diastereomers are stereoisomers that are NOT mirror images and DO differ in physical properties.',2:'Constitutional isomers differ in connectivity, not just spatial arrangement.',3:'Conformers interconvert by bond rotation — same molecule.'}},
  st7:{skill:'stereo',diff:3,q:'A molecule has two stereocenters but an internal mirror plane making it achiral overall. This is a…',
    opts:['Pair of enantiomers','Meso compound','Racemic mixture','Chiral diastereomer'],correct:1,
    why:'A meso compound contains stereocenters but an internal plane of symmetry, so it is achiral (optically inactive) despite having stereocenters — a classic DAT trap.',
    diag:{0:'A single meso compound is one achiral molecule, not a pair.',2:'A racemic mixture is a 50:50 of two enantiomers — that is a mixture, not one molecule with internal symmetry.',3:'The internal mirror plane makes it achiral, not chiral.'}},
  st8:{skill:'stereo',diff:2,q:'In the most stable conformation of ethane viewed down the C–C bond, the front and back C–H bonds are…',
    opts:['Eclipsed (0° torsion)','Staggered (60° torsion)','Perpendicular','Bent'],correct:1,
    why:'Staggered (60° dihedral) minimizes torsional strain and is lowest in energy; eclipsed (0°) is the maximum. The Newman projection makes this visible. (Anti vs gauche only differ once you have larger groups, as in butane.)',
    diag:{0:'Eclipsed is the HIGHEST-energy arrangement, not the most stable.',2:'Torsional angles for sp³ C–C are 0/60/120°, not 90°.',3:'Bonds are not "bent" here — this is about torsion angle.'}},
  ab1:{skill:'acidbase',diff:1,q:'Acidity is best judged by the stability of which species?',
    opts:['The neutral acid molecule','The conjugate base (the anion left after losing H+)','The solvent','The pKa of water'],correct:1,
    why:'A stronger acid gives a more stable conjugate base. Rank acids by comparing the anions they leave behind.',
    diag:{0:'What matters is the anion AFTER the proton leaves, not the neutral acid.',2:'Solvent can matter, but the core comparison is conjugate-base stability.',3:'Water is one reference point, not the judging criterion.'}},
  ab2:{skill:'acidbase',diff:1,q:'Which is the strongest acid?',
    opts:['Ethanol, pKa 16','Acetic acid, pKa 4.8','Water, pKa 15.7','Ammonia, pKa 38'],correct:1,
    why:'Lower pKa = stronger acid. Acetic acid wins because its carboxylate conjugate base is resonance-stabilized over two oxygens.',
    diag:{0:'Higher pKa means weaker; ethanol is among the weakest here.',2:'Water is weak (pKa 15.7).',3:'Ammonia is extremely weak as an acid (pKa 38).'}},
  ab3:{skill:'acidbase',diff:2,q:'Why is a carboxylic acid (RCOOH) more acidic than an alcohol (ROH)?',
    opts:['The carboxylic acid is a larger molecule','Resonance delocalizes the carboxylate charge over two oxygens','Alcohols have no acidic hydrogen','Alcohols are stabilized by induction'],correct:1,
    why:'Carboxylate spreads its negative charge over two equivalent oxygens by resonance; an alkoxide cannot, so RCOOH (pKa ~4-5) beats ROH (pKa ~16).',
    diag:{0:'Size is not the reason; resonance is.',2:'The alcohol O-H is acidic, just far less so.',3:'Induction is minor here; resonance is the dominant effect.'}},
  ab4:{skill:'acidbase',diff:2,q:'Rank HF, HCl, HBr, HI by acidity. Which is the STRONGEST acid?',
    opts:['HF','HCl','HBr','HI'],correct:3,
    why:'Down a column the larger atom spreads the negative charge better, so the conjugate base is more stable. Size beats electronegativity down a group: iodide is the most stable halide, so HI is the strongest acid.',
    diag:{0:'HF is the WEAKEST of the four; fluoride is small and holds charge tightly.',1:'HCl is strong, but iodide spreads charge better than chloride.',2:'HBr is close, but iodine is larger still.'}},
  ab5:{skill:'acidbase',diff:3,q:'A terminal alkyne C-H (sp) is much more acidic than an alkane C-H (sp3) because:',
    opts:['Alkynes are smaller molecules','More s-character holds the carbanion lone pair closer to the nucleus, stabilizing it','Alkynes have resonance stabilization','Induction from the triple bond'],correct:1,
    why:'An sp carbon is 50 percent s-character, holding the lone pair close to the positive nucleus, which stabilizes the carbanion. Terminal alkyne pKa ~25 vs alkane ~50 — this is why NaNH2 makes an acetylide.',
    diag:{0:'Molecular size is not the factor.',2:'A simple terminal acetylide has no resonance; it is hybridization.',3:'Induction is not the main driver; s-character is.'}},
  ab6:{skill:'acidbase',diff:3,q:'Which is the strongest BASE?',
    opts:['Acetate, CH3COO-','Ethoxide, CH3CH2O-','Chloride, Cl-','Water'],correct:1,
    why:'Strongest base = conjugate base of the weakest acid = least-stabilized anion. Acetate is resonance-delocalized (weak base) and chloride is very stable (weak base); ethoxide, from an alcohol pKa ~16, is the strongest base here.',
    diag:{0:'Acetate is resonance-stabilized, which makes it a WEAK base.',2:'Chloride is stable and a weak base.',3:'Water is neutral and a very weak base.'}},
  ab7:{skill:'acidbase',diff:2,q:'An acid-base equilibrium favors the side with the:',
    opts:['Stronger acid and stronger base','Weaker acid and weaker base','Larger number of atoms','Lower temperature'],correct:1,
    why:'Proton transfers run downhill toward the more stable, weaker acid and weaker base.',
    diag:{0:'It runs AWAY from the stronger acid and base, not toward them.',2:'Atom count does not set the direction.',3:'Temperature is not the deciding factor for the position here.'}},
  ab8:{skill:'acidbase',diff:2,q:'The three chlorines in trichloroacetic acid make it MORE acidic than acetic acid because they:',
    opts:['Add resonance to the acid','Withdraw electron density by induction, stabilizing the conjugate base','Make the molecule larger','Donate electrons to the oxygen'],correct:1,
    why:'Electron-withdrawing groups pull negative charge away from the carboxylate by induction, stabilizing the conjugate base and strengthening the acid.',
    diag:{0:'The chlorines act by induction, not by adding resonance.',2:'Size is not the effect.',3:'They withdraw electron density, they do not donate it.'}},
  ar1:{skill:'aromatic',diff:1,q:'A substituent with lone pairs on the atom attached to the ring (like -OH or -NH2) is a:',
    opts:['Meta director and deactivator','Ortho/para director and activator','Non-directing','Ortho/para director but deactivator'],correct:1,
    why:'LPOP: lone pairs donate into the ring, making it richer (activator) and directing the next group ortho/para.',
    diag:{0:'Lone-pair donors are activators and o/p directors, not meta deactivators.',2:'The group definitely directs; it is not neutral.',3:'A pure lone-pair donor activates; it does not deactivate (halogens are the special case).'}},
  ar2:{skill:'aromatic',diff:1,q:'Where does an electrophile add on nitrobenzene (-NO2 already on the ring)?',
    opts:['Ortho','Para','Meta','It does not react at all'],correct:2,
    why:'-NO2 strongly withdraws electrons (deactivator), so it is a meta director. Flip the W: withdrawing goes meta.',
    diag:{0:'Ortho/para is where DONORS direct; -NO2 withdraws.',1:'Same issue: para is a donor position.',3:'It still reacts, just slower and at the meta position.'}},
  ar3:{skill:'aromatic',diff:2,q:'Compared to benzene, how fast does anisole (methoxybenzene, -OCH3) undergo electrophilic aromatic substitution?',
    opts:['Slower','Faster, because -OR is a strong lone-pair activator','The same rate','It does not react'],correct:1,
    why:'-OR donates its lone pairs into the ring (strong activator), so the ring is electron-rich and reacts faster than benzene.',
    diag:{0:'-OR activates; only deactivators slow the ring down.',2:'Activation makes it faster, not equal.',3:'An activated ring is more reactive, not inert.'}},
  ar4:{skill:'aromatic',diff:2,q:'Halogens (Cl, Br, I) on a ring are unusual because they:',
    opts:['Activate and direct meta','Deactivate the ring but still direct ortho/para','Activate and direct ortho/para','Deactivate and direct meta'],correct:1,
    why:'Inductive withdrawal deactivates the ring (slower), but lone-pair donation still directs ortho/para. The halogen exception.',
    diag:{0:'Halogens deactivate, and they direct o/p, not meta.',2:'They direct o/p correctly, but they deactivate rather than activate.',3:'They direct o/p, not meta, because of their lone pairs.'}},
  ar5:{skill:'aromatic',diff:1,q:'How many pi electrons does benzene have, and is it aromatic?',
    opts:['4, anti-aromatic','6, aromatic','8, aromatic','6, non-aromatic'],correct:1,
    why:'Three double bonds = 6 pi electrons, which is a 4n+2 magic number, so benzene is aromatic.',
    diag:{0:'Benzene has 6 pi electrons (3 double bonds), not 4.',2:'It has 6, not 8.',3:'Six pi electrons in a cyclic, planar, conjugated ring IS aromatic.'}},
  ar6:{skill:'aromatic',diff:3,q:'Cyclobutadiene (a 4-membered ring with 2 double bonds) is:',
    opts:['Aromatic','Anti-aromatic, because 4 pi electrons = 4n','Non-aromatic','Identical to benzene'],correct:1,
    why:'Four pi electrons is 4n; a cyclic, planar, conjugated ring with 4n electrons is anti-aromatic and especially unstable.',
    diag:{0:'4n electrons make it anti-aromatic, not aromatic.',2:'It is conjugated and cyclic, so it is anti-aromatic, not simply non-aromatic.',3:'Benzene has 6 pi electrons and is aromatic; cyclobutadiene has 4 and is anti-aromatic.'}},
  ar7:{skill:'aromatic',diff:2,q:'Which is the STRONGEST activator?',
    opts:['-CH3 (alkyl)','-NH2','-Cl','-NO2'],correct:1,
    why:'-NH2 (like -OH and -OR) is a strong lone-pair donor and the strongest activator here. Alkyl is only weakly activating; Cl deactivates; NO2 strongly deactivates.',
    diag:{0:'Alkyl is only a WEAK activator.',2:'Cl is a deactivator (the halogen exception), not an activator.',3:'-NO2 is a strong DEACTIVATOR, the opposite of an activator.'}},
  ar8:{skill:'aromatic',diff:3,q:'Pyrrole (a 5-membered ring containing N) is aromatic because its nitrogen:',
    opts:['Has no lone pair','Contributes its lone pair to the ring p-system, giving 6 pi electrons','Is sp3 hybridized','Breaks the conjugation'],correct:1,
    why:'The nitrogen lone pair sits in the ring p-system, adding 2 pi electrons to the 4 from the two double bonds = 6 pi total, so pyrrole is aromatic.',
    diag:{0:'The N does have a lone pair, and it is exactly what makes pyrrole aromatic.',2:'The N is sp2 so its lone pair can join the p-system.',3:'The lone pair joins the conjugation rather than breaking it.'}},
  sz1:{skill:'stereo',diff:2,q:'In an alkene, if the two HIGHER-priority groups (one on each double-bond carbon) are on the SAME side, the geometry is:',
    opts:['E','Z','Always cis','It cannot be assigned'],correct:1,
    why:'Same side of the higher-priority groups = Z (zusammen = together). Opposite sides = E (entgegen).',
    diag:{0:'E is when the higher-priority groups are on OPPOSITE sides.',2:'cis/trans is the looser label; E/Z is the CIP-based one, and same-side is Z.',3:'With two different groups on each carbon it is fully assignable by CIP.'}},
  sz2:{skill:'stereo',diff:3,q:'An alkene has Br and CH3 on the left carbon and Cl and H on the right carbon, with Br and Cl on OPPOSITE sides. Is it E or Z?',
    opts:['Z','E','cis','meso'],correct:1,
    why:'Higher priority on the left is Br (beats CH3), on the right is Cl (beats H). Those two are on opposite sides, so the alkene is E.',
    diag:{0:'Opposite sides of the higher-priority groups is E, not Z.',2:'cis/trans is ambiguous here; use E/Z by CIP, which gives E.',3:'meso is a term for molecules with an internal mirror plane, not alkene geometry.'}},
  sz3:{skill:'stereo',diff:2,q:'A chair ring-flip of cyclohexane converts every substituent that was axial into:',
    opts:['Axial (no change)','Equatorial','A double bond','A different molecule'],correct:1,
    why:'A ring-flip swaps axial and equatorial at every position. It is the same molecule in a different conformation.',
    diag:{0:'The flip does change axial to equatorial; that is the whole point.',2:'No bonds break; nothing becomes a double bond.',3:'It is the same molecule, just a different chair.'}},
  sz4:{skill:'stereo',diff:2,q:'In the most stable chair of methylcyclohexane, the methyl group sits:',
    opts:['Axial','Equatorial, to avoid 1,3-diaxial strain','Either, it does not matter','Perpendicular to the ring'],correct:1,
    why:'The larger group prefers equatorial to avoid 1,3-diaxial strain with the axial hydrogens on the same face. The bigger the group, the stronger the preference.',
    diag:{0:'Axial is the higher-energy spot because of 1,3-diaxial bumping.',2:'It does matter: equatorial is more stable.',3:'Chair positions are axial or equatorial, not perpendicular.'}},
  se1:{skill:'subelim',diff:1,q:'A methyl or primary (1) alkyl halide with a strong, non-bulky nucleophile in a polar aprotic solvent reacts mainly by:',
    opts:['SN1','SN2','E1','E2'],correct:1,
    why:'Methyl and 1 substrates cannot form a carbocation, and a strong small nucleophile in polar aprotic solvent drives the concerted backside attack of SN2.',
    diag:{0:'SN1 needs a stable carbocation; a 1 substrate cannot form one.',2:'E1 also needs a carbocation and a weak base.',3:'E2 needs a strong bulky base; a good nucleophile favors substitution here.'}},
  se2:{skill:'subelim',diff:1,q:'SN2 is a backside attack, so at the stereocenter it causes:',
    opts:['Retention','Inversion (Walden inversion)','Racemization','No change'],correct:1,
    why:'The nucleophile enters opposite the leaving group, flipping the configuration.',
    diag:{0:'Retention would need a front-side attack, which SN2 does not do.',2:'Racemization is SN1 (planar carbocation), not SN2.',3:'The configuration does change; it inverts.'}},
  se3:{skill:'subelim',diff:2,q:'A tertiary (3) alkyl halide in water or ethanol with no strong base reacts by SN1/E1 because it:',
    opts:['Is the least hindered substrate','Forms a stable tertiary carbocation','Cannot ionize','Is blocked by the protic solvent'],correct:1,
    why:'A 3 center gives a stable carbocation, and a weak nucleophile in a protic solvent favors the stepwise SN1/E1 path.',
    diag:{0:'3 is the MOST hindered, which is exactly why SN2 is impossible.',2:'It ionizes readily; that is the point of SN1.',3:'A protic solvent actually stabilizes the carbocation and promotes SN1/E1.'}},
  se4:{skill:'subelim',diff:2,q:'Because SN1 goes through a planar carbocation attacked from both faces, a stereocenter is:',
    opts:['Inverted','Retained','Racemized (~50:50)','Destroyed'],correct:2,
    why:'Both faces of the flat carbocation are equally accessible, so you get a roughly 50:50 mixture of configurations.',
    diag:{0:'Inversion is SN2 (backside), not SN1.',1:'Retention alone would require a single face; the carbocation is attacked from both.',3:'The stereocenter is scrambled, not destroyed.'}},
  se5:{skill:'subelim',diff:2,q:'A bulky base such as t-BuOK or LDA favors which product in an elimination?',
    opts:['Zaitsev (more-substituted alkene)','Hofmann (less-substituted alkene)','The SN2 product','No reaction'],correct:1,
    why:'A bulky base cannot reach the crowded internal hydrogen, so it removes an accessible terminal H, giving the less-substituted Hofmann alkene.',
    diag:{0:'Zaitsev is the default for SMALL bases; a bulky base flips it.',2:'A bulky base does elimination, not SN2.',3:'It does react; it just favors the Hofmann product.'}},
  se6:{skill:'subelim',diff:3,q:'Which mechanisms can show a carbocation rearrangement (hydride or methyl shift)?',
    opts:['SN2 and E2','SN1 and E1 (they pass through a carbocation)','All four','None'],correct:1,
    why:'Only the stepwise carbocation mechanisms (SN1 and E1) can rearrange; the concerted SN2 and E2 cannot.',
    diag:{0:'SN2 and E2 are concerted with no carbocation, so they cannot rearrange.',2:'Only the two carbocation mechanisms rearrange, not all four.',3:'SN1 and E1 definitely can rearrange.'}},
  se7:{skill:'subelim',diff:1,q:'Adding heat to an SN/E competition pushes the outcome toward:',
    opts:['Substitution','Elimination','No reaction','Racemization'],correct:1,
    why:'Heat favors elimination (it makes more molecules, entropically favored). Thomas: heat is always elimination.',
    diag:{0:'Substitution is favored at lower temperature; heat pushes the other way.',2:'The reaction still happens; heat just changes which product wins.',3:'Racemization is a stereochemical outcome, not a temperature effect.'}},
  se8:{skill:'subelim',diff:2,q:'For an E2 elimination, the hydrogen and the leaving group must be positioned:',
    opts:['Syn (same side)','Anti-periplanar (180 degrees apart)','Gauche (60 degrees)','Cis'],correct:1,
    why:'E2 is concerted, so the C-H and C-leaving-group bonds must be anti-periplanar for their orbitals to align.',
    diag:{0:'Syn-periplanar elimination is rare and not the DAT default; E2 wants anti.',2:'Gauche does not give the required orbital alignment.',3:'cis/trans describes alkene geometry, not the E2 transition-state requirement.'}},
  se9:{skill:'subelim',diff:2,q:'Which is the best leaving group in a substitution or elimination?',
    opts:['F-','Cl-','Br-','I- (the weakest base)'],correct:3,
    why:'Leaving-group ability tracks conjugate-base weakness: the weaker and more stable the anion, the better it leaves. I- is the weakest base of the halides, so it is the best leaving group; F- is the worst.',
    diag:{0:'F- is the strongest base of the halides, so it is the WORST leaving group.',1:'Cl- is only a moderate leaving group.',2:'Br- is good, but I- is better still.'}},
  ar9:{skill:'aromatic',diff:3,q:'On a disubstituted ring where two groups direct to different positions, which group wins the directing contest?',
    opts:['The weaker activator','The stronger activator (and an ortho/para director beats a meta director)','Whichever group was added first','Neither; the ring does not react'],correct:1,
    why:'The strongest activator controls the ring electron density, so it decides the position; an ortho/para director outranks a meta director.',
    diag:{0:'The stronger group dominates, not the weaker one.',2:'Order of addition does not decide the next position.',3:'The ring still reacts; the stronger director just sets where.'}},
  ar10:{skill:'aromatic',diff:2,q:'The position directly between two substituents on a ring is usually avoided by an incoming electrophile because of:',
    opts:['Loss of resonance','Steric crowding','Loss of aromaticity','Induction'],correct:1,
    why:'The spot sandwiched between two groups is too crowded, so substitution favors the less-hindered open positions.',
    diag:{0:'Resonance is not what blocks that position.',2:'The ring stays aromatic throughout EAS.',3:'Induction is about electron withdrawal, not the steric block.'}},
  sp1:{skill:'spec',diff:1,q:'A strong IR absorption near 1700-1750 cm-1 indicates:',
    opts:['An O-H bond','A carbonyl (C=O)','A C-C single bond','An aromatic ring'],correct:1,
    why:'The 1700-1750 band is the strong, diagnostic C=O stretch.',
    diag:{0:'O-H is a broad band up near 3200-3550, not at 1715.',2:'A C-C single bond has no strong characteristic band here.',3:'Aromatic modes are elsewhere, not the 1715 carbonyl band.'}},
  sp2:{skill:'spec',diff:1,q:'A broad IR absorption around 3200-3550 cm-1 signals:',
    opts:['A carbonyl (C=O)','An O-H (alcohol or acid)','A triple bond','An sp3 C-H'],correct:1,
    why:'A broad band in the 3200-3550 region is the O-H stretch (very broad, ~2500-3300, for carboxylic acids).',
    diag:{0:'C=O is a sharp band near 1715, not broad at 3300.',2:'Triple bonds absorb weakly near 2100-2260.',3:'sp3 C-H sits near 2850-2960 and is sharp.'}},
  sp3:{skill:'spec',diff:2,q:'In 1H NMR, the number of signals equals:',
    opts:['The total number of hydrogens','The number of chemically different (non-equivalent) hydrogens','The number of carbons','The molecular weight'],correct:1,
    why:'Each set of chemically equivalent hydrogens gives one signal; use symmetry to count the distinct environments.',
    diag:{0:'Equivalent hydrogens share a signal, so the total H count is usually higher.',2:'Carbons are counted by 13C NMR, not 1H.',3:'Molecular weight is unrelated to signal count.'}},
  sp4:{skill:'spec',diff:1,q:'By the n+1 rule, a hydrogen with 2 neighboring hydrogens appears as a:',
    opts:['Singlet','Doublet','Triplet','Quartet'],correct:2,
    why:'2 neighbors give 2+1 = 3 peaks, which is a triplet.',
    diag:{0:'A singlet means 0 neighbors.',1:'A doublet means 1 neighbor.',3:'A quartet means 3 neighbors.'}},
  sp5:{skill:'spec',diff:2,q:'In ethanol, the CH2 group (next to a CH3) appears as a:',
    opts:['Singlet','Doublet','Triplet','Quartet'],correct:3,
    why:'The CH2 has 3 neighboring hydrogens on the adjacent CH3, so 3+1 = 4 peaks = a quartet.',
    diag:{0:'A singlet needs 0 neighbors; the CH2 has 3.',1:'A doublet needs 1 neighbor.',2:'A triplet needs 2 neighbors; here there are 3.'}},
  sp6:{skill:'spec',diff:2,q:'An alcohol or carboxylic acid O-H proton in 1H NMR typically appears as a:',
    opts:['Triplet','Quartet','Singlet','Doublet'],correct:2,
    why:'The oxygen isolates the O-H (it exchanges and does not couple), so it shows up as a singlet. Thomas: OH is always a singlet.',
    diag:{0:'The O-H does not split into a triplet; it is a singlet.',1:'Not a quartet either.',3:'Not a doublet; the O-H is isolated.'}},
  sp7:{skill:'spec',diff:2,q:'A 1H NMR peak near 9-10 ppm is characteristic of:',
    opts:['An alkyl CH3','An aromatic H','An aldehyde H (-CHO)','A vinyl H'],correct:2,
    why:'The 9-10 ppm region is the diagnostic window for the aldehyde hydrogen. Alkyl ~1, aromatic ~7, vinyl ~5-6.',
    diag:{0:'Alkyl hydrogens sit near 0.9-1.5 ppm.',1:'Aromatic hydrogens are near 7 ppm.',3:'Vinyl hydrogens are near 5-6 ppm.'}},
  sp8:{skill:'spec',diff:2,q:'In 13C NMR, a peak near 200 ppm indicates:',
    opts:['A carbonyl carbon (C=O)','An aromatic carbon','An alkyl carbon','No carbon'],correct:0,
    why:'Carbonyl carbons resonate far downfield (ketone ~205, ester/acid ~170-180). Aromatic carbons are ~120-150, aliphatic ~0-50.',
    diag:{1:'Aromatic carbons are near 120-150, not 200.',2:'Aliphatic carbons are near 0-50.',3:'A peak means a carbon is present; near 200 it is a carbonyl.'}},
  sz5:{skill:'stereo',diff:3,q:'A molecule has 2 stereocenters. What is the MAXIMUM number of stereoisomers, and what can lower it?',
    opts:['2, always','4 (that is 2^n), unless an internal mirror plane makes a meso form (then 3)','3, always','1'],correct:1,
    why:'n stereocenters give up to 2^n stereoisomers. A meso compound (an internal mirror plane) collapses two of them into one achiral molecule, so 2 centers give 3 instead of 4.',
    diag:{0:'Two centers give up to 2^2 = 4, not 2.',2:'3 is only the meso-reduced count; the general maximum is 4 (2^n).',3:'A single molecule is not the count of stereoisomers.'}},
  lt1:{skill:'labtech',diff:1,q:'Rf in TLC is defined as:',
    opts:['Distance the solvent front moved / distance the spot moved','Distance the spot moved / distance the solvent front moved','Spot size / plate size','Time up the plate'],correct:1,
    why:'Rf is the distance the spot traveled divided by the distance the solvent front traveled, a value between 0 and 1.',
    diag:{0:'That ratio is inverted; the spot distance goes on top.',2:'Rf is about distances traveled, not spot or plate size.',3:'Rf does not use time.'}},
  lt2:{skill:'labtech',diff:1,q:'On a polar silica TLC plate, the compound with the SMALLEST Rf is:',
    opts:['The least polar','The most polar (it sticks to the silica)','The lightest','The most volatile'],correct:1,
    why:'Polar compounds stick to the polar silica and travel the least, so the smallest Rf is the most polar. Stuck in the mud.',
    diag:{0:'The least polar travels farthest and has the LARGEST Rf.',2:'Molecular weight is not what determines Rf here.',3:'Volatility matters for distillation, not TLC migration.'}},
  lt3:{skill:'labtech',diff:2,q:'To move a carboxylic acid from an organic layer into the aqueous layer, you add:',
    opts:['A strong acid','A strong base, which deprotonates it to a charged carboxylate','More organic solvent','Water only'],correct:1,
    why:'A base deprotonates the acid to a charged carboxylate salt, which dissolves in the aqueous layer.',
    diag:{0:'Acid keeps it neutral and in the organic layer; base is what pulls it into water.',2:'Adding organic solvent does not change which layer it prefers.',3:'Water alone will not dissolve a neutral organic acid; you must charge it.'}},
  lt4:{skill:'labtech',diff:2,q:'During an acid-base extraction, a neutral nonpolar compound like bromobenzene stays in:',
    opts:['The aqueous layer','The organic layer','Neither layer','Both equally'],correct:1,
    why:'Bromobenzene is uncharged and nonpolar, so it remains in the organic layer while the charged species moves to water.',
    diag:{0:'Uncharged nonpolar compounds do not dissolve in water.',2:'It has to be in a layer; it stays organic.',3:'It strongly prefers organic, not both.'}},
  lt5:{skill:'labtech',diff:2,q:'In a separatory funnel, whether an organic solvent is the top or bottom layer is decided by:',
    opts:['Its polarity','Its density relative to water','Its color','Its boiling point'],correct:1,
    why:'Denser-than-water solvents (dichloromethane) sink to the bottom; lighter ones (diethyl ether) float on top.',
    diag:{0:'Polarity affects what dissolves where, not which layer is physically on top.',2:'Color is irrelevant.',3:'Boiling point matters for distillation, not layering.'}},
  lt6:{skill:'labtech',diff:2,q:'Two liquids boil only 5 C apart. The best way to separate them is:',
    opts:['Simple distillation','Fractional distillation','Recrystallization','Acid-base extraction'],correct:1,
    why:'Close boiling points need a fractionating column (fractional distillation); simple distillation needs a large bp gap.',
    diag:{0:'Simple distillation cannot resolve boiling points this close.',2:'Recrystallization purifies solids, not close-boiling liquids.',3:'Extraction separates by acidity/polarity, not boiling point.'}},
  lt7:{skill:'labtech',diff:2,q:'A high-boiling or heat-sensitive compound is best distilled by:',
    opts:['Simple distillation at high heat','Vacuum (reduced-pressure) distillation','Recrystallization','TLC'],correct:1,
    why:'Lowering the pressure lowers the boiling point, so the compound distills at a safer, lower temperature.',
    diag:{0:'High heat can decompose a heat-sensitive compound.',2:'Recrystallization is for solids, not distilling a liquid.',3:'TLC is an analytical technique, not a preparative separation.'}},
  lt8:{skill:'labtech',diff:1,q:'An impurity in a solid sample generally makes its melting point:',
    opts:['Higher and sharper','Lower and broader','Unchanged','Disappear entirely'],correct:1,
    why:'Impurities depress and broaden the melting point; a sharp, high melting point indicates a pure sample.',
    diag:{0:'Impurities lower the mp and make it broad, not higher and sharper.',2:'An impurity does change the mp.',3:'The sample still melts; the range just shifts and broadens.'}},
  rc1:{skill:'rcd',diff:1,q:'On a reaction-coordinate diagram, a peak represents a:',
    opts:['An intermediate','A transition state','A reactant','A product'],correct:1,
    why:'Peaks are transition states, the highest-energy points along the path, which cannot be isolated.',
    diag:{0:'Intermediates are the valleys between peaks, not the peaks.',2:'Reactants sit at the starting valley, not the top.',3:'Products sit at the ending valley.'}},
  rc2:{skill:'rcd',diff:1,q:'The dip (valley) between two peaks on a diagram is:',
    opts:['A transition state','An intermediate (it can briefly exist)','The final product','Nothing at all'],correct:1,
    why:'A valley between peaks is an intermediate, a real if short-lived species such as a carbocation.',
    diag:{0:'Transition states are the peaks, not the valleys.',2:'The final product is at the end, not in a mid-path dip.',3:'It is a real energy minimum, so it is a species.'}},
  rc3:{skill:'rcd',diff:1,q:'How many steps does a reaction with three humps (peaks) have?',
    opts:['One','Two','Three','Six'],correct:2,
    why:'The number of peaks equals the number of steps, so three peaks means three steps.',
    diag:{0:'One hump would be one step.',1:'Two humps would be two steps.',3:'Six is not how peaks map to steps; it is one step per peak.'}},
  rc4:{skill:'rcd',diff:2,q:'The rate-determining step of a multistep reaction is the one with the:',
    opts:['Lowest transition state','Highest-energy transition state (biggest barrier)','Most intermediates','Shortest path'],correct:1,
    why:'The highest-energy transition state is the biggest barrier, so it is the slowest step and controls the overall rate.',
    diag:{0:'The lowest barrier is the fastest step, not the rate-determining one.',2:'Number of intermediates does not set the rate.',3:'Path length is not the criterion.'}},
  rc5:{skill:'rcd',diff:1,q:'If the products are LOWER in energy than the reactants, the reaction is:',
    opts:['Endothermic','Exothermic','At equilibrium','Impossible'],correct:1,
    why:'Products below reactants means energy is released (downhill), which is exothermic (negative delta-G/delta-H).',
    diag:{0:'Endothermic is when products are HIGHER than reactants.',2:'Being downhill is not the same as being at equilibrium.',3:'It is perfectly possible; it is exothermic.'}},
  rc6:{skill:'rcd',diff:2,q:'An SN1 reaction shows how many humps on its reaction-coordinate diagram?',
    opts:['One (concerted)','Two (with a carbocation intermediate between them)','Three','Zero'],correct:1,
    why:'SN1 is two steps (ionize, then attack), so two humps with the carbocation intermediate in the valley. SN2 is one concerted hump.',
    diag:{0:'One concerted hump is SN2, not SN1.',2:'SN1 is two steps, not three.',3:'A reaction has at least one hump.'}},
  rc7:{skill:'rcd',diff:3,q:'By the Hammond postulate, the transition state of a strongly EXOTHERMIC step resembles:',
    opts:['The products','The reactants (an early transition state)','An intermediate only','Neither'],correct:1,
    why:'An exothermic step has an early transition state close in energy to the reactants, so the TS resembles the reactants.',
    diag:{0:'A late TS resembling products is the ENDOthermic case.',2:'The TS resembles the reactants here, not an intermediate.',3:'Hammond does relate the TS to a real species.'}},
  rc8:{skill:'rcd',diff:2,q:'The activation energy (Ea) of a step is the height:',
    opts:['From the products up to the peak','From a starting valley up to the next peak','From the x-axis up to the peak','Between two valleys'],correct:1,
    why:'Ea is the energy gap from the starting point (a valley) up to the transition state (the next peak).',
    diag:{0:'Ea is measured from the starting side, not from the products.',2:'It is measured from the starting valley, not the baseline axis.',3:'The gap between two valleys is the overall energy change, not Ea.'}},
  al1:{skill:'alkene',diff:1,q:'HBr adds to an alkene (no peroxide) with which regiochemistry?',
    opts:['Anti-Markovnikov','Markovnikov (Br to the more-substituted carbon)','Random','No reaction'],correct:1,
    why:'Without peroxide, HBr adds Markovnikov via the more stable carbocation, so Br ends up on the more-substituted carbon.',
    diag:{0:'Anti-Markovnikov needs a peroxide (radical conditions).',2:'The addition is regioselective, not random.',3:'The alkene definitely reacts with HBr.'}},
  al2:{skill:'alkene',diff:1,q:'Adding a PEROXIDE (ROOR) to the HBr + alkene reaction gives:',
    opts:['The Markovnikov product','The anti-Markovnikov product (radical mechanism)','An alcohol','No change'],correct:1,
    why:'Peroxide switches HBr to a radical chain that adds anti-Markovnikov. Look for the peroxide.',
    diag:{0:'Peroxide FLIPS it away from Markovnikov.',2:'HBr adds a bromide, not an OH.',3:'The peroxide changes the regiochemistry, so it is not "no change".'}},
  al3:{skill:'alkene',diff:2,q:'Which reagent gives an anti-Markovnikov alcohol with syn addition?',
    opts:['H2O / H+','Oxymercuration-demercuration','Hydroboration-oxidation (BH3 then H2O2/OH-)','Br2 / H2O'],correct:2,
    why:'Hydroboration-oxidation adds OH anti-Markovnikov and syn, with no rearrangement.',
    diag:{0:'Acid hydration gives the Markovnikov alcohol.',1:'Oxymercuration also gives the Markovnikov alcohol.',3:'Br2/H2O makes a halohydrin, not a simple anti-Markovnikov alcohol.'}},
  al4:{skill:'alkene',diff:2,q:'Oxymercuration-demercuration adds water to an alkene as:',
    opts:['An anti-Markovnikov OH','A Markovnikov OH with NO rearrangement','Two OH groups','An epoxide'],correct:1,
    why:'Oxymercuration gives the Markovnikov alcohol without carbocation rearrangement, unlike acid-catalyzed hydration.',
    diag:{0:'It is Markovnikov, not anti-Markovnikov.',2:'It adds one OH; two OH groups come from OsO4/KMnO4.',3:'An epoxide comes from mCPBA.'}},
  al5:{skill:'alkene',diff:2,q:'Br2 adds to an alkene with what stereochemistry?',
    opts:['Syn addition','Anti addition (trans, via a bromonium ion)','No stereochemistry','Markovnikov'],correct:1,
    why:'The cyclic bromonium ion forces the second bromide to attack from the opposite face, giving anti (trans) addition.',
    diag:{0:'Syn addition is hydroboration/OsO4/H2/Pd, not Br2.',2:'It is stereospecifically anti, not random.',3:'Markovnikov is a regiochemistry term; Br2 adds two identical Br atoms.'}},
  al6:{skill:'alkene',diff:2,q:'OsO4 (or cold dilute KMnO4) converts an alkene into a:',
    opts:['Trans diol','Cis (syn) diol','Single alcohol','Epoxide'],correct:1,
    why:'Syn-dihydroxylation delivers two OH groups to the same face, giving a cis (syn) diol.',
    diag:{0:'The two OH groups add syn, giving a cis diol, not trans.',2:'It adds two OH groups, not one.',3:'An epoxide comes from mCPBA, not OsO4.'}},
  al7:{skill:'alkene',diff:1,q:'Ozonolysis (O3, then workup) does what to a C=C double bond?',
    opts:['Adds two hydrogens','Cleaves it into two carbonyl compounds','Makes an epoxide','Adds Br2'],correct:1,
    why:'Ozonolysis breaks the C=C, giving two carbonyls (reductive workup with DMS/Zn = aldehydes/ketones; oxidative with H2O2 = acids).',
    diag:{0:'Adding two H is hydrogenation, not ozonolysis.',2:'An epoxide comes from mCPBA.',3:'Br2 addition is halogenation, not ozonolysis.'}},
  al8:{skill:'alkene',diff:1,q:'Catalytic hydrogenation (H2, Pd) adds two hydrogens to an alkene with what stereochemistry, giving what?',
    opts:['Anti addition','Syn addition (both H from the same face), giving the alkane','An alcohol','No reaction'],correct:1,
    why:'H2/Pd delivers both hydrogens from the same face of the catalyst (syn) to give the alkane.',
    diag:{0:'Hydrogenation is syn, not anti.',2:'It adds H atoms, not OH.',3:'The alkene is reduced to an alkane.'}},
  cb1:{skill:'carbonyl',diff:1,q:'Why do nucleophiles attack the carbonyl CARBON?',
    opts:['It is negatively charged','The carbon is electrophilic (delta+) because oxygen pulls electrons away','It carries a lone pair','It is aromatic'],correct:1,
    why:'The electronegative oxygen polarizes the C=O, leaving the carbon electron-poor (delta+) and therefore electrophilic.',
    diag:{0:'The carbon is electron-poor, not negatively charged; the oxygen is the negative end.',2:'The lone pairs are on oxygen, not the electrophilic carbon.',3:'A simple carbonyl carbon is not aromatic.'}},
  cb2:{skill:'carbonyl',diff:1,q:'NaBH4 will reduce which of these?',
    opts:['A carboxylic acid','An aldehyde or ketone (but not esters or acids)','An alkane','An ether'],correct:1,
    why:'NaBH4 is a mild hydride: it reduces aldehydes and ketones to alcohols but leaves esters and carboxylic acids alone.',
    diag:{0:'Carboxylic acids need the stronger LiAlH4.',2:'Alkanes have no carbonyl to reduce.',3:'Ethers are not reduced by NaBH4.'}},
  cb3:{skill:'carbonyl',diff:2,q:'Compared with NaBH4, LiAlH4:',
    opts:['Is weaker','Is stronger and also reduces carboxylic acids and esters','Does nothing','Only reduces alkenes'],correct:1,
    why:'LiAlH4 is a stronger hydride that reduces aldehydes, ketones, carboxylic acids, and esters to alcohols.',
    diag:{0:'LiAlH4 is stronger, not weaker, than NaBH4.',2:'It is a powerful reducing agent, not inert.',3:'Hydrides reduce carbonyls, not simple alkenes.'}},
  cb4:{skill:'carbonyl',diff:2,q:'A ketone reacts with a Grignard reagent (then acid workup) to give a:',
    opts:['Primary alcohol','Secondary alcohol','Tertiary alcohol','Carboxylic acid'],correct:2,
    why:'The ketone carbon already bears two R groups; the Grignard adds a third, giving a tertiary alcohol.',
    diag:{0:'A primary alcohol comes from formaldehyde + Grignard.',1:'A secondary alcohol comes from an aldehyde + Grignard.',3:'A Grignard adds a carbon and gives an alcohol, not an acid.'}},
  cb5:{skill:'carbonyl',diff:2,q:'An aldehyde or ketone plus two equivalents of an alcohol under acid gives an acetal, which is used as a:',
    opts:['Protecting group (removed later with aqueous acid)','Leaving group','Nucleophile','Catalyst'],correct:0,
    why:'The acetal shields the carbonyl from base and nucleophiles and is cleaved back to the carbonyl with aqueous acid.',
    diag:{1:'An acetal is not a leaving group.',2:'It is unreactive toward nucleophiles, which is why it protects.',3:'It is a protected form of the substrate, not a catalyst.'}},
  cb6:{skill:'carbonyl',diff:2,q:'A carbonyl plus a PRIMARY amine (RNH2) forms a(n):',
    opts:['Imine (Schiff base, C=N)','Enamine','Acetal','Alcohol'],correct:0,
    why:'A primary amine condenses with the carbonyl and loses water to give an imine (C=N).',
    diag:{1:'An enamine comes from a SECONDARY amine (no N-H left for a C=N).',2:'An acetal comes from alcohols, not amines.',3:'An amine gives a C=N or C=C-N, not a plain alcohol.'}},
  cb7:{skill:'carbonyl',diff:1,q:'The Wittig reaction converts a carbonyl (C=O) into a:',
    opts:['Carboxylic acid','Alkene (C=C)','Alcohol','Amine'],correct:1,
    why:'A phosphorus ylide replaces the carbonyl oxygen with a carbon, forming a C=C double bond (an alkene).',
    diag:{0:'The Wittig does not oxidize to an acid.',2:'It makes a C=C, not a C-OH.',3:'No nitrogen is introduced.'}},
  cb8:{skill:'carbonyl',diff:1,q:'Which is more reactive toward nucleophilic addition?',
    opts:['A ketone','An aldehyde (less steric hindrance and a more electrophilic carbon)','They are exactly equal','Neither reacts'],correct:1,
    why:'An aldehyde has only one R group (less steric hindrance) and a more electrophilic carbonyl carbon, so it is more reactive than a ketone.',
    diag:{0:'A ketone has two R groups, making it more hindered and less reactive.',2:'They differ: the aldehyde is more reactive.',3:'Both react; the aldehyde is faster.'}},
};

    concept:`<h3>The one idea</h3>
      <p><b>Stereochemistry is about arrangement in space</b> when connectivity is already the same. Two molecules with identical bonds can still be different objects — like your left and right hands.</p>
      <p>A carbon is a <b>stereocenter</b> when it holds <b>four different groups</b>. Swap any two and you get the mirror image. Non-superimposable mirror images are <b>enantiomers</b>; stereoisomers that are <em>not</em> mirror images are <b>diastereomers</b>; a molecule with stereocenters but an internal mirror plane is an achiral <b>meso</b> compound.</p>
      <div class="rule"><div class="rl">The CIP rule for R / S</div>
        <b>1.</b> Rank the four groups by atomic number at the first point of difference (higher Z = higher priority).<br>
        <b>2.</b> Point the <em>lowest</em> priority group away from you.<br>
        <b>3.</b> Trace 1 → 2 → 3. <b>Clockwise = R</b>, <b>counter-clockwise = S</b>.</div>
      <div class="rule"><div class="rl">The Fischer flip rule</div>
        In a Fischer projection, <b>horizontal bonds point toward you</b> (wedges), vertical go away (dashes). So the lowest-priority H is usually pointing at you — trace 1→2→3 and then <b>reverse</b> the answer.</div>
      <div class="trapbox"><div class="rl">The classic trap</div>
        <b>D/L is not R/S.</b> For lactic acid drawn with COOH on top: OH on the <b>left = L = (S)</b>; OH on the <b>right = D = (R)</b>. Memorize the pairing, but always confirm R/S by CIP.</div>
      <div class="coachbox"><div class="rl">Coach trick · Thomas</div>In a Fischer, <b>left/right doesn't matter — horizontal vs vertical does</b>. Lowest priority (usually H) on a <b>horizontal → flip</b> your answer; on a <b>vertical → keep</b> it (the "bow-tie" rule). And the <b>meso exception</b>: two chiral centers can give <b>3</b> stereoisomers, not 4, when there's an internal mirror plane.</div>

  aromatic:{accent:'var(--t2)',
    sub:'Aromaticity and electrophilic aromatic substitution — activators, deactivators, and the ortho/para/meta directing the DAT loves to test.',
    videoUrl:'tiktoks/eas-directors-tiktok.html', videoTitle:'EAS directors: who aims where (~1 min)',
    concept:`<h3>The pattern the DAT tests</h3>
      <div class="rule"><div class="rl">First: is it aromatic?</div>Aromatic = <b>cyclic + planar + fully conjugated</b> (an uninterrupted ring of p-orbitals) <b>+ 4n+2 π electrons</b> — the magic numbers <b>2, 6, 10, 14</b>. Cyclic/planar/conjugated but <b>4n</b> (4, 8, 12) = <b>anti-aromatic</b>. Count 2 π electrons per double bond; a lone pair counts only if it sits in the ring's p-system (pyrrole's N lone pair counts; pyridine's does not).</div>
      <p>Then, in electrophilic aromatic substitution, <b>the group already on the ring decides two things</b>: how fast the next substitution happens, and <em>where</em> it lands.</p>
      <div class="rule"><div class="rl">The directing rule</div><b>Electron donors</b> (–OH, –NH₂, –OR, alkyl) make the ring richer → activate (faster) and direct <b>ortho / para</b>.<br><b>Electron withdrawers</b> (–NO₂, C=O, –SO₃H, –CF₃) make it poorer → deactivate (slower) and direct <b>meta</b>.<br><b>Strength:</b> strong activators (–NH₂, –OH, –OR) &gt; weak (alkyl); strong deactivators (–NO₂, –NR₃⁺, C=O, –SO₃H) &gt; weak deactivators (the halogens, which still direct o/p).</div>
      <div class="trapbox"><div class="rl">The halogen exception</div>Halogens (F, Cl, Br, I) <b>deactivate</b> the ring but still direct <b>ortho / para</b> — poor ring, o/p seats. The classic DAT trap.</div>
      <div class="coachbox"><div class="rl">Coach trick · Thomas</div><b>LPOP</b> — Lone Pairs → Ortho-Para (plus alkyl R groups). <b>Flip the W</b> — a Withdrawing group, flip the W upside-down, gives M for Meta. Picture it: oxygen's the bully, "give me your electrons," so carbonyls pull density out of the ring and aim meta. Halogens keep their lone pairs (LPOP → o/p) but still crave the octet, so they deactivate.</div>
      <div class="depthnote"><b>DAT depth:</b> classify activating/deactivating and o/p vs meta, predict the major product and position, and check Hückel aromaticity (magic numbers 2, 6, 10, 14) — yes. Full arrow-by-arrow EAS mechanism and benzyne/NAS — not needed.</div>
      <p>Watch the one-minute explainer above for Thomas's LPOP hook, then work the examples and the mastery check.</p>`,
    worked:[
      {q:'Toluene (a methyl on benzene) is nitrated. Fast or slow versus benzene, and where does the –NO₂ end up?',
       steps:[
        {what:'Identify the group already on the ring: a methyl (–CH₃), an alkyl group.',why:'The existing group sets both the rate and the position.'},
        {what:'Alkyl groups weakly donate electron density into the ring.',why:'A donor makes the ring richer.',
         predict:{q:'A donor is an activator. Which positions does a donor send the next group to — ortho/para, or meta?',hint:'Where does a donor make the ring most electron-rich?'}},
        {what:'Donor → activator → ortho/para director. So nitration is a bit faster than benzene and the –NO₂ goes ortho and para to the methyl.',why:'Para usually dominates for sterics; some ortho forms too.'},
       ], answer:'Faster than benzene (methyl activates) and ortho/para (mostly para). Alkyl is a weak o/p-directing activator.'},
      {q:'Chlorobenzene is nitrated. Fast or slow versus benzene, and where?',
       steps:[
        {what:'Chlorine has lone pairs (LPOP → ortho/para) but is very electronegative and pulls electron density out of the ring by induction.',why:'Two opposing effects — resonance donation vs inductive withdrawal.'},
        {what:'Induction wins on RATE: the ring is electron-poorer, so nitration is slower than benzene.',why:'Halogens are net deactivators.',
         predict:{q:'Halogens deactivate the ring. Does that also make them meta directors, like other deactivators?',hint:'The lone pairs still do their LPOP job.'}},
        {what:'Resonance donation of the lone pairs wins on POSITION: still ortho/para. This is the halogen exception — LPOP wins the seat.',why:'Deactivate, yet direct o/p.'},
       ], answer:'Slower than benzene (Cl deactivates by induction) but ortho/para (Cl donates lone pairs by resonance). The classic halogen exception.'},
      {q:'Is benzene aromatic? Is cyclobutadiene? Is pyrrole?',
       steps:[
        {what:'Aromatic checklist: cyclic + planar + fully conjugated + 4n+2 π electrons (magic numbers 2, 6, 10, 14). Count 2 π electrons per double bond.',why:'Cyclic/planar/conjugated but 4n electrons = anti-aromatic instead.'},
        {what:'Benzene: 3 double bonds = 6 π electrons = a magic number → aromatic.',why:'Six is the classic aromatic count.',
         predict:{q:'Cyclobutadiene is a 4-membered ring with 2 double bonds = 4 π electrons. 4 is 4n, not a magic number. What does that make it?',hint:'It is cyclic, planar, and conjugated, but the count is 4n rather than 4n+2.'}},
        {what:'Cyclobutadiene: 4 π electrons = 4n → anti-aromatic (and very unstable). Pyrrole: 2 double bonds (4 π) plus the nitrogen lone pair in the ring p-system (2 more) = 6 π → aromatic.',why:'Pyrrole donates its N lone pair into the ring; pyridine does not (its lone pair is in-plane).'},
       ], answer:'Benzene aromatic (6 π), cyclobutadiene anti-aromatic (4 π), pyrrole aromatic (6 π, counting the N lone pair).'},
      {q:'A benzene ring bears a strong activator (–OH) and, para to it, a weak activator (–CH₃). Which group directs the next electrophile?',
       steps:[
        {what:'Both –OH and –CH₃ are activators and ortho/para directors, but they differ in strength.',why:'On a disubstituted ring, the two groups compete to control the position.'},
        {what:'When two directors compete, the STRONGER activator wins.',why:'It donates the most electron density, so it sets where the ring is richest.',
         predict:{q:'Both are ortho/para directors, but which one controls the position — the stronger or the weaker activator?',hint:'The group that pushes the most electron density into the ring dominates.'}},
        {what:'–OH is far stronger than –CH₃, so it directs. The electrophile goes ortho to the –OH (para is blocked by the methyl).',why:'And the crowded spot directly between two groups is usually skipped for sterics.'},
       ], answer:'The stronger activator (–OH) wins the directing contest, so the new group adds ortho/para to it (here ortho, since para is occupied). Rule of thumb: stronger activator directs, an o/p director beats a meta director, and skip the crowded position between two groups.'},

  acidbase:{accent:'var(--t0)',
    sub:'Ranking most acidic and most basic — the reasoning-heavy skill the DAT loves, and one the 2026 spec weights up.',
    concept:`<h3>The one idea</h3>
      <p>Acidity is about the <b>stability of the conjugate base</b> — the anion left after the acid loses its proton. The more stable that anion, the more willing the acid is to give up H⁺, so the <b>stronger the acid</b>. To rank acids, take the proton off each one and ask: which anion is happiest holding the negative charge?</p>
      <div class="rule"><div class="rl">What stabilizes the conjugate base → stronger acid</div>
        <b>Atom</b> — a more electronegative atom holds charge better across a row (O &gt; N &gt; C); a larger atom spreads it out down a column, and <b>size wins going down</b> (I⁻ &gt; Br⁻ &gt; Cl⁻ &gt; F⁻, so HI &gt; HBr &gt; HCl &gt; HF).<br>
        <b>Resonance</b> — spreading the charge over several atoms is a big stabilizer. Carboxylate shares its charge over two oxygens, so RCOOH (pKa ~4–5) beats ROH (pKa ~16).<br>
        <b>Induction</b> — nearby electron-withdrawing atoms pull charge away and stabilize the anion (Cl₃C–COOH ≫ CH₃COOH).<br>
        <b>Hybridization</b> — more s-character holds the lone pair closer to the nucleus: sp &gt; sp² &gt; sp³. A terminal alkyne C–H (sp, pKa ~25) is far more acidic than an alkane C–H (sp³, pKa ~50).<br>
        <b>Sterics</b> — a bulky base is a much poorer nucleophile but is still a strong base (steric bulk cuts nucleophilicity, not basicity), which is why hindered bases like t-BuO⁻ and LDA push reactions toward E2 elimination.</div>
      <div class="rule"><div class="rl">pKa landmarks — lower pKa = stronger acid</div>carboxylic acid ~4–5 · ammonium (RNH₃⁺) ~10 · phenol ~10 · water ~15.7 · alcohol ~16–18 · α-carbonyl C–H ~20 · terminal alkyne ~25 · alkane ~50.</div>
      <div class="coachbox"><div class="rl">Coach trick · Thomas</div><b>More resonance = stronger acid</b> — because resonance stabilizes the conjugate base. So always <b>judge acidity by the conjugate base</b>. Flip it for bases: <b>the strongest base has the least resonance</b> (a lone pair tied up in resonance is not available to grab a proton). And do not let the word "weak" fool you: HF (pKa ~3) is still far stronger than water (pKa ~16).</div>
      <div class="depthnote"><b>DAT depth:</b> rank most acidic/most basic by conjugate-base stability (atom/size, resonance, induction, hybridization, sterics), use approximate pKa landmarks, identify conjugate acid/base pairs, and predict which side an equilibrium favors (toward the weaker acid and weaker base) — yes. Memorizing pKa to decimals or Ka / Henderson–Hasselbalch computation (that is Gen Chem) — no.</div>`,

        {what:'Ethoxide vs hydroxide are close: alcohols and water sit near each other (pKa ~15–16), both far weaker than acetic acid.',why:'Neither has resonance, so the small difference between them is not what the DAT is testing here.'},

      {q:'Which is more acidic: a terminal alkyne C–H, or an alkane C–H?',
