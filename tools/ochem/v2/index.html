  subelim:{accent:'var(--t1)',
    sub:'SN1, SN2, E1, E2 — pick the winner from substrate, nucleophile/base, solvent, and temperature. The single most-tested DAT reaction skill.',
    concept:`<h3>Four reactions, one decision</h3>
      <p>SN1, SN2, E1, and E2 all compete for the same alkyl halide. Pick the winner by asking four questions.</p>
      <div class="rule"><div class="rl">The four questions</div>
        <b>1. Substrate.</b> Methyl / 1° → SN2 (no carbocation possible). 3° → SN1/E1 or E2, <em>never</em> SN2 (too hindered). 2° → the battleground, decided by the next three.<br>
        <b>2. Nucleophile / base.</b> Strong, small nucleophile → SN2. Strong, <em>bulky</em> base (t-BuOK, LDA) → E2. Weak nucleophile (water, ROH) → SN1/E1.<br>
        <b>3. Solvent.</b> Polar aprotic (DMSO, DMF, acetone) → SN2 (naked nucleophile). Polar protic (water, alcohols) → SN1/E1 (stabilizes the carbocation).<br>
        <b>4. Temperature.</b> Heat → elimination (E1/E2).<br>
        <b>Plus — the leaving group.</b> A good leaving group (a weak, stable base) is required: I⁻ &gt; Br⁻ &gt; Cl⁻ ≫ F⁻; tosylate and mesylate are excellent; –OH, –OR, and –F are poor.</div>
      <div class="rule"><div class="rl">Stereo &amp; regiochemistry</div>
        <b>SN2</b> — backside attack → <b>inversion</b> (Walden). <b>SN1</b> — planar carbocation, both faces → <b>racemization</b>. <b>E2</b> — the H and leaving group must be <b>anti-periplanar</b>.<br>
        <b>Zaitsev</b> (the default) = the more-substituted, more-stable alkene. <b>Hofmann</b> = the less-substituted alkene, from a <em>bulky</em> base.</div>
      <div class="trapbox"><div class="rl">Only carbocation mechanisms rearrange</div>SN1 and E1 pass through a carbocation, which can hydride- or methyl-shift to a <b>more stable</b> carbocation (2° → 3°) before the product forms. The concerted SN2 and E2 <b>never</b> rearrange.</div>
      <div class="coachbox"><div class="rl">Coach trick · Thomas</div><b>Heat is always elimination.</b> A <b>bulky base</b> (t-BuOK, LDA) means <b>Hofmann / E2</b>. And <b>the more stable the carbocation, the faster the reaction</b> — SN1/E1 rate tracks carbocation stability (3° &gt; 2° &gt; 1°). Tertiary substrate + strong base = E2.</div>
      <div class="depthnote"><b>DAT depth:</b> given substrate + nucleophile/base + solvent + temperature, pick SN1/SN2/E1/E2 and the major product with the right stereochemistry (inversion / racemization / anti-periplanar) and regiochemistry (Zaitsev vs Hofmann), plus spotting carbocation rearrangements — yes. Rate-law derivation and Winstein ion-pair analysis — not tested.</div>`,
    worked:[
      {q:'2-Bromobutane (a 2° substrate) reacts with cyanide (CN⁻, a strong, small nucleophile) in DMSO (polar aprotic), no heat. Which mechanism, and what happens to the stereochemistry?',
       steps:[
        {what:'Run the four questions: substrate 2°, nucleophile strong and small, solvent polar aprotic, no heat.',why:'A strong non-bulky nucleophile in polar aprotic solvent is the classic SN2 setup.'},
        {what:'Strong small nucleophile + polar aprotic → SN2.',why:'The naked CN⁻ attacks in one concerted step.',
         predict:{q:'SN2 is a backside attack. What does that do to the configuration at the stereocenter?',hint:'The nucleophile comes in opposite the leaving group.'}},
        {what:'Backside attack flips the configuration → inversion (Walden inversion).',why:'The CN ends up on the face opposite where Br left.'},
       ], answer:'SN2, with inversion of configuration. A strong small nucleophile + polar aprotic solvent on a 2° substrate is the textbook SN2.'},
      {q:'2-Bromo-3-methylbutane is left in warm ethanol (a weak nucleophile, polar protic). Why does the product look rearranged?',
       steps:[
        {what:'Substrate 2°, weak nucleophile (ethanol), polar protic → SN1/E1, which go through a carbocation.',why:'A weak nucleophile + protic solvent means a stepwise, carbocation pathway.'},
        {what:'The 2° carbocation sits right next to a carbon bearing an extra methyl.',why:'A more-substituted neighbor can donate a hydride.',
         predict:{q:'A 2° carbocation is next to a carbon that would give a 3° carbocation. Does it stay put, or shift?',hint:'Carbocations rearrange toward greater stability.'}},
        {what:'A hydride shift turns the 2° carbocation into the more stable 3° carbocation; the nucleophile/base then acts there → a rearranged product.',why:'Only SN1/E1 (carbocation mechanisms) can do this; SN2/E2 cannot.'},
       ], answer:'SN1/E1 go through a carbocation that hydride-shifts from 2° to the more stable 3°, so the product is rearranged. Concerted SN2/E2 would not rearrange.'},
      {q:'2-Bromo-2-methylbutane (a 3° substrate) is treated with (a) sodium ethoxide (NaOEt) versus (b) bulky potassium tert-butoxide (t-BuOK). What are the major elimination products?',
       steps:[
        {what:'A 3° substrate with a strong base does E2. The only difference is the size of the base.',why:'3° cannot do SN2; a strong base drives E2.'},
        {what:'The small base (NaOEt) removes the most accessible internal H to give the more-substituted alkene.',why:'That is the Zaitsev (more stable) product — the default.',
         predict:{q:'A bulky base like t-BuOK cannot reach the crowded internal H. Which alkene does it give — the more-substituted (Zaitsev) or the less-substituted (Hofmann)?',hint:'The bulky base can only grab an accessible terminal H.'}},
        {what:'Bulky t-BuOK removes a terminal H, giving the less-substituted Hofmann alkene.',why:'The size of the base flips the regiochemistry.'},

  spec:{accent:'var(--t3)',
    sub:'IR, ¹H NMR, and ¹³C NMR — read the spectra to name a functional group and deduce a small structure. Reliably high-yield on the DAT.',
    concept:`<h3>Three tools, one structure</h3>
      <p>IR tells you the <b>functional group</b>, ¹H NMR tells you the <b>hydrogen environments</b>, ¹³C NMR tells you the <b>carbon environments</b>. Combine them (plus degrees of unsaturation) to pin a small molecule.</p>
      <div class="rule"><div class="rl">IR — the key bands</div>
        <b>C=O</b> (carbonyl) <b>~1700–1750</b> — the strongest, most diagnostic band.<br>
        Broad <b>O–H</b> (alcohol) ~3200–3550; a carboxylic-acid O–H is even broader, ~2500–3300.<br>
        <b>N–H</b> ~3300–3500 (sharper than O–H). <b>C≡C / C≡N</b> ~2100–2260 (weak). sp³ C–H ~2850–2960; =C–H just above 3000.</div>
      <div class="rule"><div class="rl">¹H NMR — three questions</div>
        <b>1. Number of signals</b> = number of chemically <em>different</em> H (use symmetry).<br>
        <b>2. Integration</b> = relative <em>number</em> of H under each signal.<br>
        <b>3. Splitting (n+1)</b>: n neighboring H on adjacent carbons split a signal into <b>n+1</b> peaks — 0 = singlet, 1 = doublet, 2 = triplet, 3 = quartet.<br>
        <b>Shift regions (ppm):</b> alkyl ~0.9–1.5 · α-to-carbonyl ~2–2.5 · vinyl ~5–6 · aromatic ~7 · aldehyde ~9–10 · COOH ~11–12.</div>
      <div class="rule"><div class="rl">¹³C NMR</div>Number of signals = unique carbons (symmetry). Carbonyl <b>~200</b> (ketone ~205, ester/acid ~170–180) · aromatic ~120–150 · aliphatic ~0–50.</div>
      <div class="rule"><div class="rl">Degrees of unsaturation</div>DoU = (2C + 2 + N − H − X) / 2. Each <b>ring or π bond</b> = 1; a benzene ring = <b>4</b> (three π bonds + one ring). Use it with the spectra to place rings and double bonds.</div>
      <div class="coachbox"><div class="rl">Coach trick · Thomas</div><b>OH is always a singlet</b> — the oxygen is a bad neighbor that isolates that H, so an alcohol or acid O–H shows up with no splitting. And <b>count the unique peaks first, then apply n+1</b> — they usually do not give you integration, so count how many different H environments there are, then split each by its neighbors.</div>
      <div class="depthnote"><b>DAT depth:</b> read IR key bands to name a group; count ¹H signals, apply n+1 splitting, use integration and shift regions; count ¹³C signals and use rough regions; combine spectra to deduce a small structure — yes. Coupling constants (J in Hz), 2D NMR, and second-order multiplets — not tested. (Mass spec is not on the 2026 list.)</div>`,

  labtech:{accent:'var(--t3)',
    sub:'Separation and purification — TLC, extraction, distillation, recrystallization. A DAT signature the exam tests far more than a college course does.',
    concept:`<h3>Separate and purify</h3>
      <p>The DAT loves "how would you separate/purify this" questions. Master four techniques and their logic.</p>
      <div class="rule"><div class="rl">TLC / chromatography</div>
        <b>Rf = distance the spot traveled ÷ distance the solvent front traveled</b> (a number 0–1). On <em>polar silica</em>, more polar compounds <b>stick and travel less</b> → smaller Rf; less polar compounds travel farther → larger Rf. So <b>smallest Rf = most polar</b>.</div>
      <div class="rule"><div class="rl">Acid-base extraction</div>
        Two layers (aqueous + organic). Move a compound between them by changing its <b>charge</b>. Deprotonate a carboxylic acid with a strong base (NaOH / NaHCO₃) → the charged carboxylate salt goes into the <b>aqueous</b> layer; neutral nonpolar compounds (bromobenzene, hydrocarbons) stay in the <b>organic</b> layer. Reverse with acid. Which layer is on top is set by <b>density</b> (dichloromethane sinks; ether floats).</div>
      <div class="rule"><div class="rl">Distillation &amp; recrystallization</div>
        <b>Simple</b> distillation for bp gaps &gt; ~25 °C; <b>fractional</b> for close bps; <b>vacuum</b> (reduced-pressure) for high-boiling or heat-sensitive compounds. <b>Recrystallization</b>: hot-dissolve then cool slowly so pure product crystallizes and impurities stay in solution. An impurity <b>lowers and broadens</b> a melting point (a sharp mp = pure).</div>
      <div class="coachbox"><div class="rl">Coach trick · Thomas</div><b>TLC: "stuck in the mud."</b> Silica is polar mud — polar compounds stick and barely move, so the <b>smallest Rf is the most polar</b>. For <b>extraction</b>, ask two questions: is it acidic or basic, and how do I charge it up to pull it into the water layer? And remember: carboxylic acids are more polar than alcohols.</div>
      <div class="depthnote"><b>DAT depth:</b> compute Rf and rank polarity/elution, design an acid-base extraction (which layer, how to switch), pick simple vs fractional vs vacuum distillation, and reason about recrystallization and mp/bp for purity — yes. Apparatus assembly and theoretical-plate math — not tested.</div>`,

       steps:[
        {what:'Rf = distance the spot moved ÷ distance the solvent front moved; the silica plate is polar.',why:'The stationary phase polarity drives the separation.'},
        {what:'On polar silica, more polar compounds stick and travel less (smaller Rf).',why:'Polar-sticks-to-polar.',
         predict:{q:'Silica is polar mud that grabs polar compounds. Which one — the high-Rf 0.8 or the low-Rf 0.2 — is more polar?',hint:'Which one barely moved off the baseline?'}},
        {what:'B (Rf 0.2) barely moved → it stuck to the silica → it is more polar. "Stuck in the mud."',why:'Smallest Rf = most polar.'},
       ], answer:'B (Rf 0.2) is more polar — it stuck to the polar silica and traveled least. Smallest Rf = most polar.'},
      {q:'A mixture of benzoic acid (a carboxylic acid) and bromobenzene (neutral, nonpolar) is dissolved in ether. How do you separate them?',
       steps:[
        {what:'Add aqueous strong base (NaOH or NaHCO₃) and shake the two layers.',why:'Base will react only with the acidic component.'},
        {what:'The base deprotonates benzoic acid to a charged carboxylate salt.',why:'Charging it up changes where it dissolves.',

        {what:'The carboxylate salt moves into the AQUEOUS layer; bromobenzene (neutral, nonpolar) stays in the ORGANIC (ether) layer. Separate, then acidify the aqueous layer to recover the benzoic acid.',why:'Reprotonating returns it to a neutral, organic-soluble form.'},
       ], answer:'Wash with aqueous base: benzoic acid becomes a water-soluble carboxylate (aqueous layer) while bromobenzene stays in the ether (organic). Separate, then acidify to recover the benzoic acid.'},
      {q:'You need to separate two liquids whose boiling points differ by only 8 °C. Which distillation?',
       steps:[

         predict:{q:'The boiling points differ by only 8 °C — very close. Is simple distillation enough, or do you need fractional?',hint:'Simple distillation needs a big bp gap.'}},
        {what:'Close boiling points (8 °C) require fractional distillation.',why:'The fractionating column provides many re-vaporization cycles.'},
        {what:'Use vacuum (reduced-pressure) distillation instead if a compound is high-boiling or heat-sensitive.',why:'Lower pressure lowers the boiling point.'},

    ],

  rcd:{accent:'var(--t3)',
    sub:'Reading energy diagrams — transition states, intermediates, the rate-determining step, and Hammond. A new named subtopic on the 2026 DAT.',
    concept:`<h3>Read the energy landscape</h3>
      <p>A reaction-coordinate diagram plots energy (up) against reaction progress (across). Learn to read it — no math required.</p>
      <div class="rule"><div class="rl">Peaks, valleys, steps</div>
        <b>Peaks</b> = transition states (TS) — the highest points; fleeting, never isolated.<br>
        <b>Valleys between peaks</b> = intermediates — real dips that briefly exist (a carbocation lives here).<br>
        <b>Number of peaks (humps) = number of steps.</b> <b>Activation energy Ea</b> = the height from a starting valley up to the next peak.</div>
      <div class="rule"><div class="rl">Which step, which direction</div>
        <b>Rate-determining step</b> = the one with the <b>highest-energy transition state</b> (biggest barrier) — the slowest step sets the overall rate.<br>
        <b>Exothermic</b> = products lower than reactants (downhill, negative ΔG/ΔH). <b>Endothermic</b> = products higher (uphill).<br>
        <b>Hammond postulate:</b> a TS resembles whatever it is closer to in energy — an <em>early</em> TS (exothermic step) resembles the <b>reactants</b>; a <em>late</em> TS (endothermic step) resembles the <b>products</b>.</div>
      <div class="trapbox"><div class="rl">Mechanism shapes</div>SN1 / E1 = <b>two humps</b> (a carbocation intermediate sits in the valley between them). SN2 / E2 = <b>one hump</b> (concerted, no intermediate).</div>
      <div class="coachbox"><div class="rl">Coach trick · Thomas</div><b>The highest peak is the slowest step.</b> Count the humps to count the steps; the tallest one is rate-determining. A dip between peaks is an intermediate (something real); a peak is a transition state you can never bottle.</div>
      <div class="depthnote"><b>DAT depth:</b> read a diagram for TS vs intermediate, count steps, find the rate-determining step (highest peak), read Ea, call exo- vs endothermic, and apply Hammond qualitatively — yes. The Arrhenius equation and rate-constant / kinetics math — not tested.</div>`,
    worked:[
      {q:'A reaction-coordinate diagram has two humps with a dip between them. How many steps, and what is the species in the dip?',
       steps:[
        {what:'Count the humps: two peaks means two steps.',why:'Each peak is one transition state, so one step.'},
        {what:'Each peak is a transition state; the dip (valley) between them is a small energy minimum.',why:'A minimum can briefly exist as a real species.',
         predict:{q:'The dip between the two peaks is a small energy minimum that briefly exists. Is it a transition state or an intermediate?',hint:'Transition states are the peaks; the valley is something else.'}},
        {what:'The dip is an intermediate — for example, a carbocation.',why:'This two-hump shape is the SN1/E1 pattern.'},
       ], answer:'Two steps (two peaks). The dip is an intermediate (a briefly-existing species like a carbocation); each peak is a transition state. Two humps = SN1/E1.'},
      {q:'In a two-step diagram, the first peak is higher than the second. Which step is rate-determining?',
       steps:[
        {what:'The rate-determining step is the one with the highest-energy transition state (the biggest barrier).',why:'The slowest step is the bottleneck for the whole reaction.',
         predict:{q:'The first peak is higher than the second. Which step controls the overall rate?',hint:'Highest peak = slowest step.'}},
        {what:'The first peak is higher, so the first step is rate-determining.',why:'It is the largest barrier to climb.'},
       ], answer:'The first step — it has the highest-energy transition state (the highest peak), so it is the slowest step and sets the overall rate.'},
      {q:'A one-step reaction is strongly exothermic (products far below reactants). By the Hammond postulate, does the transition state resemble the reactants or the products?',
       steps:[
        {what:'Exothermic means the products sit lower than the reactants (downhill overall).',why:'Energy is released.'},
        {what:'An exothermic step has an early transition state — low, and close in energy to the reactants.',why:'The TS is reached quickly, near the start.',
         predict:{q:'The TS is early and low, close in energy to the starting materials. By Hammond, which species does it resemble?',hint:'A TS resembles whatever it is nearer to in energy.'}},
        {what:'So the TS resembles the reactants.',why:'A late TS (endothermic step) would instead resemble the products.'},
       ], answer:'The reactants — an exothermic step has an early transition state close in energy to the starting materials, so by Hammond the TS resembles the reactants. (Endothermic → late TS resembling products.)'},
    ],
    faded:[
      {prompt:'On a reaction-coordinate diagram, the peaks are ___ and the valleys between them are intermediates.',hint:'The highest points.',answer:'transition states'},
      {prompt:'The rate-determining step is the one with the ___ transition state.',hint:'The tallest peak.',answer:'highest-energy'},
      {prompt:'If the products sit LOWER than the reactants, the reaction is ___.',hint:'Energy is released.',answer:'exothermic'},
    ],

  alkene:{accent:'var(--t1)',
    sub:'Alkene addition — match the reagent to its product with the right regiochemistry (Markovnikov?) and stereochemistry (syn/anti). High-yield recognition.',
    concept:`<h3>The reagent map</h3>
      <p>Alkenes are electron-rich C=C that undergo <b>addition</b>. The DAT gives you a reagent and asks for the product — with the right <b>regiochemistry</b> and <b>stereochemistry</b>. Learn the map.</p>
      <div class="rule"><div class="rl">Regiochemistry (where things add)</div>
        <b>Markovnikov:</b> H goes to the carbon with more H's; the OH/X goes to the <b>more-substituted</b> carbon (via the more stable carbocation). <b>Anti-Markovnikov</b> is the reverse (OH/X on the less-substituted carbon).</div>
      <div class="rule"><div class="rl">Reagent → product</div>
        <b>HX</b> (HBr/HCl) → Markovnikov, may rearrange. <b>HBr + peroxide (ROOR)</b> → <b>anti-Markovnikov</b> (radical).<br>
        <b>H₂O / H⁺</b> → Markovnikov OH (may rearrange). <b>Oxymercuration</b> → Markovnikov OH, <b>no rearrangement</b>. <b>Hydroboration–oxidation</b> (BH₃, then H₂O₂/OH⁻) → <b>anti-Markovnikov OH + syn</b>.<br>
        <b>Br₂ / Cl₂</b> → <b>anti</b> addition of two halogens (trans, via halonium). <b>Halohydrin</b> (X₂/H₂O) → Markovnikov OH + anti. <b>mCPBA</b> → epoxide. <b>OsO₄ or cold KMnO₄</b> → <b>cis (syn) diol</b>. <b>O₃ then workup</b> → <b>cleaves</b> C=C to two carbonyls. <b>H₂ / Pd</b> → <b>syn</b> addition of two H (alkane).</div>
      <div class="coachbox"><div class="rl">Coach trick · Thomas</div><b>"Look for the peroxide."</b> HBr with peroxide (ROOR) flips to anti-Markovnikov; without it, Markovnikov. And for ozonolysis, <b>"H₂O₂ has a lot of O's"</b> → an oxidative workup gives the more-oxidized product (acids), while DMS (Zn) is "just an H" → reductive workup gives aldehydes/ketones.</div>
      <div class="depthnote"><b>DAT depth:</b> match a reagent to its product with the correct regiochemistry (Markovnikov vs anti) and stereochemistry (syn vs anti), and recognize cleavage (ozonolysis) — yes. Full arrow-pushing mechanisms and transition-state energetics — not tested.</div>`,
    worked:[
      {q:'2-methylpropene reacts with HBr. Where does the Br go? What changes if peroxide (ROOR) is added?',
       steps:[
        {what:'HBr alone adds Markovnikov: H to the carbon with more hydrogens, Br to the more-substituted carbon (the more stable 3° carbocation).',why:'The reaction goes through the more stable carbocation.',
         predict:{q:'HBr alone is Markovnikov. Does Br end up on the more-substituted or the less-substituted carbon?',hint:'Br follows the more stable carbocation.'}},
        {what:'Br → the more-substituted (3°) carbon → 2-bromo-2-methylpropane (tert-butyl bromide).',why:'Markovnikov puts the halide on the more-substituted carbon.'},
        {what:'Add PEROXIDE (ROOR): HBr now adds anti-Markovnikov (radical) → Br on the LESS-substituted carbon.',why:'The radical chain reverses the regiochemistry.'},
       ], answer:'HBr alone = Markovnikov (Br on the more-substituted carbon, tert-butyl bromide). Add peroxide and it flips to anti-Markovnikov (Br on the less-substituted carbon). Look for the peroxide.'},
      {q:'You want the anti-Markovnikov alcohol from an alkene. Which reagent — acid-catalyzed hydration, or hydroboration–oxidation?',
       steps:[
        {what:'Acid-catalyzed hydration (H₂O/H⁺) gives the Markovnikov alcohol and can rearrange.',why:'It goes through a carbocation.',
         predict:{q:'You need the OH on the LESS-substituted carbon (anti-Markovnikov). Which reagent puts it there — H₂O/H⁺, or BH₃ then H₂O₂/OH⁻?',hint:'One of them is the anti-Markovnikov, syn-addition alcohol reagent.'}},
        {what:'Hydroboration–oxidation (BH₃, then H₂O₂/OH⁻) gives the anti-Markovnikov alcohol with syn addition and no rearrangement.',why:'Boron adds to the less-hindered carbon; oxidation replaces it with OH.'},
       ], answer:'Hydroboration–oxidation (BH₃, then H₂O₂/OH⁻) — anti-Markovnikov OH with syn stereochemistry. Acid hydration and oxymercuration both give the Markovnikov alcohol instead.'},
      {q:'An alkene reacts with Br₂. Is the addition syn or anti? And what about H₂/Pd?',
       steps:[
        {what:'Br₂ goes through a cyclic bromonium ion; the second bromide attacks from the opposite face.',why:'The bromonium blocks one face.',
         predict:{q:'The second bromide attacks from the opposite face of the bromonium ion. Is that syn or anti addition?',hint:'Opposite faces — which label is that?'}},
        {what:'So Br₂ = anti addition (a trans-dibromide). H₂/Pd delivers both H atoms from the same face of the catalyst → syn addition.',why:'The metal surface adds both hydrogens from the same face.'},
       ], answer:'Br₂ adds ANTI (trans, via the bromonium ion); H₂/Pd adds SYN. Remember the syn set (hydroboration, OsO₄, H₂/Pd, epoxidation) vs the anti set (X₂, halohydrin).'},
    ],
    faded:[
      {prompt:'HBr adds to an alkene with Markovnikov regiochemistry — unless you add ___, which flips it to anti-Markovnikov.',hint:'The radical trigger.',answer:'peroxide'},

  carbonyl:{accent:'var(--t2)',
    sub:'The carbonyl (C=O) — nucleophilic addition. Match the nucleophile to the product: hydride, Grignard, alcohol, amine, ylide. High-yield recognition.',
    concept:`<h3>Attack the carbon</h3>
      <p>Oxygen pulls electrons, so the carbonyl <b>carbon is electrophilic (δ+)</b>. Nucleophiles attack that carbon — <b>nucleophilic addition</b>. Learn which nucleophile gives which product.</p>
      <div class="rule"><div class="rl">Reductions (add H⁻)</div>
        <b>NaBH₄</b> — mild: reduces aldehydes and ketones → alcohols; leaves esters and acids alone. <b>LiAlH₄</b> — strong: reduces aldehydes, ketones, <b>and</b> carboxylic acids and esters → alcohols.</div>
      <div class="rule"><div class="rl">Carbon nucleophiles</div>
        <b>Grignard (RMgX) / RLi</b> — adds an R to the carbonyl carbon; acid workup → an alcohol. Formaldehyde → 1° · aldehyde → 2° · ketone → 3° (ester adds twice). Water or any protic H <em>destroys</em> a Grignard. <b>HCN</b> → cyanohydrin (CN + OH).</div>
      <div class="rule"><div class="rl">Oxygen &amp; nitrogen nucleophiles, Wittig</div>
        <b>2 ROH</b> (acid cat.) → <b>acetal</b> (hemiacetal is the intermediate) — a <b>protecting group</b>, reversible with aqueous acid. <b>Primary amine (RNH₂)</b> → <b>imine</b> (C=N, a Schiff base). <b>Secondary amine (R₂NH)</b> → <b>enamine</b> (C=C–N). <b>Wittig ylide</b> → converts C=O to <b>C=C</b> (an alkene).</div>
      <div class="coachbox"><div class="rl">Coach trick · Thomas</div>Match the nucleophile to the product: H⁻ (NaBH₄/LiAlH₄) → alcohol; R⁻ (Grignard) → a bigger alcohol; RNH₂ → imine, R₂NH → enamine; 2 ROH → acetal (a protecting group); ylide → alkene. And <b>aldehydes are more reactive than ketones</b> — one less R means less crowding and a more electrophilic carbon.</div>
      <div class="depthnote"><b>DAT depth:</b> match a carbonyl + reagent to the product; know NaBH₄ vs LiAlH₄ scope, the Grignard alcohol class, acetal-as-protecting-group, imine vs enamine, Wittig, aldehyde &gt; ketone reactivity, and keto-enol tautomerism / α-acidity at recognition — yes. Full arrow-pushing and aldol/Claisen mechanism detail — not tested.</div>`,

      {prompt:'An aldehyde or ketone plus two alcohols (acid catalyst) forms an ___, used as a protecting group.',hint:'Two OR groups on one carbon.',answer:'acetal'},
    ],
    practice:['cb1','cb2','cb4','cb6','cb7','cb8'],
    mastery:['cb3','cb5','cb2','cb4','cb6','cb8','cb1','cb7'],

};

/* ---- STATE ---- */
const KEY='ochem-v2';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let ST=load();
ST.mastery=ST.mastery||{};      // {id:'partial'|'mastered'}
ST.stages=ST.stages||{};        // {id:{cur, done:[]}}
ST.sr=ST.sr||{};                // {bankId:{ef,interval,due,reps}}

function isUnlocked(m){return m.prereqs.every(p=>ST.mastery[p]==='mastered');}
function isAuthored(id){const c=CONTENT[id];return !!(c&&c.worked&&c.worked.length);}
function hasContent(id){const c=CONTENT[id];return !!(c&&(c.concept||(c.worked&&c.worked.length)));}
function statusOf(m){
  if(ST.mastery[m.id]==='mastered')return'mastered';
  if(ST.mastery[m.id]==='partial')return'partial';
  // any module with renderable content is reachable, so rich content (e.g. the EAS explainer) is never soft-locked
  return (isUnlocked(m)||hasContent(m.id))?'unlocked':'locked';
}
function masteredCount(){return MODS.filter(m=>ST.mastery[m.id]==='mastered').length;}

/* ---- SR-lite (SM-2) ---- */
function schedule(id,correct){
  const s=ST.sr[id]||{ef:2.5,interval:0,due:Date.now(),reps:0};
  if(correct){s.interval=s.reps===0?1:s.reps===1?3:Math.max(1,Math.round(s.interval*s.ef));s.reps++;}
  else{s.reps=0;s.interval=1;}
  s.ef=Math.max(1.3,s.ef+(correct?0.1:-0.3));
  s.due=Date.now()+s.interval*86400000;
  ST.sr[id]=s;save(ST);
}

/* ---- RENDER: tree ---- */
const treeEl=document.getElementById('tree');
const mainEl=document.getElementById('main');
let activeId=null;
function renderTree(){
  treeEl.innerHTML='';
  TIERS.forEach(t=>{
    const block=document.createElement('div');block.className='tier-block';
    const lbl=document.createElement('div');lbl.className='tier-lbl '+t.cls;lbl.textContent=t.label;
    block.appendChild(lbl);
    MODS.filter(m=>m.tier===t.n).forEach(m=>{
      const st=statusOf(m);
      const b=document.createElement('button');
      b.className='node s-'+st+' '+t.cls+(m.id===activeId?' active':'');
      b.style.setProperty('--tc','var(--t'+m.tier+')');
      b.disabled=(st==='locked');
      b.setAttribute('aria-label',m.name+' — '+st);
      const authored=!!(CONTENT[m.id]&&CONTENT[m.id].worked&&CONTENT[m.id].worked.length);
      b.innerHTML='<span class="dot" aria-hidden="true"></span><span class="nm">'+m.name+'</span>'+
        (st==='locked'?'<span class="lk">in development</span>':(st==='mastered'?'<span class="lk" style="color:var(--good)">done</span>':(authored?'':'<span class="lk">soon</span>')));
      b.addEventListener('click',()=>openModule(m.id));
      block.appendChild(b);
    });
    treeEl.appendChild(block);
  });
  document.getElementById('statMastered').textContent=masteredCount();
  const liveN=MODS.filter(m=>isAuthored(m.id)).length||1;
  const frac=Math.min(1,masteredCount()/liveN);
  const fg=document.getElementById('pringFg');
  if(fg)fg.setAttribute('stroke-dashoffset',(94.25*(1-frac)).toFixed(1));
}

function figWireHover(root, cb){
  root.querySelectorAll('.hot').forEach(g=>{
    const set=()=>cb(g.dataset.k,g);
    g.addEventListener('mouseenter',set);
    g.addEventListener('focus',set);
    g.addEventListener('click',set);
    g.setAttribute('tabindex','0');
  });
}
function figDetail(root){return root.querySelector('.figdetail');}

const FIGX = {
  stereo(root){const d=figDetail(root);const base=d.innerHTML;figWireHover(root,k=>{d.innerHTML=FIG_TEXT.stereo[k];});root.addEventListener('mouseleave',()=>d.innerHTML=base);},
  acidbase(root){const d=figDetail(root);const base=d.innerHTML;figWireHover(root,k=>{d.innerHTML=FIG_TEXT.acidbase[k];});root.addEventListener('mouseleave',()=>d.innerHTML=base);},
  subelim(root){const d=figDetail(root),base=d.innerHTML;const clr=()=>{root.classList.remove('dim');root.querySelectorAll('.hot').forEach(x=>x.classList.remove('sel'));d.innerHTML=base;};figWireHover(root,(k,g)=>{d.innerHTML=FIG_TEXT.subelim[k];root.classList.add('dim');root.querySelectorAll('.hot').forEach(x=>x.classList.remove('sel'));g.classList.add('sel');});root.addEventListener('mouseleave',clr);},
  spec(root){const d=figDetail(root);const base=d.innerHTML;figWireHover(root,k=>{d.innerHTML=FIG_TEXT.spec[k];});root.addEventListener('mouseleave',()=>d.innerHTML=base);},
  alkene(root){const d=figDetail(root),base=d.innerHTML;const clr=()=>{root.classList.remove('dim');root.querySelectorAll('.hot').forEach(x=>x.classList.remove('sel'));d.innerHTML=base;};figWireHover(root,(k,g)=>{d.innerHTML=FIG_TEXT.alkene[+k];root.classList.add('dim');root.querySelectorAll('.hot').forEach(x=>x.classList.remove('sel'));g.classList.add('sel');});root.addEventListener('mouseleave',clr);},

  aromatic(root){
    const d=figDetail(root),sub=root.querySelector('#arSub');

function wireFigs(scope){
  (scope||document).querySelectorAll('.fig[data-fig]').forEach(f=>{const fn=FIGX[f.dataset.fig];if(fn)try{fn(f);}catch(e){}});
}

/* ---- RENDER: module ---- */
const STAGE_NAMES=['Concept','Worked examples','Faded practice','Independent','Mastery check'];
function stageState(id){return ST.stages[id]||(ST.stages[id]={cur:0,done:[]});}
function openModule(id){
  const m=MOD_BY_ID[id];activeId=id;renderTree();
  mainEl.focus();
  if(statusOf(m)==='locked'){
    const need=m.prereqs.filter(p=>ST.mastery[p]!=='mastered').map(p=>MOD_BY_ID[p].name);
    mainEl.innerHTML='<div class="locked-note"><h2 style="margin:0 0 10px">'+m.name+'</h2>'+
      '<p><b>In development.</b> This module is being authored. When it lands, it will build on:</p><ul style="margin:8px 0;padding-left:20px;color:var(--ink-2)">'+need.map(n=>'<li>'+n+'</li>').join('')+'</ul>'+
      '<button class="next-btn ghost" id="backHome">Back to the tree</button></div>';
    document.getElementById('backHome').addEventListener('click',renderHome);
    return;
  }
  const c=CONTENT[id];
  if(!c||!c.worked||!c.worked.length){
    mainEl.innerHTML='<div class="mod-view"><div class="mod-top"><span class="mod-kicker" style="--mc:'+(c&&c.accent||'var(--gold)')+'">Tier '+m.tier+'</span></div>'+
      '<h2>'+m.name+'</h2><p class="mod-sub">'+((c&&c.sub)||'This module is scaffolded and unlocked; its full five-stage content lands in an upcoming build pass.')+'</p>'+
      (c&&c.videoUrl?'<button class="watch-btn" id="modWatch">Watch: '+(c.videoTitle||'coach explainer')+'</button>':'')+
      (c&&c.concept?'<div class="card">'+c.concept+'</div>':'')+
      '<button class="next-btn ghost" id="backHome">Back to the tree</button></div>';
    const mw=document.getElementById('modWatch');if(mw)mw.addEventListener('click',()=>VID.open(c.videoUrl,c.videoTitle));
    const bh=document.getElementById('backHome');if(bh)bh.addEventListener('click',renderHome);
    return;
  }
  renderStage(id);
}

const TIER_LABEL=['Foundations','Core Reactions','Patterns','Test-Day'];
function renderStage(id){
  const m=MOD_BY_ID[id],c=CONTENT[id],ss=stageState(id),mastered=ST.mastery[id]==='mastered';
  let body='<div class="mod-view"><div class="mod-top"><span class="mod-kicker" style="--mc:'+(c.accent||'var(--gold)')+'">Tier '+m.tier+' · '+TIER_LABEL[m.tier]+'</span></div>'+
    '<h2 tabindex="-1">'+m.name+'</h2><p class="mod-sub">'+c.sub+'</p>';
  const far=Math.max(ss.cur,ss.max||0,ss.done.length?Math.max.apply(null,ss.done):0);
  body+='<div class="stage-pills">'+STAGE_NAMES.map((n,i)=>{
    const reached=ss.done.indexOf(i)>=0||i<=far||mastered;
    const cls=ss.done.indexOf(i)>=0?'done':(i===ss.cur?'cur':'');
    return reached
      ?'<button class="pill '+cls+'" data-stage="'+i+'">'+(i+1)+' · '+n+'</button>'
      :'<span class="pill '+cls+'">'+(i+1)+' · '+n+'</span>';}).join('')+'</div>';
  body+='<div class="stage-track"><i id="stageBar"></i></div>';
  body+='<div id="stageBody"></div></div>';
  mainEl.innerHTML=body;
  const bar=document.getElementById('stageBar');
  if(bar){const pct=mastered?100:Math.round((far/4)*100);requestAnimationFrame(()=>{bar.style.width=pct+'%';});}
  mainEl.querySelectorAll('.stage-pills button').forEach(b=>b.addEventListener('click',()=>{const s=stageState(id);s.max=Math.max(s.max||0,s.cur);s.cur=+b.dataset.stage;save(ST);renderStage(id);}));
  drawStageBody(id);
  const h=mainEl.querySelector('.mod-view h2'); if(h)h.focus();
}

function markStageDone(id,idx){
  const ss=stageState(id);
  if(ss.done.indexOf(idx)<0)ss.done.push(idx);
  ss.cur=Math.max(ss.cur,Math.min(idx+1,4));
  ss.max=Math.max(ss.max||0,ss.cur);
  ST.mastery[id]=ss.done.length>=5?'mastered':'partial';
  save(ST);renderTree();
}

function drawStageBody(id){
  const c=CONTENT[id],ss=stageState(id),el=document.getElementById('stageBody');
  const stage=ss.cur;
  if(stage===0){ // Concept
    el.innerHTML=(FIG[id]?'<figure class="fig" data-fig="'+id+'">'+FIG[id]+'</figure>':'')+(c.videoUrl?'<button class="watch-btn" id="cWatch">Watch: '+(c.videoTitle||'coach explainer')+'</button>':'')+'<div class="card">'+c.concept+'</div><button class="next-btn" id="s0">I’ve got the idea — continue</button>';
    const cw=document.getElementById('cWatch');if(cw)cw.addEventListener('click',()=>VID.open(c.videoUrl,c.videoTitle));
    document.getElementById('s0').addEventListener('click',()=>{markStageDone(id,0);renderStage(id);});wireFigs(el);
  } else if(stage===1){ // Worked
    drawWorked(id);
  } else if(stage===2){ // Faded
    drawFaded(id);
  } else if(stage===3){ // Independent
    drawBankSet(id,c.practice,'independent');
  } else if(stage===4){ // Mastery
    drawMastery(id);
  } else { // stage>=5 : module already mastered — recap + a way back
    el.innerHTML='<div class="celebrate"><h3>'+MOD_BY_ID[id].name+' — mastered.</h3><p>You cleared all five stages and the mastery check. Use the stage pills above to revisit any part, or head back to the tree for your next module.</p></div>'+
      '<button class="next-btn ghost" id="backTree">Back to the tree</button>';
    document.getElementById('backTree').addEventListener('click',renderHome);
  }
}

/* stage 1 — worked examples: reveal ONE step at a time; for predict steps the
   'why' is withheld until the student commits, so the answer never sits above the question */
function drawWorked(id){
  const c=CONTENT[id],el=document.getElementById('stageBody');
  let i=0;
  function render(){
    const w=c.worked[i];
    let h='<div class="card"><h3>Worked example '+(i+1)+' of '+c.worked.length+'</h3><p><b>'+w.q+'</b></p>';
    if(w.fischer)h+='<div class="fischer">'+w.fischer+'</div>';
    h+='<div id="stepwrap"></div></div>';
    el.innerHTML=h;
    const sw=document.getElementById('stepwrap');
    let si=0;
    function showStep(){
      const s=w.steps[si];
      const stepEl=document.createElement('div');stepEl.className='step';
      stepEl.innerHTML='<div class="what">'+s.what+'</div>';
      sw.appendChild(stepEl);
      const reveal=()=>{ stepEl.insertAdjacentHTML('beforeend','<div class="why">'+s.why+'</div>'); toNext(); };
      if(s.predict){
        const pd=document.createElement('div');pd.className='predict';
        pd.innerHTML='<div class="q">'+s.predict.q+'</div><div class="hint">'+s.predict.hint+'</div><button class="reveal-btn">Commit — reveal</button>';
        sw.appendChild(pd);
        pd.querySelector('button').addEventListener('click',()=>{pd.remove();reveal();});
      } else {
        const b=document.createElement('button');b.className='reveal-btn';b.textContent='Reveal why';
        sw.appendChild(b);
        b.addEventListener('click',()=>{b.remove();reveal();});
      }
    }
    function toNext(){
      si++;
      if(si<w.steps.length){
        const nb=document.createElement('button');nb.className='next-btn ghost';nb.textContent='Next step';
        sw.appendChild(nb);
        nb.addEventListener('click',()=>{nb.remove();showStep();});
      } else finishExample();
    }
    function finishExample(){
      const done=document.createElement('div');done.className='fb good';done.innerHTML='<div class="lab">The move</div>'+w.answer;
      sw.appendChild(done);
      const btn=document.createElement('button');btn.className='next-btn';
      btn.textContent=i<c.worked.length-1?'Next worked example':'Continue to faded practice';
      btn.addEventListener('click',()=>{ if(i<c.worked.length-1){i++;render();} else {markStageDone(id,1);renderStage(id);} });
      sw.appendChild(btn);
    }
    showStep();
  }
  render();
}

/* stage 2 — faded fill-in */
function drawFaded(id){
  const c=CONTENT[id],el=document.getElementById('stageBody');
  let i=0;
  function render(){
    const f=c.faded[i];
    el.innerHTML='<div class="card"><h3>Faded practice '+(i+1)+' of '+c.faded.length+'</h3>'+
      '<p>'+f.prompt.replace('___','<b style=\"color:var(--gold)\">___</b>')+'</p>'+
      '<div class="predict"><div class="hint">'+f.hint+'</div></div>'+
      '<input id="fin" type="text" aria-label="Your answer" placeholder="Fill the blank yourself first, then reveal" autocomplete="off" spellcheck="false" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);color:var(--ink);font:inherit;font-size:14px;margin:6px 0 10px">'+
      '<button class="reveal-btn" id="rev">Reveal answer</button><div id="fans"></div></div>';
    document.getElementById('fin').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('rev').click();});
    document.getElementById('rev').addEventListener('click',()=>{
      if(document.getElementById('fans').innerHTML)return;
      const norm=s=>String(s||'').trim().toLowerCase().replace(/\b(and|the)\b/g,'').replace(/[^a-z0-9+]/g,'');
      const typed=norm(document.getElementById('fin').value), ans=norm(f.answer);
      const ok=!!typed&&(typed===ans||(ans.length>=4&&(typed.indexOf(ans)>=0||(ans.startsWith(typed)&&typed.length>=3))));
      document.getElementById('fans').innerHTML='<div class="fb '+(ok?'good':'bad')+'"><div class="lab">'+(ok?'Nice — that is it':(typed?'Not quite — the answer is':'Answer'))+'</div><b>'+f.answer+'</b></div>';
      const b=document.createElement('button');b.className='next-btn';
      b.textContent=i<c.faded.length-1?'Next':'Continue to independent practice';
      b.addEventListener('click',()=>{if(i<c.faded.length-1){i++;render();}else{markStageDone(id,2);renderStage(id);}});
      document.getElementById('fans').appendChild(b);
      document.getElementById('rev').style.display='none';
    });
  }
  render();
}

/* stage 3 — independent bank set */
function drawBankSet(id,ids,mode){
  const el=document.getElementById('stageBody');
  let i=0;
  function render(){
    const q=BANK[ids[i]];
    let h='<div class="card"><h3>Independent practice '+(i+1)+' of '+ids.length+'</h3><p><b>'+q.q+'</b></p><div class="opts" role="group" aria-label="Answer choices">';
    q.opts.forEach((o,idx)=>{h+='<button class="opt" data-i="'+idx+'"><span class="lt">'+'ABCD'[idx]+'</span><span>'+o+'</span></button>';});
    h+='</div><div id="qfb" aria-live="polite"></div></div>';
    el.innerHTML=h;
    el.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{
      const idx=+btn.dataset.i,correct=idx===q.correct;
      el.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.i===q.correct)o.classList.add('correct');});
      if(!correct)btn.classList.add('wrong');
      schedule(ids[i],correct);
      const fb=document.getElementById('qfb');
      fb.innerHTML='<div class="fb '+(correct?'good':'bad')+'"><div class="lab">'+(correct?'Correct':'Not quite')+'</div>'+
        (correct?'':'<b>'+(q.diag[idx]||'Not the move.')+'</b><br>')+q.why+
        (correct?'':'<br><span style="color:var(--good);font-weight:600">Correct answer: '+'ABCD'[q.correct]+' — '+q.opts[q.correct]+'</span>')+'</div>';
      const b=document.createElement('button');b.className='next-btn';
      b.textContent=i<ids.length-1?'Next question':'Finish this set';
      b.addEventListener('click',()=>{if(i<ids.length-1){i++;render();}else{markStageDone(id,3);renderStage(id);}});
      fb.appendChild(b);b.focus();
    }));
  }
  render();
}

/* stage 4 — mastery check: 3 correct in a row, cycling the module's mastery pool */
function drawMastery(id){
  const c=CONTENT[id],el=document.getElementById('stageBody');
  const pool=c.mastery.slice();
  let streak=0,pi=0;
  function render(){
    const q=BANK[pool[pi%pool.length]];
    let h='<div class="mastery-meter">Get <b style="color:var(--gold)">3 in a row</b> to master this module.<span class="streak" aria-hidden="true">'+
      [0,1,2].map(k=>'<i class="'+(k<streak?'on':'')+'"></i>').join('')+'</span></div>';
    h+='<div class="card"><h3>Mastery check</h3><p><b>'+q.q+'</b></p><div class="opts" role="group" aria-label="Answer choices">';
    q.opts.forEach((o,idx)=>{h+='<button class="opt" data-i="'+idx+'"><span class="lt">'+'ABCD'[idx]+'</span><span>'+o+'</span></button>';});
    h+='</div><div id="mfb" aria-live="polite"></div></div>';
    el.innerHTML=h;
    el.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{
      const idx=+btn.dataset.i,correct=idx===q.correct;
      el.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.i===q.correct)o.classList.add('correct');});
      if(!correct)btn.classList.add('wrong');
      schedule(pool[pi%pool.length],correct);
      streak=correct?streak+1:0;pi++;
      document.querySelectorAll('.streak i').forEach((el,k)=>el.classList.toggle('on',k<streak));
      const fb=document.getElementById('mfb');
      fb.innerHTML='<div class="fb '+(correct?'good':'bad')+'"><div class="lab">'+(correct?'Correct — streak '+streak:'Streak restarts - rebuild it')+'</div>'+
        (correct?'':'<b>'+(q.diag[idx]||'')+'</b><br>')+q.why+
        (correct?'':'<br><span style="color:var(--good);font-weight:600">Correct answer: '+'ABCD'[q.correct]+' — '+q.opts[q.correct]+'</span>')+'</div>';
      const b=document.createElement('button');b.className='next-btn';
      if(streak>=3){b.textContent='See your result';b.addEventListener('click',()=>finishMastery(id));}
      else{b.textContent='Next';b.addEventListener('click',render);}
      fb.appendChild(b);b.focus();
    }));
  }
  render();
}

function finishMastery(id){
  const m=MOD_BY_ID[id],ss=stageState(id);
  [0,1,2,3,4].forEach(k=>{if(ss.done.indexOf(k)<0)ss.done.push(k);});
  ss.cur=5;ST.mastery[id]='mastered';save(ST);renderTree();
  const opened=MODS.filter(x=>x.prereqs.indexOf(id)>=0&&isUnlocked(x)).map(x=>x.name);
  mainEl.innerHTML='<div class="celebrate"><div class="seal"><svg viewBox="0 0 34 34" aria-hidden="true"><g fill="none" stroke="#1a1206" stroke-width="2.4" stroke-linecap="round"><path d="M11 7 Q5 17 11 27"/><path d="M23 7 Q29 17 23 27"/></g><circle cx="17" cy="17" r="3.4" fill="#1a1206"/></svg></div><h3>'+m.name+' — mastered.</h3>'+
    '<p>Three in a row — the module is yours. '+(opened.length?'You just unlocked: <b>'+opened.join(', ')+'</b>.':'Keep going — more unlocks as you clear prerequisites.')+'</p></div>'+
    '<button class="next-btn" id="toNext">'+(opened.length?'Open '+opened[0]:'Back to the tree')+'</button> '+
    '<button class="next-btn ghost" id="toHome">See the tree</button>';
  document.getElementById('toHome').addEventListener('click',renderHome);
  document.getElementById('toNext').addEventListener('click',()=>{
    if(opened.length){const t=MODS.find(x=>x.name===opened[0]);openModule(t.id);}else renderHome();
  });
}

/* ---- controls ---- */
(function(){try{const t=localStorage.getItem('ochem-v2-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;
  const next=isDark?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('ochem-v2-theme',next);}catch(e){}
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!window.confirm('Reset all module progress? This cannot be undone.'))return;
  ST={mastery:{},stages:{},sr:{}};save(ST);renderHome();
});

/* ---- video modal (coach explainers) ---- */
const VID={
  _opener:null,_trap:null,
  open(url,title){
    this._opener=document.activeElement;
    document.getElementById('vidTitle').textContent=title||'Coach explainer';
    document.getElementById('vidBody').innerHTML='<iframe src="'+url+'" allow="autoplay" title="'+(title||'coach explainer')+'"></iframe>';
    document.getElementById('vidModal').classList.add('show');
    document.body.style.overflow='hidden';
    const sh=document.querySelector('.shell'),tp=document.querySelector('.top');
    if(sh)sh.setAttribute('aria-hidden','true'); if(tp)tp.setAttribute('aria-hidden','true');
    this._trap=(e)=>{const card=document.querySelector('.vid-card');if(card&&!card.contains(e.target))document.getElementById('vidX').focus();};
    document.addEventListener('focusin',this._trap);
    document.getElementById('vidX').focus();
  },
  close(){
    document.getElementById('vidModal').classList.remove('show');document.getElementById('vidBody').innerHTML='';
    document.body.style.overflow='';
    const sh=document.querySelector('.shell'),tp=document.querySelector('.top');
    if(sh)sh.removeAttribute('aria-hidden'); if(tp)tp.removeAttribute('aria-hidden');
    if(this._trap){document.removeEventListener('focusin',this._trap);this._trap=null;}
    if(this._opener&&this._opener.focus)this._opener.focus();
  }
};
document.getElementById('vidX').addEventListener('click',()=>VID.close());
document.getElementById('vidModal').addEventListener('click',e=>{if(e.target.id==='vidModal')VID.close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('vidModal').classList.contains('show'))VID.close();});

/* ---- boot ---- */
renderHome();
</script>
