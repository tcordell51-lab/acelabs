<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>smiles probe</title></head>
<body style="background:#14120c;color:#eee;font-family:monospace">
<div id="out" style="display:flex;flex-wrap:wrap;gap:4px"></div>
<script src="../../../shared/smiles-drawer.min.js"></script>
<script type="module">
// Render every SMILES in ?s=a,b,c through draw.js, the renderer the tool
// actually ships, and report parse failures in window.RESULT. Probing the
// bare drawer instead let two renderer bugs through, so probe the real path.
import { drawSmiles } from './draw.js';
const list = (new URLSearchParams(location.search).get('s') || 'CCO,CC(=O)C,c1ccccc1,C/C=C/C,C[C@H](O)CC').split(',');
window.RESULT = { ok: [], bad: [] };
const errs = [];
const log = console.error;
console.error = (...a) => { errs.push(a.map(String).join(' ')); log(...a); };
const out = document.getElementById('out');
for (const s of list){
  const cell = document.createElement('div');
  cell.style.cssText = 'width:264px;height:190px;display:flex;align-items:center;justify-content:center';
  out.appendChild(cell);
  const before = errs.length;
  try {
    const svg = drawSmiles(cell, s, { width: 260, height: 180 });
    svg.setAttribute('width', 260); svg.setAttribute('height', 180);
    if (errs.length > before) window.RESULT.bad.push(s + ' :: ' + errs[errs.length - 1]);
    else window.RESULT.ok.push(s);
  } catch (e){ window.RESULT.bad.push(s + ' :: ' + e.message); }
}
</script>
</body></html>
