/* ---------- Original scenario bank (AceTheDAT IP) ---------- */
var SCENARIOS = [
  { id:1, tag:"Professionalism",
    stem:"You are working a group lab and notice a teammate, Priya, has been quiet, arriving late, and her portion of the work is incomplete two days before the deadline. Another teammate suggests reporting her to the instructor.",

  { id:3, tag:"Patient Advocacy",
    stem:"While volunteering at a clinic, you overhear a senior staff member give a patient information you believe is incorrect. The staff member is well-respected and busy.",

  { id:4, tag:"Fairness / Teamwork",
    stem:"You are leading a project and one member, Sam, has not contributed but expects equal credit. The deadline is in two days and the rest of the team is frustrated.",

  { id:5, tag:"Resource Allocation",
    stem:"You manage scheduling for a free dental screening event. Two patients arrive at the same time: an elderly man in visible discomfort without an appointment, and a young mother with an appointment who has waited two weeks and must leave soon for work.",

  { id:6, tag:"Self-Awareness",
    stem:"A peer gives you harsh feedback in front of others that your part of a presentation was disorganized. You felt it was unfair and somewhat public.",
    qs:["How do you respond in the moment?","What do you do afterward?","Describe how you would handle the relationship going forward."] },
  { id:7, tag:"Communication",
    stem:"Your roommate, Dev, has started having friends over loudly most nights the week before your major exams. You've hinted that you need quiet but nothing has changed, and you're starting to resent him.",

  { id:8, tag:"Equity",
    stem:"You run a study group. One member, Aisha, can't afford the paid prep materials everyone else is using and has gone quiet in sessions. The group voted to keep using those materials.",

  { id:10, tag:"Resilience",
    stem:"You receive a failing grade on an exam you studied hard for. You feel discouraged and are questioning whether you belong in this program.",

  { id:11, tag:"Empathy",
    stem:"A coworker, Lena, returns from bereavement leave after losing a parent. She seems withdrawn and is making small errors that others are quietly complaining about.",

    stem:"You notice your supervisor consistently gives the best opportunities to one employee who is also a personal friend, while equally capable colleagues are overlooked. People are starting to disengage.",

  { id:20, tag:"Resource Allocation",

    stem:"You've taken on work, school, a volunteer role, and caring for a family member. You're exhausted, your performance is slipping, and you feel guilty about dropping any commitment.",

/* Original model-answer LADDERS keyed by scenario id. Each shows the climb:
   q2 (≈2nd quartile) -> q3 (≈3rd) -> q4 (≈4th), plus a note naming what moved it up.
   AceTheDAT original coaching IP. Concise on purpose — Casper rewards concision. */
var MODELS = {
  1: {
    q2:"Priya clearly isn't pulling her weight, so I'd report her to the instructor. It's not fair that the rest of us do the work while she coasts, and she shouldn't get the same grade as people who actually showed up.",
    q3:"I'd be frustrated, but before doing anything I'd talk to Priya privately and ask if everything is okay, since there might be a reason she's been absent. I'd see if she can pick up part of the work before the deadline.",
    q4:"Before doing anything, I'd want to understand what's going on, because lateness and unfinished work often have a cause I can't see — illness, a family issue, or feeling lost in the material. I'd talk with Priya privately and without blame, let her know we've missed her input, and ask how she's doing and whether something is getting in the way. Then I'd focus on the immediate problem: with two days left, what can she realistically take on so the project succeeds? If she re-engages, there's no need to escalate. If the work still isn't getting done and the team's grade is at risk, I'd be honest that we may need to loop in the instructor — not to punish her, but so the situation is handled fairly for everyone.",
    note:"2nd to 3rd: drops the rush to report and opens with a private, non-judgmental check-in. 3rd to 4th: says what it would want to know instead of guessing the reason, ties the conversation to the two-day deadline, and makes escalation an explicit conditional last step rather than leaving it vague."
  },
  2: {
    q2:"I'd promise to keep it secret since they're my friend and they already feel bad. It's not my business to get involved, and telling anyone would just be a betrayal.",
    q3:"I'd listen and tell my friend I understand how guilty they feel. I'd gently suggest they think about coming forward, but ultimately I'd respect whatever they decide to do.",
    q4:"I'd start by listening — my friend trusted me and is clearly feeling guilty, and I want to respond with care, not judgment. I'd acknowledge how hard it is to carry that, and gently explore why they feel guilty, since that guilt suggests they already sense it wasn't right. I'd encourage them to consider coming forward themselves, and talk through what that could look like. I'd be honest that I can't promise blanket secrecy if keeping it would mean someone else is harmed or unfairly affected. My role as a friend isn't only to comfort them, but to help them do the right thing — especially if this exam affects fairness to other students.",
    note:"2nd to 3rd: replaces blanket secrecy with empathy plus a nudge toward ownership. 3rd to 4th: stops fully deferring — it names the limit on confidentiality when others could be harmed, and makes fairness to the other students the reason."
  },
  3: {
    q2:"The staff member is senior and respected, so I'd assume they know better and stay out of it. It's not my place to correct someone with more experience.",
    q3:"The patient's safety matters most, so I'd find a polite way to mention the correct information to the staff member. I wouldn't want to embarrass them, so I'd bring it up quietly.",
    q4:"My first concern is the patient getting accurate information, but I also don't want to assume I'm right or undermine a colleague publicly. I'd quietly check my own understanding first. Then I'd approach the staff member privately and respectfully — framing it as a question rather than an accusation, like 'I may have misheard, could you help me understand the guidance on X?' That gives them room to correct it without losing face, and surfaces the issue if I was right. If the patient is about to act on something potentially harmful, I'd make sure it's clarified before they leave, escalating through the proper channel if needed. Respecting authority and advocating for the patient aren't opposites; the goal is the patient's safety, handled tactfully.",
    note:"2nd to 3rd: stops deferring to hierarchy and prioritizes the patient. 3rd to 4th: verifies its own understanding first, frames the concern as a question rather than a correction, and adds a clear escalation path if the patient is about to act on something harmful."
  },
  4: {
    q2:"Sam did nothing, so he shouldn't get credit — I'd just tell the professor he didn't help and let him take the hit. Why should we cover for him?",
    q3:"I'd talk to Sam and ask why he hasn't contributed, and give him a chance to help finish. If he still does nothing, I'd let the professor know he didn't participate.",
    q4:"I'd separate two things: getting the project done in the next two days, and handling credit fairly. First I'd talk to Sam directly and privately to understand why he hasn't contributed — there may be something going on — and clearly invite him back in with a specific, doable task. I'd keep the rest of the team focused so the deadline isn't at risk. On credit, I believe it should reflect real contribution, so I'd be transparent: if Sam steps up, that changes things; if he doesn't, I'd have an honest conversation with him first, then, if needed, let the instructor know how the work was actually divided — factually, without hostility. Fairness to the group and fairness to Sam both matter, and giving him a genuine chance to contribute respects both.",
    note:"2nd to 3rd: gives Sam a fair chance and asks before judging. 3rd to 4th: separates finishing the project from handling credit, keeps the rest of the team on track, and makes the credit conversation honest and proportionate — Sam first, instructor only if needed."
  },
  5: {
    q2:"The man without an appointment didn't book, so the mother with the appointment goes first. Rules are rules — you can't reward people for just showing up.",
    q3:"I'd feel torn. I'd probably see the elderly man first since he's in pain, but I'd apologize to the mother and try to get her in quickly afterward.",
    q4:"Both people have real, competing needs, so I'd gather a little information before deciding. The elderly man is in visible discomfort, which raises a possible urgency concern; the young mother followed the process, has waited two weeks, and has a hard time limit for work. I'd quickly assess whether the man needs urgent attention — if so, that may take priority on need. If it's not urgent, I'd honor the mother's appointment, especially given her time constraint, while making sure the man is acknowledged, comfortable, and seen as soon as possible. Throughout, I'd communicate honestly and kindly to both: explaining the reasoning to each, apologizing for the wait, and offering concrete next steps so neither feels dismissed.",
    note:"2nd to 3rd: trades the rigid rule for compassion and a rough priority. 3rd to 4th: gathers information first (is the man's discomfort actually urgent?), weighs need against the mother's hard time limit, and commits to a reasoned decision communicated kindly to both."
  },
  6: {
    q2:"That was unfair and embarrassing, so I'd push back right there and let them know they had no right to call me out in front of everyone.",
    q3:"I'd stay calm in the moment and not argue in front of everyone. Later I'd think about whether the feedback was fair, and maybe talk to the person about how it was delivered.",
    q4:"In the moment, I'd stay composed rather than react defensively, thank them for the input, and suggest we discuss the specifics afterward so we don't derail the group. Privately, I'd reflect honestly on whether there's truth in it — even harsh feedback sometimes contains something useful — and separate that from how it was delivered. I'd then talk with the person one-on-one: acknowledge any valid point, and also calmly share that being called out publicly was tough and that I'd appreciate raising things privately next time. Going forward, I'd aim to keep the working relationship constructive, because reacting with hostility would cost more than the original comment did.",
    note:"2nd to 3rd: regulates the reaction instead of escalating publicly. 3rd to 4th: actively mines the feedback for what's true, separates content from delivery, and commits to protecting the working relationship going forward."
  },
  7: {
    q2:"I'd tell Dev he's being inconsiderate and that he needs to keep it down because I have exams. If he can't respect that, I'd consider talking to someone about it.",
    q3:"I'd talk to Dev calmly and explain that I have major exams coming up and really need quiet in the evenings. I'd ask if we can find a solution that works for both of us.",
    q4:"I'd start by assuming there's no bad intent — Dev may not realize how much the noise is affecting me, especially since I've only hinted so far. I'd pick a calm moment and be direct but warm: tell him I have exams this week and ask whether we can agree on quiet hours or move gatherings to another space. I'd also ask if something is going on for him, since the change is recent. If we agree on a plan and it still doesn't change, I'd revisit it honestly with him before escalating to anyone else.",
    note:"2nd to 3rd: drops the accusatory tone for a calm, mutual ask. 3rd to 4th: assumes good intent, owns that hinting wasn't clear communication, proposes a concrete agreement, and sets a conditional next step if it doesn't work."
  },
  8: {
    q2:"The group already voted, so we should stick with the materials everyone agreed on. Aisha can try to find a way to get them or use free resources on her own.",
    q3:"I'd feel bad that Aisha is being left out, so I'd check in with her privately to see how she's doing and look for free alternatives the group could use instead.",
    q4:"The real issue is that a group decision is quietly excluding Aisha, so I'd separate the logistics from the relationship. Privately, I'd check in with Aisha so she doesn't feel singled out, and find out what would actually help. With the group, I'd raise that our choice is leaving someone out and propose options — sharing access, splitting cost, or switching to a strong free resource — framed around keeping everyone included rather than overriding the vote. If no free alternative existed, I'd still push for a way to share what we have, because a study group only works if everyone can participate.",
    note:"2nd to 3rd: stops hiding behind the vote and leads with empathy for Aisha. 3rd to 4th: brings it back to the group as an equity problem, offers concrete inclusive options, and still commits to a fair outcome even when the easy fix isn't available."
  },
  9: {
    q2:"Marcus is the problem, so I'd tell him he's being domineering and shutting people down, and that he needs to let others talk.",
    q3:"I'd talk to Marcus privately and let him know that some teammates have gone quiet and it would help if everyone got a chance to contribute. I'd also try to invite the quieter members into the conversation.",
    q4:"There are two things to fix: Marcus's behavior and the quieter members' disengagement. I'd assume Marcus may not see his impact, so I'd speak with him privately and specifically — not 'you're domineering,' but 'I've noticed a few people have stopped offering ideas, and I think we'd get better work if we made room for them.' Separately, I'd actively bring the quieter members back in, for example by asking them directly for their take in meetings. If the pattern continued, I'd address it more directly with the group. The goal is good work and a team that isn't demoralized, and both depend on changing the dynamic, not punishing one person.",
    note:"2nd to 3rd: shifts from labeling Marcus to a private, behavior-focused conversation. 3rd to 4th: treats the two problems separately, uses specific non-accusatory language, takes concrete steps to re-engage the quiet members, and names the dual goal of work quality and morale."
  },
  10: {
    q2:"Maybe the failing grade is a sign this isn't for me. I'd feel like giving up and question whether I should even continue in the program.",
    q3:"I'd be discouraged, but I'd try to learn from it. I'd look at what went wrong on the exam and study differently next time, and remind myself that one grade doesn't define me.",
    q4:"First I'd let myself feel the disappointment without spiraling into 'I don't belong' — one exam isn't a verdict on my potential. Then I'd get concrete: review the exam to see whether the gap was content, test-taking, or how I studied, since the fix is different for each. I'd build a specific plan and decide where I need help — the professor's office hours, a study group, or academic support — rather than struggling alone. I'd also check in honestly with myself about workload and stress. The setback is real, but it's information about what to change, not proof I should quit.",
    note:"2nd to 3rd: reframes the grade as a learning opportunity instead of a reason to quit. 3rd to 4th: diagnoses the actual cause before fixing it, commits to specific help and a plan, and separates the emotion from the decision."
  },
  11: {
    q2:"Lena's mistakes are affecting the team, so the priority is making sure the errors get fixed. She needs to get back up to speed or it isn't fair to everyone else.",

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];

function $(sel,root){ return (root||document).querySelector(sel); }

/* ---------- timer ---------- */
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
function syncTimer(){
  stopTimer();
  if(S.running){
    timerHandle = setInterval(function(){
      S.remaining = Math.max(0, S.remaining - 1);
      // update just the timer node to avoid blowing away the textarea/caret
      var t = $("#timer");
      if(t){ paintTimer(t); }
      if(S.remaining === 0){ S.running = false; stopTimer(); render(); }
    }, 1000);
  }
}
function paintTimer(node){
  var m = Math.floor(S.remaining/60), s = S.remaining%60;
  var low = S.remaining <= 30;
  node.style.color = low ? C.red : C.cream;
  node.textContent = m + ":" + (s<10?"0"+s:s);
}

/* ---------- actions ---------- */
function startScenario(i){
  S.scenIdx=i; S.answer=""; S.remaining=S.duration; S.running=false; S.scores={}; S.showModel=false; S.mode="scenario";

}
function setDim(k,v){ S.scores[k] = (S.scores[k]===v ? undefined : v); render(); }

function totalScore(){
  var t=0; for(var k in S.scores){ if(S.scores[k]) t+=S.scores[k]; } return t;
}
function hasZero(){ return DIMENSIONS.some(function(d){ return S.scores[d.key]===1; }); }
function scoredCount(){ var n=0; for(var k in S.scores){ if(S.scores[k]) n++; } return n; }

/* ---------- progress (localStorage) ---------- */
var PKEY="acelabs_casper_progress_v1";
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(PKEY)||"[]"); }catch(e){ return []; } }
function saveProgress(arr){ try{ localStorage.setItem(PKEY, JSON.stringify(arr)); }catch(e){} }
function recordSession(){
  if(scoredCount()<5) return false;
  var scen=SCENARIOS[S.scenIdx];
  var sc={}; DIMENSIONS.forEach(function(d){ sc[d.key]=S.scores[d.key]; });
  var arr=loadProgress();
  arr.push({ ts:Date.now(), scenId:scen.id, scenIdx:S.scenIdx, tag:scen.tag, scores:sc, total:totalScore() });
  saveProgress(arr);
  return true;
}
function dimAverages(arr){
  var sums={}, counts={};
  DIMENSIONS.forEach(function(d){ sums[d.key]=0; counts[d.key]=0; });
  arr.forEach(function(e){ DIMENSIONS.forEach(function(d){ if(e.scores && e.scores[d.key]){ sums[d.key]+=e.scores[d.key]; counts[d.key]++; } }); });
  var avg={}; DIMENSIONS.forEach(function(d){ avg[d.key]= counts[d.key] ? sums[d.key]/counts[d.key] : 0; });
  return avg;
}
function progressSummaryText(){
  var arr=loadProgress();
  if(!arr.length) return "No Casper sessions saved yet.";
  var avg=dimAverages(arr);
  var lines=["Casper coaching — progress summary","Sessions: "+arr.length,"","Average by dimension (out of 3):"];
  DIMENSIONS.forEach(function(d){ lines.push("  - "+d.label+": "+(avg[d.key]?avg[d.key].toFixed(1):"–")); });
  var weakest=DIMENSIONS[0]; DIMENSIONS.forEach(function(d){ if(avg[d.key]<avg[weakest.key]) weakest=d; });
  lines.push("","Weakest dimension: "+weakest.label);
  lines.push("","Recent sessions:");
  arr.slice(-8).reverse().forEach(function(e){ var dt=new Date(e.ts); lines.push("  - "+(dt.getMonth()+1)+"/"+dt.getDate()+" "+e.tag+": "+e.total+"/15"); });
  return lines.join("\n");
}

/* ---------- TYPING TRAINER ---------- */
var T = { promptIdx:0, started:false, startTime:0, timer:null, elapsed:0, finished:false, typed:"", durationT:60 };

function typingReset(keepPrompt){
  if(T.timer){ clearInterval(T.timer); T.timer=null; }
  T.started=false; T.startTime=0; T.elapsed=0; T.finished=false; T.typed="";
  if(!keepPrompt) T.promptIdx=0;
}
function typingStats(){
  var target=TYPING_PROMPTS[T.promptIdx], typed=T.typed, correct=0;
  for(var i=0;i<typed.length;i++){ if(typed.charAt(i)===target.charAt(i)) correct++; }
  var mins=Math.max(T.elapsed,0.001)/60;
  var wpm=T.started? Math.max(0,Math.round((correct/5)/mins)) : 0;
  var acc=typed.length? Math.round((correct/typed.length)*100) : 100;
  return { wpm:wpm, acc:acc, correct:correct, done:(typed.length>=target.length) };
}
function typingStart(){
  if(T.started) return;
  T.started=true; T.startTime=Date.now();
  T.timer=setInterval(function(){
    T.elapsed=(Date.now()-T.startTime)/1000;
    if(T.elapsed>=T.durationT){ T.elapsed=T.durationT; typingFinish(); return; }
    typingPaintStats();
  },250);
}
function typingFinish(){
  if(T.timer){ clearInterval(T.timer); T.timer=null; }
  if(!T.elapsed) T.elapsed=(Date.now()-T.startTime)/1000;
  T.finished=true; render();
}
function typingPaintStats(){
  var st=typingStats();
  var rem=Math.max(0,Math.ceil(T.durationT-T.elapsed));
  var n;
  if((n=$("#typeTimer"))) n.textContent="0:"+(rem<10?"0"+rem:rem);
  if((n=$("#typeWpm"))) n.textContent=st.wpm;
  if((n=$("#typeAcc"))) n.textContent=st.acc+"%";
  var tgt=$("#typeTarget"); if(tgt) tgt.innerHTML=typingTargetHtml();
}
function typingTargetHtml(){
  var target=TYPING_PROMPTS[T.promptIdx], typed=T.typed, out="";
  for(var i=0;i<target.length;i++){
    var ch=esc(target.charAt(i));
    if(i<typed.length){
      var ok=typed.charAt(i)===target.charAt(i);
      out+='<span style="background:'+(ok?"rgba(47,122,79,.16)":"rgba(168,64,47,.22)")+';color:'+(ok?C.forest:C.red)+';">'+ch+'</span>';
    } else if(i===typed.length){
      out+='<span style="border-left:2px solid '+C.brass+';margin-left:-1px;">'+ch+'</span>';
    } else { out+='<span style="color:#8a9389;">'+ch+'</span>'; }
  }
  return out;
}

/* ---------- VIDEO REHEARSAL (on-camera: 30s reflect -> 60s record -> replay) ---------- */
var V = { stage:"idle", remaining:0, timer:null, stream:null, recorder:null, chunks:[], blobUrl:null, scenIdx:0, qIdx:0, error:"" };

function vidFmt(s){ s=Math.max(0,s); var m=Math.floor(s/60); var r=s%60; return m+":"+(r<10?"0"+r:r); }
function vidMaxQ(){ var scen=SCENARIOS[V.scenIdx]; return Math.min(2, scen.qs.length); } // mirror the 2-question video format

function vidStopTimer(){ if(V.timer){ clearInterval(V.timer); V.timer=null; } }
function vidResetTake(){
  vidStopTimer();
  if(V.recorder && V.recorder.state!=="inactive"){ try{ V.recorder.stop(); }catch(e){} }
  V.recorder=null; V.chunks=[];
  if(V.blobUrl){ URL.revokeObjectURL(V.blobUrl); V.blobUrl=null; }
}
function vidCleanup(){
  vidResetTake();
  if(V.stream){ V.stream.getTracks().forEach(function(t){ try{t.stop();}catch(e){} }); V.stream=null; }
  V.stage="idle"; V.error="";
}

function vidEnsureCamera(cb){
  if(V.stream){ cb(true); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    V.error="This browser can’t access a camera. You can still rehearse with the timer only.";
    cb(false); return;
  }
  navigator.mediaDevices.getUserMedia({ video:true, audio:true }).then(function(s){
    V.stream=s; V.error=""; cb(true);
  }).catch(function(){
    V.error="Camera/mic unavailable or permission denied — rehearsing with the timer only.";
    cb(false);
  });
}

function vidTick(){
  vidStopTimer();
  V.timer=setInterval(function(){
    V.remaining--;
    var t=$("#vidTimer"); if(t) t.textContent=vidFmt(V.remaining);
    if(V.remaining<=0){
      vidStopTimer();
      if(V.stage==="reflect") vidGoRecord();
      else if(V.stage==="record") vidStopRecord();
    }
  },1000);
}
function vidGoReflect(){ V.stage="reflect"; V.remaining=30; vidPaint(); vidTick(); }
function vidGoRecord(){
  V.stage="record"; V.remaining=60; V.chunks=[];
  if(V.stream && window.MediaRecorder){
    try{
      V.recorder=new MediaRecorder(V.stream);
      V.recorder.ondataavailable=function(e){ if(e.data && e.data.size) V.chunks.push(e.data); };
      V.recorder.onstop=function(){
        if(V.chunks.length){
          var blob=new Blob(V.chunks, { type:(V.chunks[0].type||"video/webm") });
          V.blobUrl=URL.createObjectURL(blob);
        }
        V.stage="review"; vidPaint();
      };
      V.recorder.start();
    }catch(e){ V.recorder=null; }
  }
  vidPaint(); vidTick();
}
function vidStopRecord(){
  vidStopTimer();
  if(V.recorder && V.recorder.state!=="inactive"){ V.recorder.stop(); /* onstop -> review */ }
  else { V.stage="review"; vidPaint(); }
}

function vidPaint(){
  var media=$("#vidMedia"), timer=$("#vidTimer"), status=$("#vidStatus"), ctrls=$("#vidControls"), qline=$("#vidQ");
  if(!media) return;
  var scen=SCENARIOS[V.scenIdx];
  if(qline) qline.textContent = "Q"+(V.qIdx+1)+" of "+vidMaxQ()+": "+(scen.qs[V.qIdx]||scen.qs[0]);

  var mediaBox="height:300px;border-radius:10px;overflow:hidden;background:#10231a;display:flex;align-items:center;justify-content:center;";
  var placeholder=function(txt){ return '<div style="'+mediaBox+'color:#9fb4a6;font-size:13.5px;text-align:center;padding:0 24px;">'+esc(txt)+'</div>'; };

  if(V.stage==="idle"){
    media.innerHTML=placeholder(V.error || "Your camera preview appears here. You get 30s to plan, then 60s to record — just like the real video section.");
    if(timer) timer.textContent="0:30";
    if(status) status.textContent="One take on test day. Here you can re-run as many times as you like.";
    if(ctrls) ctrls.innerHTML='<button class="btn-primary" data-vid="start">Start · 30s reflect</button>';
  } else if(V.stage==="reflect" || V.stage==="record"){
    if(V.stream){
      media.innerHTML='<video id="vidPreview" autoplay muted playsinline style="'+mediaBox+'width:100%;object-fit:cover;"></video>';
      var pv=$("#vidPreview"); if(pv){ pv.srcObject=V.stream; }
    } else {
      media.innerHTML=placeholder("No camera — rehearsing with the timer only. Speak your answer out loud.");
    }
    if(timer) timer.textContent=vidFmt(V.remaining);
    if(V.stage==="reflect"){
      if(status) status.innerHTML='<b>Reflect</b> — jot 2–4 keywords, then speak to them.';
      if(ctrls) ctrls.innerHTML='<button class="btn-primary" data-vid="rec-now">Skip to recording</button>';
    } else {
      if(status) status.innerHTML='<span style="color:'+C.red+';font-weight:700;">Recording</span> — aim to finish a little under time.';
      if(ctrls) ctrls.innerHTML='<button class="btn-ghost" data-vid="stop">Stop &amp; review</button>';
    }
  } else if(V.stage==="review"){
    if(V.blobUrl){
      media.innerHTML='<video controls playsinline src="'+V.blobUrl+'" style="'+mediaBox+'width:100%;object-fit:contain;background:#000;"></video>';
    } else {
      media.innerHTML=placeholder("No recording was captured (camera was off). Debrief the delivery from memory.");
    }
    if(timer) timer.textContent="—";
    if(status) status.textContent="Review the take: pacing, eye-line to the lens, filler words, did she finish in time?";
    var nextBtn = (V.qIdx+1 < vidMaxQ()) ? '<button class="btn-primary" data-vid="next">Next question</button>' : '';
    if(ctrls) ctrls.innerHTML='<button class="btn-ghost" data-vid="rerun">Re-run this question</button>'+nextBtn;
  }
}

/* ---------- ARCADE ---------- */
function viewArcade(){
  var a = ARCADE[S.arcadeIdx];
  var answered = S.arcadePick !== null;
  var acc = S.arcadeStats.total ? Math.round((S.arcadeStats.right/S.arcadeStats.total)*100) : 0;

  var opts = a.options.map(function(opt,i){
    var bg=C.paper, bd=C.line, color=C.ink;
    if(answered){
      if(i===a.correct){ bg="#eaf3ec"; bd=C.green; }
      else if(i===S.arcadePick){ bg="#f8ece9"; bd=C.red; }
    }
    return '<button '+(answered?"disabled":"")+' data-act="pick" data-i="'+i+'" style="text-align:left;background:'+bg+';border:1.5px solid '+bd+';border-radius:8px;padding:13px 16px;cursor:'+(answered?"default":"pointer")+';font-size:14.5px;color:'+color+';line-height:1.4;">'
      + esc(opt) + '</button>';
  }).join("");

  var explain = "";
  if(answered){
    var head = (S.arcadePick===a.correct) ? "Strongest move" : "Why the highlighted option is strongest";
    var nextLabel = (S.arcadeIdx+1 < ARCADE.length) ? "Next question" : "Finish · back home";
    explain = '<div style="margin-top:18px;background:'+C.soft+';border-left:3px solid '+C.brass+';border-radius:0 8px 8px 0;padding:14px 16px;">'
      + '<div style="font-weight:700;color:'+C.forest+';font-size:12.5px;margin-bottom:4px;">'+esc(head)+'</div>'
      + '<div style="font-size:13.5px;color:#46524a;line-height:1.5;">'+esc(a.why)+'</div>'
      + '<button class="btn-primary" data-act="arcade-next">'+esc(nextLabel)+'</button>'
      + '</div>';
  }

  return '<div style="max-width:720px;margin:0 auto;padding:32px 24px;">'
    + topbar("Accuracy "+acc+"% · "+S.arcadeStats.right+"/"+S.arcadeStats.total)
    + '<div class="eyebrow" style="margin:20px 0 8px;letter-spacing:.18em;">Decision Arcade · Q'+(S.arcadeIdx+1)+'</div>'
    + '<div style="font-family:'+fontDisplay+';font-size:22px;font-weight:700;color:'+C.forest+';line-height:1.3;margin-bottom:22px;">'+esc(a.q)+'</div>'
    + '<div style="display:grid;gap:10px;">'+opts+'</div>'
    + explain
    + footer()
    + '</div>';
}

/* ---------- FULL TIMED MOCK (11 stations: 4 video + 7 typed, two breaks) ----------
   Practice-only. On the real test you type (no dictation), can't go back, and are on
   camera throughout. Here, spoken stations are captured as text so you can review and
   export; speak them aloud (or dictate) to rehearse delivery. */
var MK = { order:[], idx:0, stage:"intro", phase:"answer", qIdx:0, answers:{}, videos:{}, remaining:0, running:false, brkLen:10 };
var mkTimerHandle=null;

/* Mock camera for the on-camera video stations. Browser-native, on-device, nothing
   uploaded. available: null=unknown, true=camera ok, false=unavailable (falls back to text). */
var MKCAM = { stream:null, recorder:null, chunks:[], available:null };
function mkCamEnsure(cb){
  if(MKCAM.stream){ cb(true); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ cb(false); return; }
  navigator.mediaDevices.getUserMedia({ video:true, audio:true }).then(function(s){ MKCAM.stream=s; cb(true); }).catch(function(){ cb(false); });
}
function mkCamStartRecording(){
  if(!MKCAM.stream || !window.MediaRecorder) return;
  if(MKCAM.recorder && MKCAM.recorder.state==="recording") return;
  var idx=MK.idx, qIdx=MK.qIdx;            // capture slot now; onstop fires after we advance
  try{
    MKCAM.chunks=[];
    MKCAM.recorder=new MediaRecorder(MKCAM.stream);
    MKCAM.recorder.ondataavailable=function(e){ if(e.data && e.data.size) MKCAM.chunks.push(e.data); };
    MKCAM.recorder.onstop=function(){
      if(MKCAM.chunks.length){
        var blob=new Blob(MKCAM.chunks, { type:(MKCAM.chunks[0].type||"video/webm") });
        if(!MK.videos[idx]) MK.videos[idx]=["",""];
        MK.videos[idx][qIdx]=URL.createObjectURL(blob);
      }
    };
    MKCAM.recorder.start();
  }catch(e){}
}
function mkCamStopRecording(){
  if(MKCAM.recorder && MKCAM.recorder.state!=="inactive"){ try{ MKCAM.recorder.stop(); }catch(e){} }
  MKCAM.recorder=null;
}
function mkRevokeVideos(){
  for(var k in MK.videos){ (MK.videos[k]||[]).forEach(function(u){ if(u){ try{ URL.revokeObjectURL(u); }catch(e){} } }); }
}
function mkCamCleanup(){
  mkCamStopRecording();
  if(MKCAM.stream){ MKCAM.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); MKCAM.stream=null; }
}

function scenById(id){ for(var i=0;i<SCENARIOS.length;i++){ if(SCENARIOS[i].id===id) return SCENARIOS[i]; } return SCENARIOS[0]; }
function mockBuildOrder(){
  var ids=SCENARIOS.map(function(s){ return s.id; });
  for(var i=ids.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=ids[i]; ids[i]=ids[j]; ids[j]=t; }
  var pick=ids.slice(0,11), order=[];
  for(var k=0;k<11;k++){ order.push({ scenId:pick[k], type:(k<4?"video":"typed") }); }
  return order;
}
function stopMkTimer(){ if(mkTimerHandle){ clearInterval(mkTimerHandle); mkTimerHandle=null; } }
function paintMkTimer(node){ var m=Math.floor(MK.remaining/60), s=MK.remaining%60; node.style.color=(MK.remaining<=15?C.red:C.cream); node.textContent=m+":"+(s<10?"0"+s:s); }
function syncMkTimer(){
  stopMkTimer();
  if(MK.stage==="station" && MK.running){
    mkTimerHandle=setInterval(function(){
      MK.remaining=Math.max(0,MK.remaining-1);
      var t=$("#mkTimer"); if(t) paintMkTimer(t);
      if(MK.remaining===0){ stopMkTimer(); mkAdvancePhase(); }
    },1000);
  }
}
function mockSetupStation(){
  var st=MK.order[MK.idx];
  MK.stage="station"; MK.qIdx=0; MK.running=true;
  if(st.type==="typed"){ MK.phase="answer"; MK.remaining=210; if(typeof MK.answers[MK.idx]!=="string") MK.answers[MK.idx]=""; }
  else { MK.phase="reflect"; MK.remaining=30; if(!MK.answers[MK.idx]) MK.answers[MK.idx]=["",""]; if(!MK.videos[MK.idx]) MK.videos[MK.idx]=["",""]; }
}
function mkStart(){ mkRevokeVideos(); MK.order=mockBuildOrder(); MK.idx=0; MK.answers={}; MK.videos={}; mockSetupStation(); render(); }
function mkAdvancePhase(){
  var st=MK.order[MK.idx];
  if(st.type==="video" && MK.phase==="answer"){ mkCamStopRecording(); }
  if(st.type==="typed"){ mkAdvanceStation(); return; }
  if(MK.phase==="reflect"){ MK.phase="answer"; MK.remaining=60; MK.running=true; render(); return; }
  if(MK.qIdx<1){ MK.qIdx++; MK.phase="reflect"; MK.remaining=30; MK.running=true; render(); return; }
  mkAdvanceStation();
}
function mkAdvanceStation(){
  var completed=MK.idx;
  if(completed===3 || completed===7){ MK.stage="brk"; MK.brkLen=(completed===3?10:5); MK.running=false; stopMkTimer(); render(); return; }
  mkGoNext();
}
function mkGoNext(){
  MK.idx++;
  if(MK.idx>10){ MK.stage="done"; MK.running=false; stopMkTimer(); render(); return; }
  mockSetupStation(); render();
}
function mockExportText(){
  var lines=["Casper full mock — "+MK.order.length+" stations",""];
  MK.order.forEach(function(o,i){
    var scen=scenById(o.scenId);
    lines.push("Station "+(i+1)+" ("+(o.type==="video"?"video":"typed")+") — "+scen.tag);
    lines.push(scen.stem);
    scen.qs.slice(0,2).forEach(function(q,qi){ lines.push("  Q"+(qi+1)+": "+q); });
    var a=MK.answers[i];
    if(o.type==="typed"){ lines.push("  Answer: "+((a&&(""+a).trim())?(""+a).trim():"(none)")); }
    else { var vv=MK.videos[i]||[]; var vq=function(q){ if(vv[q]) return "(recorded on camera — review in the mock)"; var t=a&&a[q]&&a[q].trim(); return t?t:"(none)"; }; lines.push("  Answer Q1: "+vq(0)); lines.push("  Answer Q2: "+vq(1)); }
    lines.push("");
  });
  return lines.join("\n");
}
function viewMock(){
  if(MK.stage==="intro"){
    return '<div style="max-width:720px;margin:0 auto;padding:36px 24px;" class="card-anim">'
      + topbar("Full Timed Mock")
      + '<div class="eyebrow" style="margin:18px 0 8px;">Full Mock</div>'
      + '<h1 style="font-family:'+fontDisplay+';font-weight:900;font-size:32px;color:'+C.forest+';margin:0 0 12px;">11 stations, real timing.</h1>'
      + '<p style="font-size:15px;color:#46524a;line-height:1.6;margin:0 0 16px;">Four video stations (2 questions each: about 30s to reflect, 60s to answer per question), then seven typed stations (2 questions, about 3.5 minutes each), with a 10-minute break after the video section and a 5-minute break midway through typed. It runs forward only, like the real thing.</p>'
      + '<div style="background:'+C.paper+';border:1px solid '+C.line+';border-left:3px solid '+C.brass+';border-radius:0 10px 10px 0;padding:12px 16px;font-size:13px;color:#46524a;line-height:1.5;margin-bottom:18px;">Practice note: on the real Casper you type your typed answers (no dictation) and you are on camera throughout. Here the four video stations record on your camera so you can review your delivery at the end — nothing is uploaded. If your camera is not available, you can capture those answers as text instead.</div>'
      + '<button class="btn-primary" data-act="mk-start">Start the mock</button>'
      + footer() + '</div>';
  }
  if(MK.stage==="brk"){
    return '<div style="max-width:620px;margin:0 auto;padding:48px 24px;text-align:center;" class="card-anim">'
      + topbar("Break")
      + '<div class="eyebrow" style="margin:18px 0 8px;">Optional break</div>'
      + '<h1 style="font-family:'+fontDisplay+';font-weight:900;font-size:30px;color:'+C.forest+';margin:0 0 10px;">Break — up to '+MK.brkLen+' minutes.</h1>'
      + '<p style="font-size:14px;color:#46524a;line-height:1.6;margin:0 0 20px;">Stretch, hydrate, reset. On the real test this break is optional, and after the second break you take a quick webcam photo before continuing.</p>'
      + '<button class="btn-primary" data-act="mk-continue">Continue</button>'
      + footer() + '</div>';
  }
  if(MK.stage==="done"){
    var rows=MK.order.map(function(o,i){
      var s2=scenById(o.scenId);
      return '<div style="padding:8px 0;border-bottom:1px solid '+C.line+';font-size:13px;display:flex;justify-content:space-between;gap:10px;">'
        + '<span style="color:'+C.ink+';">Station '+(i+1)+' — '+esc(s2.tag)+'</span>'
        + '<span style="color:#8a9389;">'+(o.type==="video"?"video":"typed")+'</span></div>';
    }).join("");
    var videoReview=MK.order.map(function(o,i){
      if(o.type!=="video") return "";
      var v=MK.videos[i]||[];
      var clips=[0,1].map(function(q){
        if(!v[q]) return "";
        return '<div style="margin-top:6px;"><div style="font-size:10.5px;color:#8a9389;margin-bottom:3px;">Question '+(q+1)+'</div><video controls playsinline src="'+v[q]+'" style="width:100%;border-radius:8px;background:#000;"></video></div>';
      }).join("");
      if(!clips) return "";
      return '<div style="margin-bottom:14px;"><div style="font-size:12.5px;font-weight:700;color:'+C.forest+';">Station '+(i+1)+' — '+esc(scenById(o.scenId).tag)+'</div>'+clips+'</div>';
    }).join("");
    var videoSection = videoReview ? ('<div style="background:'+C.paper+';border:1px solid '+C.line+';border-radius:10px;padding:14px 18px;margin-bottom:16px;"><div style="font-family:'+fontDisplay+';font-weight:700;font-size:16px;color:'+C.forest+';margin-bottom:4px;">Watch your video takes</div><div style="font-size:11.5px;color:#8a9389;margin-bottom:8px;">Review your delivery: pacing, eye-line to the lens, filler words, and whether you finished in time. These stay on this device.</div>'+videoReview+'</div>') : '';
    return '<div style="max-width:720px;margin:0 auto;padding:36px 24px;" class="card-anim">'
      + topbar("Full Timed Mock · complete")
      + '<div class="eyebrow" style="margin:18px 0 8px;">Done</div>'
      + '<h1 style="font-family:'+fontDisplay+';font-weight:900;font-size:30px;color:'+C.forest+';margin:0 0 10px;">Mock complete.</h1>'
      + '<p style="font-size:14px;color:#46524a;line-height:1.6;margin:0 0 16px;">Now review: watch your video takes below, export your typed answers, then reopen any scenario in Start a Scenario to compare against the 2nd-to-4th-quartile ladder and self-score.</p>'
      + videoSection
      + '<div style="background:'+C.paper+';border:1px solid '+C.line+';border-radius:10px;padding:6px 18px 12px;margin-bottom:16px;">'+rows+'</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
        + '<button class="btn-primary" data-act="mk-export">Copy all answers for your log</button>'
        + '<button class="btn-ghost" data-act="mk-restart">New mock</button>'
        + '<button class="btn-ghost" data-act="home">Console home</button>'
      + '</div>'
      + '<div id="mkExportNote" style="font-size:11px;color:#8a9389;margin-top:8px;"></div>'
      + footer() + '</div>';
  }
  var st=MK.order[MK.idx];
  var scen=scenById(st.scenId);
  var isVideo=(st.type==="video");
  var qsHtml;
  if(isVideo){
    qsHtml='<div style="font-size:14px;color:#e8e2d2;margin-top:10px;"><b>Question '+(MK.qIdx+1)+' of 2:</b> '+esc(scen.qs[MK.qIdx]||scen.qs[0])+'</div>';
  } else {
    qsHtml='<ol style="margin:10px 0 0;padding-left:20px;">'+scen.qs.slice(0,2).map(function(q){ return '<li style="font-size:14px;margin-bottom:5px;color:#e8e2d2;">'+esc(q)+'</li>'; }).join("")+'</ol>';
  }
  var phaseLabel, inputHtml, nextLabel;
  var camOn = isVideo && MKCAM.available!==false;
  var previewHtml = '<div style="height:240px;border-radius:10px;overflow:hidden;background:#10231a;margin-top:12px;display:flex;align-items:center;justify-content:center;">'
    + '<video id="mkPreview" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover;"></video></div>';
  if(isVideo && MK.phase==="reflect"){
    phaseLabel="Reflect — jot 2 to 4 keywords, then answer on camera.";
    inputHtml = camOn ? previewHtml : '';
    nextLabel="Start answering";
  } else if(isVideo){
    if(camOn){
      phaseLabel="Recording — speak your answer to the camera (about 60 seconds).";
      inputHtml = previewHtml + '<div style="margin-top:8px;font-size:11.5px;color:'+C.red+';font-weight:700;">Recording. Nothing is uploaded — your take stays on this device, and you can review it at the end.</div>';
    } else {
      phaseLabel="Camera unavailable — answer aloud and capture it as text (about 60 seconds).";
      var storedV=(MK.answers[MK.idx]&&MK.answers[MK.idx][MK.qIdx])||"";
      inputHtml='<textarea id="mkAnswer" placeholder="Speak your answer and capture it here (dictate or type)." style="width:100%;min-height:120px;padding:14px;border-radius:10px;border:1.5px solid '+C.line+';font-family:'+fontBody+';font-size:14.5px;line-height:1.6;color:'+C.ink+';resize:vertical;background:'+C.paper+';margin-top:12px;">'+esc(storedV)+'</textarea>';
    }
    nextLabel="Next";
  } else {
    phaseLabel="Type your answer to both questions — about 3.5 minutes.";
    var stored=(MK.answers[MK.idx]||"");
    inputHtml='<textarea id="mkAnswer" placeholder="Type your answer here, or dictate and clean it up." style="width:100%;min-height:200px;padding:14px;border-radius:10px;border:1.5px solid '+C.line+';font-family:'+fontBody+';font-size:14.5px;line-height:1.6;color:'+C.ink+';resize:vertical;background:'+C.paper+';margin-top:12px;">'+esc(stored)+'</textarea>';
    nextLabel=(MK.idx===10) ? "Finish mock" : "Next";
  }
  return '<div style="max-width:760px;margin:0 auto;padding:24px 24px;">'
    + topbar("Station "+(MK.idx+1)+" of 11 · "+(isVideo?"video":"typed"))
    + '<div style="background:'+C.forest+';color:'+C.cream+';border-radius:10px;padding:18px 20px;margin:16px 0 14px;">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
        + '<span style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:'+C.brass+';font-weight:700;">'+esc(scen.tag)+'</span>'
        + '<div id="mkTimer" style="font-family:'+fontDisplay+';font-weight:900;font-size:26px;color:'+C.cream+';font-variant-numeric:tabular-nums;">'+Math.floor(MK.remaining/60)+':'+(MK.remaining%60<10?"0":"")+(MK.remaining%60)+'</div>'
      + '</div>'
      + '<p style="font-size:15px;line-height:1.55;margin:0;">'+esc(scen.stem)+'</p>'
      + qsHtml
    + '</div>'
    + '<div style="font-size:12.5px;color:'+C.forest+';font-weight:700;margin-bottom:2px;">'+esc(phaseLabel)+'</div>'
    + inputHtml
    + '<div style="display:flex;justify-content:flex-end;margin-top:12px;">'
      + '<button class="btn-primary" data-act="mk-next">'+esc(nextLabel)+'</button>'
    + '</div>'
    + '<div style="margin-top:10px;font-size:11px;color:#8a9389;">Forward only, like the real test. The timer advances you automatically when it reaches zero.</div>'
    + footer() + '</div>';
}

  return '<div style="max-width:1120px;margin:0 auto;padding:28px 24px;">'

            + '<span style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:'+C.brass+';font-weight:700;">Scenario</span>'
            + '<div id="timer" style="font-family:'+fontDisplay+';font-weight:900;font-size:30px;color:'+C.cream+';font-variant-numeric:tabular-nums;">5:00</div>'
          + '</div>'
          + '<p style="font-size:15.5px;line-height:1.55;margin:0;">'+esc(scen.stem)+'</p>'
          + '<ol style="margin:14px 0 0;padding-left:20px;">'+qsList+'</ol>'
        + '</div>'
        + '<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">'+controls+durSel+'</div>'
        + '<textarea id="answer" placeholder="Type your answer here — or dictate it (Wispr, voice typing) and clean it up." style="width:100%;min-height:220px;padding:16px;border-radius:10px;border:1.5px solid '+C.line+';font-family:'+fontBody+';font-size:14.5px;line-height:1.6;color:'+C.ink+';resize:vertical;background:'+C.paper+';">'+esc(S.answer)+'</textarea>'

/* Always-available answer spine + phrase bank, shown beside the answer box.

function spineRail(){

    + '<div style="font-size:11px;color:#8a9389;margin-bottom:10px;line-height:1.4;">Hit all five beats, in order, every time. This is the 4th-quartile pattern, so keep it in view while you answer.</div>'

/* AI grader — LIVE via the same-origin Netlify function /.netlify/functions/casper-grade
   (Haiku 4.5). Server-gated: it returns 503 until ANTHROPIC_API_KEY + CASPER_ACCESS_CODE
   are set, and requires the student's access code. CSP connect-src 'self' allows the
   same-origin call. Set AI_GRADER_ENABLED=false to hide the button without a redeploy. */
var AI_GRADER_ENABLED = true;
var aiBusy = false;
function aiFeedback(){
  var n=$("#aiNote"); if(!n) return;
  if(!AI_GRADER_ENABLED){ n.textContent="AI feedback isn't switched on yet. Self-score, reveal the ladder, and revise toward the 4th-quartile target."; return; }
  var ans = S.answer && S.answer.trim();
  if(!ans){ n.textContent="Type or dictate an answer first, then ask for feedback."; return; }
  var code=null; try{ code=localStorage.getItem("acelabs_casper_code"); }catch(e){}
  if(!code){
    n.innerHTML = '<div style="font-size:11.5px;color:#46524a;margin-bottom:6px;">Enter the access code from your coach to use AI feedback:</div>'
      + '<div style="display:flex;gap:6px;"><input id="aiCode" type="text" autocomplete="off" placeholder="access code" style="flex:1;padding:6px 8px;border:1px solid '+C.line+';border-radius:6px;font-size:12px;font-family:'+fontBody+';"/>'
      + '<button data-act="ai-code-submit" class="btn-ghost" style="padding:6px 12px;font-size:11.5px;">Use</button></div>';
    var ci=$("#aiCode"); if(ci) ci.focus();
    return;
  }
  if(aiBusy) return;
  aiBusy=true;
  n.textContent="Reading your answer...";
  var scen=SCENARIOS[S.scenIdx];
  fetch("/.netlify/functions/casper-grade", {
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({ stem:scen.stem, questions:scen.qs, answer:S.answer, code:code })
  }).then(function(r){
    return r.json().then(function(j){ return { ok:r.ok, status:r.status, j:j }; }, function(){ return { ok:r.ok, status:r.status, j:{} }; });
  }).then(function(res){
    aiBusy=false;
    var nn=$("#aiNote"); if(!nn) return;
    if(res.status===401){ try{localStorage.removeItem("acelabs_casper_code");}catch(e){} nn.textContent="That access code wasn't accepted. Press AI feedback to try again."; return; }
    if(!res.ok){ nn.textContent=(res.j && res.j.error) ? res.j.error : "Feedback is unavailable right now."; return; }
    nn.innerHTML=aiRenderResult(res.j);
  }).catch(function(){ aiBusy=false; var nn=$("#aiNote"); if(nn) nn.textContent="Network error — try again."; });
}
function aiRenderResult(d){
  var labels={1:"Missing",2:"Implied",3:"Explicit"};
  var cols={1:C.red,2:"#9a7322",3:C.green};
  var dims=(d && d.dimensions)||{};
  var rows=DIMENSIONS.map(function(dim){
    var e=dims[dim.key]||{}; var lv=e.level||0;
    return '<div style="font-size:11px;color:#46524a;margin-bottom:3px;line-height:1.4;"><b style="color:'+(cols[lv]||"#8a9389")+';">'+(lv?(lv+" "+labels[lv]):"-")+'</b> &middot; '+esc(dim.label)+(e.note?(' — '+esc(e.note)):'')+'</div>';
  }).join("");
  return '<div style="text-align:left;background:'+C.paper+';border:1px solid '+C.line+';border-radius:8px;padding:10px 12px;margin-top:6px;">'
    + '<div style="font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:'+C.brass+';margin-bottom:6px;">AI feedback — a practice aid, not an official score</div>'
    + ((d&&d.headline)?('<div style="font-size:13px;font-weight:700;color:'+C.forest+';margin-bottom:8px;line-height:1.4;">'+esc(d.headline)+'</div>'):'')
    + rows
    + ((d&&d.missingBeat)?('<div style="margin-top:8px;font-size:12px;color:'+C.forest+';line-height:1.45;"><b>Lift it here:</b> '+esc(d.missingBeat)+'</div>'):'')
    + ((d&&d.rewrite)?('<div style="margin-top:8px;font-size:12px;color:#3a4640;line-height:1.55;"><b>A stronger version of your answer:</b><br>'+esc(d.rewrite)+'</div>'):'')
    + ((d&&d.note)?('<div style="margin-top:8px;font-size:11px;color:#46524a;line-height:1.4;"><b>What moved it up:</b> '+esc(d.note)+'</div>'):'')
    + '</div>';
}
/* One-click export of the current scenario practice (prompt + questions + your
   answer + self-score + the 4th-quartile target). Replaces the manual
   copy-into-a-Google-Doc step. */
function exportScenarioText(){
  var scen=SCENARIOS[S.scenIdx];
  var m=MODELS[scen.id];
  var lines=[];
  lines.push("Casper practice — "+scen.tag);
  lines.push("");
  lines.push("Scenario:");
  lines.push(scen.stem);
  lines.push("");
  lines.push("Questions:");
  scen.qs.forEach(function(q,i){ lines.push((i+1)+". "+q); });
  lines.push("");
  lines.push("My answer:");
  lines.push(S.answer.trim() ? S.answer.trim() : "(none yet)");
  lines.push("");
  if(scoredCount()>0){
    lines.push("Self-score (1 missing / 2 implied / 3 explicit):");
    DIMENSIONS.forEach(function(d){ var v=S.scores[d.key]; lines.push("  - "+d.label+": "+(v?v:"-")); });
    lines.push("  Total: "+totalScore()+"/"+(DIMENSIONS.length*3));
    lines.push("");
  }
  if(m){
    lines.push("4th-quartile target:");
    lines.push(m.q4);
    lines.push("");
    lines.push("What moves it up: "+m.note);
  }
  return lines.join("\n");
}

    + '<div style="font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:'+(red?C.red:C.green)+';margin-bottom:5px;">'+esc(head)+'</div>'

/* ---------- video event handling ---------- */
function handleVid(act){
  if(act==="start"){ vidEnsureCamera(function(){ vidGoReflect(); }); return; }
  if(act==="rec-now"){ vidStopTimer(); vidGoRecord(); return; }
  if(act==="stop"){ vidStopRecord(); return; }
  if(act==="rerun"){ vidResetTake(); vidGoReflect(); return; }
  if(act==="next"){ V.qIdx++; vidResetTake(); V.stage="idle"; vidPaint(); return; }
  if(act==="prev-scen"){ vidCleanup(); V.scenIdx=(V.scenIdx-1+SCENARIOS.length)%SCENARIOS.length; V.qIdx=0; V.stage="idle"; render(); return; }
  if(act==="next-scen"){ vidCleanup(); V.scenIdx=(V.scenIdx+1)%SCENARIOS.length; V.qIdx=0; V.stage="idle"; render(); return; }
}

/* ============================================================
   EVENT WIRING (delegation; re-bound after each render)
   ============================================================ */
function wire(){
  var app = document.getElementById("app");

  app.onclick = function(e){
    var vd = e.target.closest("[data-vid]");
    if(vd){ handleVid(vd.getAttribute("data-vid")); return; }

    var el = e.target.closest("[data-act]");
    if(!el) return;
    var act = el.getAttribute("data-act");

    if(act==="home"){ vidCleanup(); S.mode="home"; render(); return; }
    if(act==="start-0"){ vidCleanup(); startScenario(0); return; }
    if(act==="start"){ vidCleanup(); startScenario(+el.getAttribute("data-i")); return; }
    if(act==="arcade"){ vidCleanup(); S.mode="arcade"; S.arcadeIdx=0; S.arcadePick=null; render(); return; }
    if(act==="guide"){ vidCleanup(); S.mode="guide"; render(); return; }
    if(act==="video"){ vidCleanup(); V.scenIdx=S.scenIdx||0; V.qIdx=0; V.stage="idle"; V.error=""; S.mode="video"; render(); return; }
    if(act==="progress"){ vidCleanup(); S.mode="progress"; render(); return; }
    if(act==="typing"){ vidCleanup(); typingReset(false); S.mode="typing"; render(); return; }
    if(act==="mock"){ vidCleanup(); MK.stage="intro"; S.mode="mock"; render(); return; }
    if(act==="mk-start"){ mkStart(); return; }
    if(act==="mk-next"){ stopMkTimer(); mkAdvancePhase(); return; }
    if(act==="mk-continue"){ mkGoNext(); return; }
    if(act==="mk-restart"){ MK.stage="intro"; render(); return; }
    if(act==="mk-export"){ var mx=mockExportText(); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(mx); } var mn=$("#mkExportNote"); if(mn) mn.textContent="Copied — paste into your log or a Google Doc."; return; }
    if(act==="type-again"){ typingReset(true); render(); return; }
    if(act==="type-new"){ typingReset(true); T.promptIdx=(T.promptIdx+1)%TYPING_PROMPTS.length; render(); return; }
    if(act==="toggle-hide"){ S.hideScores=!S.hideScores; render(); return; }
    if(act==="reveal-scores"){ S.hideScores=false; render(); return; }
    if(act==="toggle-model"){ S.showModel=!S.showModel; render(); return; }
    if(act==="save-session"){
      if(recordSession()){ S.mode="progress"; render(); }
      else { var w=$("#scoreVerdict"); if(w){ w.textContent="Score all five dimensions before saving."; w.style.color=C.red; } }
      return;
    }
    if(act==="redo-weak"){
      var arr=loadProgress(); if(!arr.length){ return; }
      var lowest=arr[0]; arr.forEach(function(e){ if(e.total<lowest.total) lowest=e; });
      startScenario(lowest.scenIdx); return;
    }
    if(act==="revise-answer"){
      var rta=$("#answer"); if(rta){ rta.focus(); }
      var rv=$("#scoreVerdict"); if(rv){ rv.textContent="Keep your answer, add the missing beat (see the spine), then re-score the dimension you lifted."; rv.style.color=C.forest; }
      return;
    }
    if(act==="ai-feedback"){ aiFeedback(); return; }
    if(act==="ai-code-submit"){ var aci=$("#aiCode"); if(aci && aci.value.trim()){ try{localStorage.setItem("acelabs_casper_code", aci.value.trim());}catch(e){} aiFeedback(); } return; }
    if(act==="export-scenario"){
      var ex=exportScenarioText();
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ex); }
      var en=$("#exportNote"); if(en) en.textContent="Copied — paste into your log or a Google Doc.";
      return;
    }
    if(act==="copy-progress"){
      var txt=progressSummaryText();
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); }
      el.textContent="Copied"; return;
    }
    if(act==="clear-progress"){
      if(el.getAttribute("data-confirm")){ saveProgress([]); render(); }
      else { el.setAttribute("data-confirm","1"); el.textContent="Click again to clear"; }
      return;
    }

    if(act==="pick"){
      if(S.arcadePick!==null) return;
      var i = +el.getAttribute("data-i");
      var a = ARCADE[S.arcadeIdx];
      S.arcadePick = i;
      S.arcadeStats = { right:S.arcadeStats.right+(i===a.correct?1:0), total:S.arcadeStats.total+1 };
      render(); return;
    }
    if(act==="arcade-next"){
      if(S.arcadeIdx+1 < ARCADE.length){ S.arcadeIdx++; S.arcadePick=null; render(); }
      else { S.mode="home"; render(); }
      return;
    }

    if(act==="timer-start" || act==="timer-resume"){ S.running=true; render(); return; }
    if(act==="timer-pause"){ S.running=false; render(); return; }
    if(act==="timer-reset"){ S.remaining=S.duration; S.running=false; render(); return; }
    if(act==="dim"){ setDim(el.getAttribute("data-k"), +el.getAttribute("data-v")); return; }
    if(act==="prev-scen"){ startScenario((S.scenIdx-1+SCENARIOS.length)%SCENARIOS.length); return; }
    if(act==="next-scen"){ startScenario((S.scenIdx+1)%SCENARIOS.length); return; }
  };

  /* textarea: keep state in sync without re-rendering (preserve caret) */
  var ta = $("#answer");
  if(ta){
    ta.oninput = function(){
      S.answer = ta.value;
      var w = S.answer.trim() ? S.answer.trim().split(/\s+/).length : 0;
      var wc = $("#wordcount"); if(wc) wc.textContent = w + " words";
    };
  }

  /* mock textarea: capture into MK.answers (string for typed, [q0,q1] for video) */
  var mta = $("#mkAnswer");
  if(mta){
    mta.focus();
    mta.oninput = function(){
      var st = MK.order[MK.idx];
      if(st && st.type==="typed"){ MK.answers[MK.idx] = mta.value; }
      else { if(!MK.answers[MK.idx]) MK.answers[MK.idx]=["",""]; MK.answers[MK.idx][MK.qIdx] = mta.value; }
    };
  }

  /* duration select */
  var sel = $("[data-act='duration']");
  if(sel){
    sel.onchange = function(){
      var d = +sel.value;
      S.duration=d; S.remaining=d; S.running=false; render();
    };
  }

  /* typing trainer input */
  var ti = $("#typeInput");
  if(ti){
    ti.focus();
    ti.oninput = function(){
      T.typed = ti.value;
      if(!T.started && T.typed.length) typingStart();
      var st = typingStats();
      typingPaintStats();
      if(st.done) typingFinish();
    };
  }
}

render();
</script>
</body>
</html>
