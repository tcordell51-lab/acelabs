<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reading Comprehension | Ace Labs</title>
<meta name="description" content="Ace Labs Reading Comprehension: timed DAT-format sections and single passages with a 10 and 10 pace bar, highlighter, and a review that shows the proof line for every answer.">
<script>
  /* apply the saved theme before first paint */
  try { var p = JSON.parse(localStorage.getItem('acelabs.rc.v1.prefs') || '{}'); if (p.theme) document.documentElement.setAttribute('data-theme', p.theme); } catch (e) {}
</script>
<link rel="stylesheet" href="rc.css">
</head>
<body>
<header class="rc-top">
  <a class="rc-brand" href="../../ace-labs.html">Ace <em>Labs</em></a>
  <span class="rc-kick" id="topKick">Reading Comprehension</span>
  <span class="grow"></span>
  <button class="btn small" id="themeBtn" type="button" aria-label="Switch reading theme">Light page</button>
</header>
<main id="app" aria-live="polite"></main>
<noscript><p style="padding:16px">The Reading Comprehension player needs JavaScript.</p></noscript>
<script src="data/bank.js"></script>
<script src="rc-store.js"></script>
<script src="rc.js"></script>
<script src="/shared/ace-shell.js?v=1" defer></script>
</body>
</html>
