<!DOCTYPE html>
<html lang="en" data-theme="dark" data-cream="rc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reading Comprehension | Ace Labs</title>
<meta name="description" content="Ace Labs Reading Comprehension: timed DAT-format sections and single passages with a 10 and 10 pace bar, highlighter, and a review that shows the proof line for every answer.">
<script>
  /* apply the saved theme before first paint */
  try { var p = JSON.parse(localStorage.getItem('acelabs.rc.v1.prefs') || '{}'); if (p.theme) document.documentElement.setAttribute('data-theme', p.theme); } catch (e) {}
</script>
<link rel="stylesheet" href="rc.css">
<style id="ace-fit">
/* phone text floors, written by scripts/design/fit-pages.mjs. Do not edit by hand. */
@media (max-width:759px){
.method span,.check,.card ol,.typerow .t,.empty,.hist,
.clock,.clock small,.cue,.choice .note,.yourline,.stat .s,
.ptime .top,.foot-note{font-size:15px!important}
.rc-kick,.btn.small,.rail .kick,.method .n,.settings .lab,.seg button,
.card .meta,.card .score,.typerow .t span:last-child,.hist th,.rc-bar .where .k,.pace .lbl,
.pace .tick span,.rc-passage .pmeta,.para .pn,.sent .ptag,.qnum,.chip,
.why .k,.grid .gl,.cell,.stat .k{font-size:13px!important}
}
</style>
<link rel="stylesheet" href="/shared/ace-cream.css?v=5">
</head>
<body>
<header class="rc-top">
  <a class="rc-brand" href="/">Ace <em>Labs</em></a>
  <span class="rc-kick" id="topKick">Reading Comprehension</span>
  <span class="grow"></span>
  <button class="btn small" id="themeBtn" type="button" aria-label="Switch reading theme">Light page</button>
</header>
<main id="app" aria-live="polite"></main>
<noscript><p style="padding:16px">The Reading Comprehension player needs JavaScript.</p></noscript>
<script src="data/bank.js"></script>
<script src="rc-store.js"></script>
<script src="/shared/ace-skills.js?v=2"></script>
<script src="/shared/ace-record.js?v=7"></script>
<script src="/shared/ace-test-review.js?v=7"></script>
<script src="rc.js"></script>
<script src="/shared/ace-shell.js?v=7" defer></script>
</body>
</html>
