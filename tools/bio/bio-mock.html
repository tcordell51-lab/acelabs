<style>
.mk-stage{max-width:820px;margin:0 auto;padding:0 60px}
.mk-intro{padding:30px 32px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:24px}
.mk-intro h2{font-family:'Playfair Display',serif;font-size:32px;margin:0 0 10px;font-weight:700;line-height:1.15}
.mk-intro h2 em{font-style:italic;color:var(--gold-d)}
.mk-intro .lede{font-size:15px;color:var(--ink-2);margin-bottom:18px;line-height:1.55}
.mk-config{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}

.mk-cfg{padding:16px 18px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px}

.mk-opts{display:flex;flex-direction:column;gap:8px}

.mk-opt:hover{border-color:var(--gold-d);background:var(--paper)}
.mk-opt.selected{background:var(--gold-bg);border-color:var(--gold-d)}

.mk-jumpbar button.cur{background:var(--ink);color:var(--paper)}
.mk-jumpbar button.answered{background:var(--good);color:#fff;border-color:var(--good-d)}

.mk-result h2{font-family:'Playfair Display',serif;font-size:34px;margin:0 0 14px;font-weight:700}
.mk-result h2 em{font-style:italic;color:var(--gold-d)}

@media (max-width:680px){.mk-scores{grid-template-columns:repeat(2,1fr)}}
.mk-scorecard{padding:16px 18px;text-align:center;background:var(--paper-2);border-radius:10px}
.mk-scorecard.gold{background:var(--gold-bg);border:1px solid var(--gold-d)}
.mk-scorecard .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-mute);margin-bottom:6px}

<script>
// 40-question DAT-format Bio mock — DAT bio is 40 questions in 30 minutes.
// Fixed 40-question bank, hand-curated to span all six hubs in DAT proportions:
//   Cell Lab: 14 (35%) · Genetics: 7 (17%) · Physiology: 10 (25%)
//   Diversity: 4 (10%) · Developmental: 2 (5%) · Evolution: 3 (8%)
const BANK = [
  // Cell Lab
  { hub:'Cell', q:'Phospholipid bilayers self-assemble in water primarily because:', opts:['hydrophobic tails are repelled by water','phosphate heads bond covalently','tails attract each other electrostatically','head groups are nonpolar'], correct:0, why:'The hydrophobic effect drives tails inward; this is entropy-driven, not enthalpy-driven.' },
  { hub:'Cell', q:'Which structure does NOT have a double membrane?', opts:['mitochondrion','chloroplast','nucleus','peroxisome'], correct:3, why:'Peroxisomes have a single membrane. The other three have two.' },
  { hub:'Cell', q:'A drug that blocks oxidative phosphorylation but NOT glycolysis would result in:', opts:['no ATP at all','only the 2 ATP from glycolysis','more ATP than normal','ATP from photosynthesis only'], correct:1, why:'Glycolysis is anaerobic and yields 2 net ATP. Oxidative phosphorylation in the ETC produces the bulk (~30+).' },
  { hub:'Cell', q:'During mitosis, sister chromatids separate at:', opts:['prophase','metaphase','anaphase','telophase'], correct:2, why:'Anaphase = sister chromatids pulled apart. Mnemonic: A for apart.' },
  { hub:'Cell', q:'In the lac operon, the inducer is:', opts:['lactose','allolactose','glucose','cAMP'], correct:1, why:'Allolactose (an isomer of lactose) binds the repressor and inactivates it. Lactose itself is the substrate, not the inducer.' },
  { hub:'Cell', q:'A peptide bond forms between:', opts:['the carboxyl of one amino acid and the amine of the next','two side chains','the alpha carbons','two cysteine sulfurs'], correct:0, why:'-COOH + H₂N- condense, releasing water.' },
  { hub:'Cell', q:'Which of these enzymes synthesizes RNA?', opts:['DNA polymerase','RNA polymerase','ribosome','reverse transcriptase'], correct:1, why:'RNA polymerase transcribes DNA → RNA. Reverse transcriptase goes RNA → DNA (retroviruses).' },
  { hub:'Cell', q:'The smooth ER\'s primary function in muscle cells is:', opts:['protein synthesis','lipid synthesis','calcium storage and release','glycogen breakdown'], correct:2, why:'In muscle, smooth ER is called the sarcoplasmic reticulum and stores Ca²⁺ for contraction.' },
  { hub:'Cell', q:'Active transport against a gradient requires:', opts:['ATP or another energy source','only a transport protein','a concentration difference','a charged membrane'], correct:0, why:'Active = uphill = energy-dependent. ATP-driven (Na⁺/K⁺ pump) or coupled to a gradient (secondary active transport).' },
  { hub:'Cell', q:'Glycolysis takes place in the:', opts:['mitochondrial matrix','intermembrane space','cytoplasm','nucleus'], correct:2, why:'Glycolysis is cytoplasmic and anaerobic. Krebs is matrix; ETC is inner membrane.' },
  { hub:'Cell', q:'The genetic code is:', opts:['ambiguous (one codon → many AAs)','degenerate (many codons → one AA)','linear (each base = one AA)','species-specific'], correct:1, why:'Degenerate = redundant. 64 codons → 20 amino acids + stop. Most amino acids have multiple codons.' },
  { hub:'Cell', q:'Cell-membrane fluidity is increased by:', opts:['more cholesterol at high temps','more saturated fatty acid tails','more unsaturated tails (kinks)','thicker glycoprotein layers'], correct:2, why:'Unsaturated tails kink and pack loosely → more fluidity. Cholesterol buffers against extreme temps in either direction.' },
  { hub:'Cell', q:'A signal transduction pathway using G-protein coupled receptors typically activates:', opts:['adenylyl cyclase → cAMP','transcription factor binding','direct DNA modification','endocytosis'], correct:0, why:'GPCR → G protein → adenylyl cyclase → cAMP → PKA cascade.' },
  { hub:'Cell', q:'Cyanide blocks complex IV of the ETC. The immediate consequence is:', opts:['NAD+ accumulates','protons can\'t be pumped','glycolysis stops','glucose can\'t enter cells'], correct:1, why:'Complex IV reduces O₂ to H₂O and pumps protons. Block it and the proton gradient collapses; ATP synthesis halts.' },

  // Genetics
  { hub:'Genetics', q:'A test cross is performed when you want to determine:', opts:['the dominant allele','whether an individual showing the dominant phenotype is homozygous or heterozygous','allele frequency','recombination rates only'], correct:1, why:'Cross with homozygous recessive. If any recessive offspring appear, parent must be heterozygous.' },
  { hub:'Genetics', q:'Two unlinked genes assort independently because:', opts:['they are on the same chromosome','they are on different chromosomes','crossing over equalizes them','they share a promoter'], correct:1, why:'Independent assortment requires the genes be on different chromosomes (or far apart on the same one).' },
  { hub:'Genetics', q:'A mutation that changes one base but doesn\'t change the amino acid is:', opts:['nonsense','missense','silent','frameshift'], correct:2, why:'Silent = synonymous. Possible because the genetic code is degenerate.' },
  { hub:'Genetics', q:'Which of the following is most likely to be an autosomal recessive disorder?', opts:['skips generations and affects males more','affects half of children of affected parents','can skip generations and affects sexes equally','only seen in females'], correct:2, why:'Recessive = skips generations (carriers in between). Autosomal = sexes equally.' },
  { hub:'Genetics', q:'In a dihybrid cross AaBb × AaBb (independent assortment), the phenotypic ratio is:', opts:['3:1','9:3:3:1','1:1:1:1','1:2:1'], correct:1, why:'Classic Mendelian dihybrid: 9 dom-dom : 3 dom-rec : 3 rec-dom : 1 rec-rec.' },
  { hub:'Genetics', q:'A bacterium picks up DNA from its environment. This is:', opts:['transduction','conjugation','transformation','translation'], correct:2, why:'Transformation = uptake of free DNA. Transduction = via virus. Conjugation = via pilus.' },
  { hub:'Genetics', q:'Which type of selection would NARROW phenotypic variation in a population?', opts:['directional','disruptive','stabilizing','sexual'], correct:2, why:'Stabilizing selection favors the average, narrowing variance. Directional shifts the mean; disruptive splits it.' },

  // Physiology
  { hub:'Physiology', q:'Insulin and glucagon are both:', opts:['steroid hormones','peptide hormones','catecholamines','from the adrenal gland'], correct:1, why:'Both peptide hormones, both from the pancreas (β-cells = insulin, α-cells = glucagon).' },
  { hub:'Physiology', q:'During inhalation, the diaphragm:', opts:['relaxes and rises','contracts and flattens','remains stationary','contracts and rises'], correct:1, why:'Diaphragm contracts and flattens, increasing thoracic volume → pressure drops → air flows in.' },
  { hub:'Physiology', q:'The hormone that stimulates milk ejection (let-down) is:', opts:['prolactin','oxytocin','progesterone','estrogen'], correct:1, why:'Prolactin makes the milk; oxytocin ejects it (positive feedback loop with suckling).' },
  { hub:'Physiology', q:'A myelinated motor neuron is more efficient than an unmyelinated one because:', opts:['it uses less ATP per impulse','action potentials are larger','saltatory conduction skips between nodes of Ranvier','myelin amplifies the signal'], correct:2, why:'Insulation forces the action potential to regenerate only at nodes — far faster than continuous conduction.' },
  { hub:'Physiology', q:'Loop of Henle\'s descending limb is permeable to:', opts:['water only','solutes only','water and Na+','neither'], correct:0, why:'Descending limb = water permeable, solute impermeable. Ascending limb is the opposite.' },
  { hub:'Physiology', q:'Antibodies are produced by:', opts:['T cells','B cells (plasma cells)','macrophages','dendritic cells'], correct:1, why:'B cells differentiate into plasma cells, which secrete antibodies (humoral immunity).' },
  { hub:'Physiology', q:'In the cardiac cycle, the "lub" sound corresponds to:', opts:['ventricular relaxation','closure of AV valves','closure of semilunar valves','atrial contraction'], correct:1, why:'S1 (lub) = AV (mitral + tricuspid) valve closure at the start of systole. S2 (dub) = semilunar.' },
  { hub:'Physiology', q:'The FSH and LH surge in females triggers:', opts:['menstruation','ovulation','implantation','fertilization'], correct:1, why:'LH surge specifically triggers ovulation. FSH stimulates follicle growth before that.' },
  { hub:'Physiology', q:'Which of the following is responsible for muscle contraction by sliding actin past myosin?', opts:['Ca2+ binding troponin','ATP binding actin','myosin auto-activation','Cl- influx'], correct:0, why:'Ca²⁺ binds troponin → conformational change exposes binding sites on actin → myosin heads cycle.' },
  { hub:'Physiology', q:'A patient with hypothyroidism has low circulating T3/T4. Negative feedback would cause:', opts:['low TSH','high TSH','high cortisol','low ACTH'], correct:1, why:'Low T3/T4 → no inhibition of pituitary → pituitary cranks out TSH trying to stimulate the thyroid.' },

  // Diversity
  { hub:'Diversity', q:'A bacterium has cells walls of peptidoglycan. An archaean has:', opts:['peptidoglycan walls too','pseudopeptidoglycan or other unique walls','no walls','cellulose walls'], correct:1, why:'Archaea lack peptidoglycan. Many have pseudopeptidoglycan or S-layer walls of unique chemistry.' },
  { hub:'Diversity', q:'Animals belong to which of the following clades?', opts:['Bacteria','Archaea','Eukarya','Both Bacteria and Eukarya'], correct:2, why:'All animals are eukaryotes — Domain Eukarya, Kingdom Animalia.' },
  { hub:'Diversity', q:'Which is NOT a characteristic of fungi?', opts:['heterotrophic','cell walls of chitin','reproduce via spores','perform photosynthesis'], correct:3, why:'Fungi are heterotrophic (decomposers/parasites). They never photosynthesize.' },
  { hub:'Diversity', q:'Sponges (Phylum Porifera) lack:', opts:['true tissues','any cells','reproduction','differentiation'], correct:0, why:'Sponges have specialized cells (choanocytes, etc.) but no true tissues. They are the simplest animals.' },

  // Developmental
  { hub:'Devo', q:'The blastopore in protostomes becomes the:', opts:['anus','mouth','gut','brain'], correct:1, why:'Protostome = "first mouth". Deuterostomes (chordates, echinoderms) have the blastopore become the anus.' },
  { hub:'Devo', q:'Neurulation produces the neural tube from:', opts:['endoderm','mesoderm','ectoderm','all three'], correct:2, why:'Neural tube comes from ectoderm (specifically the neural plate). It becomes the brain + spinal cord.' },

  // Evolution
  { hub:'Evolution', q:'A geographic barrier splits a population into two non-interbreeding groups. This sets up:', opts:['sympatric speciation','allopatric speciation','polyploid speciation','convergent evolution'], correct:1, why:'Allopatric = "other place". Geographic isolation is the most common speciation mechanism.' },
  { hub:'Evolution', q:'Bottleneck and founder effects are both forms of:', opts:['gene flow','natural selection','genetic drift','sexual selection'], correct:2, why:'Both involve sharp reductions in population size, exaggerating drift\'s random allele changes.' },
  { hub:'Evolution', q:'Analogous structures (e.g., bird and insect wings) result from:', opts:['common ancestry','divergent evolution','convergent evolution','genetic drift'], correct:2, why:'Convergent: similar selection pressures shape unrelated lineages into similar forms. Homologous structures = common ancestry.' }
];

const STORE_KEY = 'acethedat_bio_mock_runs';
const LAST_KEY  = 'acethedat_bio_mock_last';
const STATE = { pool:null, i:0, answers:{}, flags:{}, started:null, durationSec:30*60, timerId:null, finished:false };

function saveRun(record){
  try {
    const runs = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    runs.push(record);
    localStorage.setItem(STORE_KEY, JSON.stringify(runs.slice(-30)));
    localStorage.setItem(LAST_KEY, JSON.stringify(record));
  } catch(e){}
}
function loadLast(){ try { return JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); } catch(e){ return null; } }
function loadRuns(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e){ return []; } }

// 1-21 scaled-score predictor calibrated against DAT bio percent-correct.
function predictScaled(pctCorrect){
  const anchors = [[0,13],[0.30,15],[0.42,16],[0.52,17],[0.60,18],[0.68,19],[0.74,20],[0.80,21],[0.85,22],[0.90,23],[0.94,24],[0.97,25],[1,30]];
  for (let i = 1; i < anchors.length; i++){
    if (pctCorrect <= anchors[i][0]){
      const [x0,y0] = anchors[i-1], [x1,y1] = anchors[i];
      const t = (x1 - x0) > 0 ? (pctCorrect - x0)/(x1 - x0) : 0;
      return Math.max(13, Math.min(30, Math.round(y0 + t*(y1 - y0))));
    }
  }
  return 30;
}

function renderIntro(){
  const last = loadLast();
  const runs = loadRuns();
  document.getElementById('mkStage').innerHTML = `
    <div class="mk-intro">
      <h2>Bio mock <em>exam</em>.</h2>
      <p class="lede">40-question fixed bank — same 40 items each retake. 30 minutes, DAT timing. Sampled across the six hubs in DAT proportions. Score predictor maps to the 1-30 DAT bio scaled score using anchor calibration.</p>
      <div class="mk-config">
        <div class="mk-cfg">
          <h3>Format</h3>
          <label><span>Questions</span><b>40</b></label>
          <label><span>Time</span><b>30 min</b></label>
          <label><span>Format</span><b>DAT exact</b></label>
          <label><span>Skipping</span><b>allowed (revisit)</b></label>
        </div>
        <div class="mk-cfg">
          <h3>History</h3>
          <label><span>Mocks taken</span><b>${runs.length}</b></label>
          ${last ? `<label><span>Last raw</span><b>${last.score}/${last.total}</b></label><label><span>Last predicted</span><b>${last.predicted}</b></label><label><span>Last attempt</span><b>${new Date(last.ts).toLocaleDateString()}</b></label>` : '<label><span>No attempts yet</span><b>—</b></label>'}
        </div>
      </div>
      <button class="btn primary lg" id="mkStart">Start mock</button>
      ${last ? `<button class="btn ghost lg" id="mkReviewLast" style="margin-left:8px">Review last results</button>` : ''}
    </div>
  `;
  document.getElementById('mkStart').addEventListener('click', start);
  if (last) document.getElementById('mkReviewLast').addEventListener('click', () => renderResults(last));
}

function start(){
  // Sample 40 from BANK, preserving hub proportions roughly. BANK has the right
  // distribution already — shuffle and take the whole thing if we have 40.
  const pool = BANK.slice();
  // Fisher-Yates shuffle
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  STATE.pool = pool.slice(0, Math.min(40, pool.length));
  STATE.i = 0; STATE.answers = {}; STATE.flags = {}; STATE.started = Date.now(); STATE.finished = false;
  STATE.durationSec = 30*60;
  renderRun();
  startTimer();
}

function startTimer(){
  if (STATE.timerId) clearInterval(STATE.timerId);
  STATE.timerId = setInterval(() => {
    if (STATE.finished){ clearInterval(STATE.timerId); return; }
    const elapsed = Math.floor((Date.now() - STATE.started)/1000);
    const rem = Math.max(0, STATE.durationSec - elapsed);
    const t = document.getElementById('mkTimer');
    if (t){
      const m = Math.floor(rem/60), s = rem%60;
      t.textContent = m + ':' + String(s).padStart(2,'0');
      t.className = 'timer' + (rem < 60 ? ' danger' : rem < 300 ? ' warn' : '');
    }
    if (rem === 0){ finishMock(); }
  }, 1000);
}

function renderRun(){
  if (STATE.i >= STATE.pool.length){ finishMock(); return; }
  const Q = STATE.pool[STATE.i];
  const total = STATE.pool.length;
  const sel = STATE.answers[STATE.i];
  document.getElementById('mkStage').innerHTML = `
    <div class="mk-runtop">
      <span>Q ${STATE.i+1} / ${total}</span>
      <span class="timer" id="mkTimer">30:00</span>
      <span>Bio &middot; ${Q.hub}</span>
    </div>
    <div class="mk-runbody">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="mk-tag">${Q.hub}</div>
        <button class="mk-flag ${STATE.flags[STATE.i] ? 'on' : ''}" id="mkFlag">${STATE.flags[STATE.i] ? 'Flagged' : 'Flag for review'}</button>
      </div>
      <div class="mk-q">${Q.q}</div>
      <div class="mk-opts">
        ${Q.opts.map((o,i) => `<div class="mk-opt ${sel===i?'selected':''}" data-i="${i}"><span class="let">${'ABCD'[i]}</span><span>${o}</span></div>`).join('')}
      </div>
      <div class="mk-foot">
        <button class="btn ghost" id="mkPrev" ${STATE.i === 0 ? 'disabled' : ''}>&larr; Back</button>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute)">${Object.keys(STATE.answers).length} / ${total} answered</span>
        <button class="btn primary" id="mkNext">${STATE.i === total-1 ? 'Finish &rarr;' : 'Next &rarr;'}</button>
      </div>
      <div class="mk-jumpbar" id="mkJump">
        ${STATE.pool.map((_,i) => {
          const cls = ['mk-jumpbar-btn'];
          if (i === STATE.i) cls.push('cur');
          else if (STATE.answers[i] !== undefined) cls.push('answered');
          if (STATE.flags[i]) cls.push('flagged');
          return `<button data-jump="${i}" class="${cls.join(' ')}">${i+1}</button>`;
        }).join('')}
      </div>
      <div style="margin-top:14px;text-align:right">
        <button class="btn ghost sm" id="mkBail">Exit mock</button>
      </div>
    </div>
  `;
  // Restart timer rendering
  startTimer();
  document.querySelectorAll('.mk-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      STATE.answers[STATE.i] = parseInt(opt.dataset.i);
      document.querySelectorAll('.mk-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    });
  });
  document.getElementById('mkPrev').addEventListener('click', () => { if (STATE.i > 0){ STATE.i--; renderRun(); } });
  document.getElementById('mkNext').addEventListener('click', () => {
    if (STATE.i === STATE.pool.length-1){ finishMock(); }
    else { STATE.i++; renderRun(); }
  });
  document.getElementById('mkFlag').addEventListener('click', () => {
    STATE.flags[STATE.i] = !STATE.flags[STATE.i];
    renderRun();
  });
  document.getElementById('mkBail').addEventListener('click', () => {
    if (confirm('Exit mock without saving? Your answers will be lost.')){
      if (STATE.timerId) clearInterval(STATE.timerId);
      STATE.finished = true;
      renderIntro();
    }
  });
  document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => {
    STATE.i = parseInt(b.dataset.jump); renderRun();
  }));
}

function finishMock(){
  if (STATE.finished) return;
  STATE.finished = true;
  if (STATE.timerId) clearInterval(STATE.timerId);
  const total = STATE.pool.length;
  let score = 0;
  const byHub = {};
  const wrong = [];
  STATE.pool.forEach((q, i) => {
    if (!byHub[q.hub]) byHub[q.hub] = { correct:0, total:0 };
    byHub[q.hub].total++;
    if (STATE.answers[i] === q.correct){ byHub[q.hub].correct++; score++; }
    else { wrong.push({ ...q, picked: STATE.answers[i] }); }
  });
  const pct = total > 0 ? score/total : 0;
  const predicted = predictScaled(pct);
  const record = { score, total, predicted, pctRaw: Math.round(pct*100), byHub, ts: Date.now(), durationSec: Math.round((Date.now()-STATE.started)/1000), wrong };
  saveRun(record);
  renderResults(record);
}

function renderResults(record){
  const hubRows = Object.entries(record.byHub).map(([hub, r]) => {
    const p = Math.round(100 * r.correct / r.total);
    const cls = p >= 75 ? 'strong' : p < 50 ? 'weak' : '';
    return `<tr><td>${hub}</td><td>${r.correct}/${r.total}</td><td class="${cls}">${p}%</td></tr>`;
  }).join('');
  const wrong = record.wrong || [];
  document.getElementById('mkStage').innerHTML = `
    <div class="mk-result">
      <h2>Mock <em>complete</em>.</h2>
      <div class="mk-scores">
        <div class="mk-scorecard"><div class="lbl">Raw</div><div class="num"><em>${record.score}</em>/${record.total}</div></div>
        <div class="mk-scorecard"><div class="lbl">Accuracy</div><div class="num">${record.pctRaw}%</div></div>
        <div class="mk-scorecard gold"><div class="lbl">Predicted Bio</div><div class="num">${record.predicted}</div></div>
        <div class="mk-scorecard"><div class="lbl">Time</div><div class="num">${Math.floor(record.durationSec/60)}m</div></div>
      </div>
      <h3 style="font-family:'Playfair Display',serif;font-size:20px;margin:18px 0 6px;font-weight:700">Per-hub <em>breakdown</em></h3>
      <table class="mk-hubtable">
        <thead><tr><th>Hub</th><th>Hit</th><th>%</th></tr></thead>
        <tbody>${hubRows}</tbody>
      </table>
      ${wrong.length > 0 ? `
        <h3 style="font-family:'Playfair Display',serif;font-size:20px;margin:24px 0 12px;font-weight:700">Needs-review <em>walkthrough</em> (${wrong.length})</h3>
        ${wrong.map(w => {
          const yourLetter = w.picked !== undefined ? 'ABCD'[w.picked] : '—';
          return `<div class="mk-review-item">
            <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--gold-d);font-weight:700;text-transform:uppercase;margin-bottom:6px">${w.hub}</div>
            <b>${w.q}</b>
            <div class="why">You picked <em>${yourLetter}</em>. Correct: <b>${'ABCD'[w.correct]}.</b> ${w.opts[w.correct]} &middot; ${w.why}</div>
          </div>`;
        }).join('')}
      ` : '<p style="margin-top:20px;font-size:14px;color:var(--good-d);font-weight:600">Clean run. Take another to test consistency.</p>'}
      <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">
        <button class="btn primary lg" id="mkRetake">Retake</button>
        <a class="btn lg" href="bio-analytics.html">Analytics</a>
        <a class="btn ghost lg" href="bio-calendar.html">Back to plan</a>
      </div>
    </div>
  `;
  document.getElementById('mkRetake').addEventListener('click', start);
}

renderIntro();
</script>
<script src="bio-shared.js"></script>
</body>
</html>
