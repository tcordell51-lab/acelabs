<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ace Labs: Osmosis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#1B3A2D;--deep:#0d2018;--ink:#0f0d0a;--paper:#F5F0E8;--card:#FCFAF6;--gold:#C9A84C;--gold2:#E2C97A;--goldink:#7c6113;--muted:#55645b;--line:rgba(27,58,45,.15);--good:#2f6b50;--bad:#a8463c;
--display:"Playfair Display",ui-serif,Georgia,serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--out:cubic-bezier(.16,1,.3,1);--io:cubic-bezier(.65,0,.35,1);--spring:cubic-bezier(.34,1.56,.64,1);--r:22px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:0;z-index:30;background:rgba(245,240,232,.84);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;padding-top:10px;padding-bottom:10px}
.brand{display:inline-flex;color:var(--forest);width:fit-content}
.lockup{height:30px;aspect-ratio:936/201;display:block}
.seg{grid-column:1/-1;position:relative;display:grid;grid-template-columns:repeat(2,1fr);background:rgba(27,58,45,.08);border-radius:999px;padding:4px;--i:0}
.seg button{position:relative;z-index:1;padding:9px 6px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted);text-align:center;transition:color .3s}
.seg button[aria-selected="true"]{color:var(--paper)}
.thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);border-radius:999px;background:var(--forest);transform:translateX(calc(var(--i)*100%));transition:transform .6s var(--out);box-shadow:0 6px 16px -8px rgba(13,32,24,.6)}
.crumb{font-size:13px;font-weight:500;color:var(--forest);padding:8px 13px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
@media(max-width:919px){.crumb{display:none}}
@media(min-width:920px){.top .wrap{grid-template-columns:auto 1fr auto}.seg{grid-column:2;grid-row:1;width:340px;justify-self:center}.crumb{grid-column:3;grid-row:1}.lockup{height:34px}}
main{padding:16px 0 90px}
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;background:var(--deep);color:var(--paper);padding:26px 22px;margin-bottom:18px}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(50px)}
.hero::before{width:70%;aspect-ratio:1;left:-18%;top:-60%;background:radial-gradient(circle,#2f6b50 0,transparent 68%);animation:drift 16s var(--io) infinite alternate}
.hero::after{width:60%;aspect-ratio:1;right:-20%;bottom:-70%;background:radial-gradient(circle,rgba(201,168,76,.5) 0,transparent 66%);animation:drift 21s var(--io) infinite alternate-reverse}
@keyframes drift{to{transform:translate(18%,22%) scale(1.25)}}
.gridlines{position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(245,240,232,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(245,240,232,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 30% 0,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 30% 0,#000 20%,transparent 75%)}
.hero-copy{display:grid;gap:10px}
.hero-copy.rise>*{animation:rise .9s var(--out) both}
.hero-copy.rise>*:nth-child(2){animation-delay:.06s}.hero-copy.rise>*:nth-child(3){animation-delay:.12s}.hero-copy.rise>*:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
h1{font-family:var(--display);font-weight:700;letter-spacing:-.012em;font-size:clamp(34px,6.4vw,54px);line-height:1.04;margin:0;text-wrap:balance}
h1 em{color:var(--gold2)}
.lead{margin:0;color:rgba(245,240,232,.78);max-width:56ch;font-size:16.5px}
.dots{display:flex;gap:6px;align-items:center;font-size:12px;color:rgba(245,240,232,.6)}
.dots i{width:6px;height:6px;border-radius:99px;background:rgba(245,240,232,.25);transition:width .45s var(--out),background .3s}
.dots i.on{width:22px;background:var(--gold)}.dots i.done{background:var(--gold2)}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:920px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stage{position:relative;padding:10px;transition:box-shadow .4s}
canvas{width:100%;display:block;border-radius:16px}
.badge{position:absolute;top:22px;right:22px;background:var(--forest);color:var(--paper);font-weight:700;font-size:13px;padding:7px 13px;border-radius:999px;opacity:0;transform:translateY(-8px) scale(.9);transition:transform .5s var(--spring),opacity .3s}
.badge.show{opacity:1;transform:none}
.panel{display:grid;gap:0}
.panel h3{margin:0 0 4px;font-size:16px;line-height:1.25}
.k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--goldink)}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px;line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:15px;margin:8px 0}
.val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--forest);background:rgba(27,58,45,.07);border-radius:999px;padding:5px 12px}
input[type=range]{width:100%;accent-color:var(--forest);height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{font-size:14px;font-weight:500;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--forest);transition:transform .4s var(--spring),background .25s,color .25s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--forest);color:var(--paper);transform:translateY(-3px)}
.chip.right{background:var(--forest);color:var(--paper);border-color:var(--forest)}
.chip.wrong{border-color:var(--bad);color:var(--bad);background:#f8e5e2}
.hr{height:1px;background:var(--line);margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:999px;font-weight:700;font-size:15px;background:var(--forest);color:var(--paper);transition:transform .45s var(--spring),box-shadow .3s}
.btn:active{transform:scale(.95)}
@media(hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 14px 24px -16px rgba(13,32,24,.7)}}
.go{width:100%;background:var(--gold);color:var(--deep)}
.go:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.ghost{background:transparent;color:var(--forest);border:1px solid var(--line)}
.ghost:disabled{opacity:.4}
.nav{display:flex;gap:10px;margin-top:12px}
.nav .btn{flex:1}
.take{display:none;margin-top:14px;font-size:15.5px;line-height:1.5;padding:4px 0 4px 12px;border-left:2px solid var(--gold)}
.take.show{display:block;animation:rise .6s var(--out)}
.take b{color:var(--forest)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0;font-size:15px;transition:transform .4s var(--spring),background .25s,border-color .25s}
.opt.yours{border-color:var(--bad);background:#f8e5e2}
.opt.key{border-color:var(--forest);background:rgba(27,58,45,.07)}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-left:8px}
.steps{list-style:none;padding:0;margin:0 0 14px;display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid rgba(27,58,45,.3)}
.step.on{color:var(--forest);font-weight:700}.step.on i{background:var(--gold);border-color:var(--gold);color:var(--deep)}
.step.done i{background:var(--forest);border-color:var(--forest);color:var(--paper)}
.step+.step:before{content:"";width:10px;height:1px;background:var(--line)}
.big{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.15;margin:2px 0 10px}
.big em{color:var(--goldink)}
.math{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;color:var(--forest);background:rgba(201,168,76,.16);border-radius:14px;padding:10px 14px;display:inline-block;margin:4px 0 8px}
.qtext{font-weight:500;line-height:1.5;margin:6px 0}
.list p{margin:0;padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.list p:first-child{border-top:0}
.list b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:var(--paper);font-size:12px}
.meter{display:grid;gap:8px;padding:14px 10px 6px}
.meter.off{visibility:hidden}
.mrow{display:grid;grid-template-columns:62px 1fr 44px;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--muted)}
.mrow b{font-variant-numeric:tabular-nums;color:var(--forest);text-align:right}
.bar{height:10px;border-radius:99px;background:rgba(27,58,45,.08);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--gold);transition:width .3s var(--out)}
.mrow.in .bar i{background:#c9504a}
.flow{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--forest);margin-top:2px}
.flow:before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(27,58,45,.35)}
.flow.in:before,.flow.out:before{background:#3d8fd1;box-shadow:0 0 0 4px rgba(61,143,209,.18);animation:pulse 1s var(--io) infinite}
.flow.hot{color:var(--bad)}.flow.hot:before{background:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(61,143,209,.05)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>

<header class="top"><div class="wrap">
  <a class="brand" href="/tools/bio/" aria-label="ACE DAT"><svg class="lockup"><use href="#lk"/></svg></a>
  <div class="seg" id="seg" role="tablist"><span class="thumb"></span><button id="mLearn" role="tab" aria-selected="true">Learn</button><button id="mReview" role="tab" aria-selected="false">Review + Repair</button></div>
  <span class="crumb">Ace Labs &middot; Bio &middot; Osmosis</span>
</div></header>
<main class="wrap">
  <section class="hero"><div class="gridlines"></div>
    <div class="hero-copy" id="hc">
      <div class="dots" id="dots"></div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
    </div>
  </section>
  <div class="grid">
    <div class="card stage"><canvas id="cv" width="1200" height="840"></canvas><div class="badge" id="badge"></div><div class="meter" id="meter"><div class="mrow"><span>Outside</span><div class="bar"><i id="bo"></i></div><b id="vo">0.30</b></div><div class="mrow in"><span>Inside</span><div class="bar"><i id="bi"></i></div><b id="vi">0.30</b></div><div class="flow" id="flow">Ready</div></div></div>
    <div class="card panel" id="panel"></div>
  </div>
</main>
<script>
const INSIDE = 0.30, K = 30;
const C = {dark:'#0d2018',forest:'#1B3A2D',gold:'#C9A84C',lgold:'#E2C97A',cream:'#F5F0E8'};
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const SX = cv.width/600, SY = cv.height/420;
const rnd = (a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const store = { get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };

/* ---------- simulation ---------- */
const sim = {cell:'rbc', nonpen:0.6, pen:0, ion:1, running:false, t:0, u:0, scale:1, lysed:false, lyseT:0, flow:0, done:false, onDone:null, parts:[], inner:[], water:[], haze:[]};
function setup(cfg){
  Object.assign(sim,{cell:cfg.cell||'rbc', nonpen:cfg.nonpen??0.3, pen:cfg.pen||0, ion:cfg.ion||1, running:false,t:0,u:0,scale:1,lysed:false,lyseT:0,flow:0,done:false,onDone:null,water:[],haze:[]});if(sim.cell==='plant')sim.scale=.92;
  const free=(x,y)=> sim.cell==='rbc' ? Math.hypot(x-300,y-225)>150 : !(Math.abs(x-300)<165&&Math.abs(y-225)<138);
  const pos=()=>{let x,y,n=0;do{x=rnd(62,538);y=rnd(70,385);n++}while(!free(x,y)&&n<200);return[x,y]};
  sim.parts=[];
  const nNon=Math.round(sim.nonpen*K), ionCols=[C.gold,'#b9832f','#E2C97A'];
  for(let i=0;i<nNon;i++){const[x,y]=pos();sim.parts.push({x,y,ph:rnd(0,6.28),col:ionCols[sim.ion>1?i%sim.ion:0],r:sim.ion>1&&i%sim.ion?3.6:5,k:'n'})}
  for(let i=0;i<Math.round(sim.pen*K);i++){const[x,y]=pos();const a=rnd(0,6.28),d=rnd(0,.55);sim.parts.push({x,y,ph:rnd(0,6.28),col:'#2f9c92',r:4.4,k:'u',e:rnd(0,.9),ia:a,id:d})}
  sim.inner=[];for(let i=0;i<Math.round(INSIDE*K);i++)sim.inner.push({a:rnd(0,6.28),d:rnd(.15,.6),ph:rnd(0,6.28)});
}
function ratio(){const eff=sim.nonpen+sim.pen*(1-sim.u);return INSIDE/Math.max(eff,0.03)}
function tgt(){const r=ratio();return sim.cell==='rbc'?Math.pow(clamp(r,.45,2.4),.5):(r>=1?Math.min(1,.92+(r-1)*.12):Math.max(.55,.92*Math.pow(r,.62)))}
function run(onDone){sim.running=true;sim.t=0;sim.onDone=onDone}
function outcome(){
  if(sim.cell==='rbc'){if(sim.lysed)return'burst';if(sim.scale>1.04)return'swell';if(sim.scale<.96)return'shrink';return'stay'}
  const r=INSIDE/Math.max(sim.nonpen,0.03);if(r>1.04)return'turgid';if(r<.96)return'plasmolysis';return'stay';
}
function tonicity(){const o=sim.nonpen;return o>INSIDE+0.005?'hypertonic':o<INSIDE-0.005?'hypotonic':'isotonic'}
function drift(dt){const Rc=cellR()*sim.scale+12;
  sim.parts.forEach(p=>{if(p.k==='u'&&sim.u>p.e)return;p.vx=(p.vx||0)*.95+rnd(-1,1)*22*dt;p.vy=(p.vy||0)*.95+rnd(-1,1)*22*dt;p.x+=p.vx*dt*7;p.y+=p.vy*dt*7;
    if(p.x<64){p.x=64;p.vx=Math.abs(p.vx)}if(p.x>536){p.x=536;p.vx=-Math.abs(p.vx)}if(p.y<72){p.y=72;p.vy=Math.abs(p.vy)}if(p.y>384){p.y=384;p.vy=-Math.abs(p.vy)}
    if(sim.lysed)return;const dx=p.x-300,dy=p.y-225;
    if(sim.cell==='rbc'){const d=Math.hypot(dx,dy)||1;if(d<Rc){p.x=300+dx/d*Rc;p.y=225+dy/d*Rc}}
    else if(Math.abs(dx)<150&&Math.abs(dy)<128){if(150-Math.abs(dx)<128-Math.abs(dy))p.x=300+Math.sign(dx||1)*150;else p.y=225+Math.sign(dy||1)*128}})}
function step(dt){drift(dt);
  if(sim.running&&!sim.done){
    sim.t+=dt;
    if(sim.pen>0&&sim.t>.6)sim.u=Math.min(1,sim.u+dt/3.2);
    const T=tgt(), prev=sim.scale;
    if(!sim.lysed){sim.scale+=(T-sim.scale)*Math.min(1,dt*1.5);sim.flow=T-sim.scale}
    if(sim.cell==='rbc'&&!sim.lysed&&sim.scale>1.27){sim.lysed=true;try{document.querySelector('.stage').animate([{transform:'scale(1)'},{transform:'scale(1.018)'},{transform:'scale(1)'}],{duration:320,easing:'cubic-bezier(.34,1.56,.64,1)'})}catch(e){}for(let i=0;i<46;i++){const a=rnd(0,6.28);sim.haze.push({a,d:rnd(20,110),v:rnd(40,110),r:rnd(3,8)})}}
    if(sim.lysed){sim.lyseT+=dt;sim.flow=0}
    // water dots
    if(!sim.lysed){
      const iso=Math.abs(sim.flow)<.004, rate=iso?3:clamp(Math.abs(sim.flow)*260,6,26);
      if(Math.random()<rate*dt){sim.water.push({a:rnd(0,6.28),p:0,dir:iso?(Math.random()<.5?1:-1):(sim.flow>0?1:-1)})}
    }
    const settled=Math.abs(tgt()-sim.scale)<.006&&(sim.pen===0||sim.u>=1)&&sim.t>2.2;
    if((settled&&!sim.lysed)||(sim.lysed&&sim.lyseT>1.4)){sim.done=true;sim.running=false;sim.water=[];sim.onDone&&sim.onDone(outcome())}
  }
  sim.water.forEach(w=>w.p+=dt*1.25);sim.water=sim.water.filter(w=>w.p<1);
  sim.haze.forEach(h=>{h.d=Math.min(h.d+h.v*dt*.5,150)});
}
/* ---------- drawing ---------- */
let clock=0;
function cellR(){return sim.cell==='rbc'?96:118}
function draw(){
  g.setTransform(SX,0,0,SY,0,0);g.clearRect(0,0,600,420);
  // beaker
  const wg=g.createLinearGradient(0,50,0,400);wg.addColorStop(0,'#eaf5f7');wg.addColorStop(1,'#cbe7ed');
  rr(40,48,520,350,26);g.fillStyle=wg;g.fill();g.lineWidth=3;g.strokeStyle='#b7d3d8';g.stroke();
  g.fillStyle='rgba(255,255,255,.55)';rr(52,58,14,300,7);g.fill();

const fmt=v=>v.toFixed(2);
function verdictRBC(o,osm){
  if(o==='burst')return`Outside ${fmt(osm)} osM is far below the inside (0.30), so it was <b>hypotonic</b>. Water rushed in until the cell burst (lysis).`;
  if(o==='swell')return`Outside ${fmt(osm)} osM is below 0.30: <b>hypotonic</b>. Water moved in and the cell swelled.`;
  if(o==='shrink')return`Outside ${fmt(osm)} osM is above 0.30: <b>hypertonic</b>. Water left for the saltier side and the cell shrank (crenation).`;
  return`Outside matches inside at 0.30 osM: <b>isotonic</b>. Water still crosses, just equally both ways, so no net change.`;
}

    const cards=store.get('acelabs-cards',[]);if(!cards.some(c=>c.id==='osm-cacl2')){cards.push({id:'osm-cacl2',front:'0.20 M CaCl\u2082 vs a 0.30 osM cell?',back:'0.60 osM, hypertonic, shrinks',due:Date.now()+864e5,ladder:[1,3,7,14,30],why:rv.why});store.set('acelabs-cards',cards)}
    head('Review + Repair','Locked <em>in</em>.','The miss is logged, the fix is drilled, and it comes back before you forget it.');
    P.innerHTML=rsteps()+`<div class="row"><span>Why you missed it</span><span class="val">${why}</span></div><div class="row"><span>Repair reps</span><span class="val">${rv.hits} / ${REPS.length}</span></div><div class="row"><span>Ace Card due</span><span class="val">Tomorrow</span></div><p class="sub" style="margin-top:10px">Then 3, 7, 14 and 30 days. Get it right each time and it graduates.</p><button class="btn go" id="again">Do it again</button><div class="nav"><button class="btn ghost" id="toLearn">Back to Learn</button></div>`;
    document.getElementById('again').onclick=()=>{rv={step:0,why:null,rep:0,hits:0};review()};document.getElementById('toLearn').onclick=()=>mode('learn');return}
  const n=document.getElementById('n');if(n)n.onclick=()=>{if(rv.step===3&&rv.rep<REPS.length-1){rv.rep++}else{rv.step++}review()};
}

/* ---------- swipe + keys ---------- */
(()=>{let x0=null;cv.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
cv.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(location.hash==='#review'||sim.running)return;
  if(dx<-60&&sc<SCENES.length){sc++;learn()}else if(dx>60&&sc>0){sc--;learn()}},{passive:true});
document.addEventListener('keydown',e=>{if(location.hash==='#review'||e.target.tagName==='INPUT'||sim.running)return;if(e.key==='ArrowRight'&&sc<SCENES.length){sc++;learn()}if(e.key==='ArrowLeft'&&sc>0){sc--;learn()}})})();
/* ---------- modes ---------- */
function mode(m){document.getElementById('mLearn').setAttribute('aria-selected',m==='learn');document.getElementById('mReview').setAttribute('aria-selected',m==='review');document.getElementById('seg').style.setProperty('--i',m==='review'?1:0);
  if(location.hash!=='#'+m)history.replaceState(null,'','#'+m);m==='learn'?learn():review();window.scrollTo(0,0)}
document.getElementById('mLearn').onclick=()=>mode('learn');document.getElementById('mReview').onclick=()=>mode('review');
window.addEventListener('hashchange',()=>mode(location.hash==='#review'?'review':'learn'));
mode(location.hash==='#review'?'review':'learn');
</script>
