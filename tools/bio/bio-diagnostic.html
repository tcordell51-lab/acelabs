<script>
// 24-question Bio pulse check. Each item maps to a real registry node.
// Distribution across the six hubs (uneven by design — coverage breadth
// drives where to repair next, not score):
//   Cell:8 · Genetics:4 · Structure/Function:5 · Diversity:3 · Developmental:2 · Evolution:2
// Hub labels match Bio registry HUBS[].title casing.
const QUESTIONS = [
  // Cell & Molecular (8)
  { hub:'Cell & Molecular', node:'wat', q:'Hydrogen bonding gives water all the following properties EXCEPT:', opts:['high specific heat','high heat of vaporization','low surface tension','solid is less dense than liquid'], correct:2, why:'Water has unusually <i>high</i> surface tension (hydrogen bonds at the surface pull inward).' },
  { hub:'Cell & Molecular', node:'pro', q:'Tertiary structure of a protein is held primarily by:', opts:['peptide bonds','side-chain interactions, with the hydrophobic effect as the largest single driver','base pairing','phosphodiester bonds'], correct:1, why:'The single biggest driver of tertiary folding is the <b>hydrophobic effect</b> — nonpolar R-groups bury in the protein core to release ordered water back to bulk solvent, an <em>entropy</em>-driven process. H-bonds, salt bridges, disulfides, and van der Waals interactions then lock the conformation. Peptide bonds hold primary structure; backbone H-bonds hold secondary; phosphodiester bonds belong to nucleic acids, not proteins.' },
  { hub:'Cell & Molecular', node:'enz', q:'A non-competitive inhibitor binds:', opts:['the active site','the substrate','an allosteric site','the cofactor'], correct:2, why:'Non-competitive = allosteric. Vmax decreases, Km is unchanged.' },
  { hub:'Cell & Molecular', node:'mtr', q:'Facilitated diffusion differs from simple diffusion in that it:', opts:['requires ATP','requires a transport protein','moves against the gradient','only occurs in plants'], correct:1, why:'Both are passive (no ATP). Facilitated needs a channel/carrier; simple goes through the bilayer.' },
  { hub:'Cell & Molecular', node:'krb', q:'How many NADH are produced per glucose by the Krebs cycle (both turns)?', opts:['2','4','6','10'], correct:2, why:'3 NADH per turn × 2 turns = 6 NADH from Krebs proper. Plus 2 FADH₂ and 2 ATP/GTP per glucose. <b>Trap to catch — 10 is the most common wrong pick:</b> 10 is the TOTAL NADH per glucose if you include glycolysis (2) + pyruvate dehydrogenase (2) + Krebs (6). This question asks about Krebs only. Carbon budget check: 2 CO₂ from PDH + 4 CO₂ from Krebs = 6 CO₂, balancing glucose\'s 6 carbons.' },
  { hub:'Cell & Molecular', node:'rep', q:'Okazaki fragments are joined by:', opts:['DNA polymerase III','DNA polymerase I','primase','ligase'], correct:3, why:'Pol I removes RNA primers and fills the gap. Ligase seals the nick between fragments.' },
  { hub:'Cell & Molecular', node:'mit', q:'The cell cycle checkpoint that monitors DNA damage before replication is:', opts:['G2/M','M (spindle)','G1/S','S phase'], correct:2, why:'G1/S is the major p53 checkpoint — verifies size + DNA integrity before committing to replicate.' },
  { hub:'Cell & Molecular', node:'org', q:'A cell that secretes a lot of protein would have abundant:', opts:['smooth ER','rough ER','peroxisomes','lysosomes'], correct:1, why:'Rough ER (ribosome-studded) makes secreted/membrane proteins. Smooth ER does lipid synthesis.' },

  // Genetics (4)
  { hub:'Genetics', node:'prb', q:'Two heterozygotes (Aa x Aa) produce offspring. The phenotypic ratio is:', opts:['1:1','1:2:1','3:1','9:3:3:1'], correct:2, why:'Phenotypic 3:1 (3 dominant : 1 recessive). Genotypic is 1:2:1.' },
  { hub:'Genetics', node:'ped', q:'A father is colorblind (X^c Y), mother is a carrier (X^C X^c). What fraction of <b>daughters</b> are colorblind?', opts:['0','1/4','1/2','3/4'], correct:2, why:'Daughters get X^c from dad; half also get X^c from mom; so 1/2 colorblind, 1/2 carriers.' },
  { hub:'Genetics', node:'hwb', q:'In a population at Hardy-Weinberg equilibrium, the frequency of homozygous recessives is 0.16. What is the carrier frequency?', opts:['0.04','0.16','0.40','0.48'], correct:3, why:'q^2 = 0.16; q = 0.4, p = 0.6. Carriers = 2pq = 2(0.6)(0.4) = 0.48.' },
  { hub:'Genetics', node:'mut', q:'Which type of mutation almost always causes the most severe protein change?', opts:['silent','missense','frameshift','synonymous'], correct:2, why:'Frameshift (insertion/deletion not in multiples of 3) shifts the entire downstream reading frame.' },

  // Structure & Function (5)
  { hub:'Structure & Function', node:'ap',  q:'During the depolarization (rising) phase of a neuronal action potential, the dominant ionic event is:', opts:['Na+ influx through voltage-gated channels','K+ efflux through voltage-gated channels','Ca2+ influx into the axon hillock','Cl- influx hyperpolarizing the membrane'], correct:0, why:'At threshold (~−55 mV), voltage-gated Na+ channels open and Na+ rushes in, driving the membrane toward +30 mV. K+ channels open more slowly and only dominate during repolarization (the falling phase). Ca2+ matters at the synaptic terminal, not on the axon. Cl- shifts hyperpolarize rather than depolarize.' },
  { hub:'Structure & Function', node:'nph', q:'In the nephron, water is reabsorbed primarily in the:', opts:['Bowman capsule','proximal convoluted tubule','distal convoluted tubule','collecting duct (under ADH)'], correct:1, why:'~65% of water is reabsorbed in the PCT (passive, follows Na+). ADH fine-tunes the rest at the CD.' },
  { hub:'Structure & Function', node:'rsp', q:'Which curve shifts represent the Bohr effect?', opts:['Hb-O2 curve shifts <b>left</b> with high CO2','Hb-O2 curve shifts <b>right</b> with high CO2','Hb-O2 curve unchanged with CO2','CO2 has no effect on Hb-O2 binding'], correct:1, why:'High CO2 + low pH; right shift; Hb releases O2 more easily in metabolizing tissues.' },
  { hub:'Structure & Function', node:'end', q:'Insulin is secreted by the pancreas and acts to:', opts:['raise blood glucose','lower blood glucose by promoting cellular uptake','convert glycogen to glucose','stimulate gluconeogenesis'], correct:1, why:'Insulin = "anabolic, after a meal". Glucagon does the opposite (raises glucose).' },
  { hub:'Structure & Function', node:'ap', q:'Saltatory conduction is faster than continuous conduction <i>specifically</i> because:', opts:['the myelinated axon is larger in diameter','myelin opens additional Na+ channels along the internodes','the action potential regenerates only at nodes of Ranvier, effectively jumping between them','myelin keeps the membrane at threshold continuously'], correct:2, why:'Myelin electrically insulates the internodal segments — Na+ channels are concentrated AT the nodes. The depolarization spreads passively (and quickly) under the myelin, then triggers a fresh AP at the next node. Net effect: the AP "jumps" node to node instead of regenerating at every micron of membrane. (Larger axon diameter does speed conduction, but that is a general factor — not what saltatory conduction itself contributes.)' },

  // Diversity of Life (3)
  { hub:'Diversity of Life', node:'dom', q:'Which is NOT shared by all three domains of life?', opts:['DNA','ribosomes','membrane-bound nucleus','plasma membrane'], correct:2, why:'Only Eukarya has a membrane-bound nucleus. Bacteria and Archaea are prokaryotic.' },
  { hub:'Diversity of Life', node:'dom', q:'Fungi are most closely related to:', opts:['plants','animals','protists','bacteria'], correct:1, why:'Fungi and animals are sister groups (both Opisthokonta).' },
  { hub:'Diversity of Life', node:'dom', q:'A bacterium with a thin cell wall and an outer membrane is:', opts:['Gram-positive','Gram-negative','an Archaean','a virus'], correct:1, why:'Gram-negative = thin peptidoglycan + outer membrane. Gram-positive = thick peptidoglycan, no outer membrane.' },

  // Developmental (2)
  { hub:'Developmental', node:'fer', q:'The acrosome reaction during fertilization releases:', opts:['oxytocin','hydrolytic enzymes that digest the zona pellucida','progesterone','calcium into the egg'], correct:1, why:'Acrosome contains hydrolases; release lets sperm penetrate the zona. Cortical reaction (different) prevents polyspermy.' },
  { hub:'Developmental', node:'gas', q:'Which germ layer gives rise to the epithelial lining of the small intestine?', opts:['Ectoderm','Mesoderm','Endoderm','Neural crest'], correct:2, why:'Endoderm forms the innermost epithelial lining of the GI and respiratory tracts. Mesoderm makes the smooth muscle wall around that lining. Ectoderm gives skin and nervous system. The classic trap is conflating "gut" with mesoderm — anchor on lining (endoderm) vs. wall (mesoderm).' },

  // Evolution & Ecology (2)
  { hub:'Evolution & Ecology', node:'nse', q:'Genetic drift has the strongest effect on:', opts:['large populations','small populations','populations with high migration','populations with strong selection'], correct:1, why:'Drift = random allele frequency change. Smaller N; larger random fluctuations.' },
  { hub:'Evolution & Ecology', node:'nse', q:'Two species that look similar because they live in similar environments — but evolved independently — are an example of:', opts:['divergent evolution','convergent evolution','coevolution','allopatric speciation'], correct:1, why:'Convergent evolution: similar selection pressures; analogous traits in unrelated lineages.' },

  // Structure & Function — cardiac AP (added 2026-05-28 alongside the new
  // cardiac-AP subsection at bio-physiology.html#cardiac-ap).
  { hub:'Structure & Function', node:'cdv', q:'The plateau phase of a ventricular cardiac action potential is sustained primarily by:', opts:['Na⁺ influx through fast voltage-gated channels','Ca²⁺ influx through slow L-type channels, balanced by K⁺ efflux','K⁺ efflux alone, with all other channels closed','Cl⁻ influx and Na⁺/K⁺ ATPase activity'], correct:1, why:'Phase 2 (plateau) holds the membrane near 0 mV for ~150–300 ms because slow L-type Ca²⁺ channels admit Ca²⁺ at a rate that nearly matches K⁺ efflux. This is unique to cardiac myocytes — the neuronal AP has no plateau. Functionally, the plateau extends the absolute refractory period through most of the contraction, preventing tetanus and allowing complete ventricular ejection. See the cardiac-AP coach notes under the cardiovascular hub.' }
];

function hubCoverageSummary(){
  const counts = {};
  QUESTIONS.forEach(q => { counts[q.hub] = (counts[q.hub] || 0) + 1; });
  return Object.entries(counts).map(([h,n]) => `${h}: ${n}`).join(' &middot; ');
}

const STORE_KEY = 'acethedat_bio_diagnostic_runs';
// Local pulse-check state — must not shadow the bio-shared STATE global, hence the rename.
const DG_STATE = { i:0, answers:{}, started:null, finished:false };

function loadRuns(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e){ return []; } }
function saveRun(record){
  try {
    const runs = loadRuns();
    runs.push(record);
    localStorage.setItem(STORE_KEY, JSON.stringify(runs.slice(-20)));
  } catch(e){}
}

function renderIntro(){
  const runs = loadRuns();
  const last = runs.length ? runs[runs.length-1] : null;
  document.getElementById('dgStage').innerHTML = `
    <div class="dg-intro">
      <h2>The 24-question <em>pulse check</em>.</h2>
      <p class="lede">A short pulse check across the six Ace study hubs. Untimed; should take ~20 minutes. Aimed at <b>where to start repairing</b>, not at predicting your DAT score.</p>
      <div class="dg-scope">
        <b>Coverage breakdown:</b> ${hubCoverageSummary()}. The pulse check is <em>not</em> evenly weighted &mdash; coverage breadth, not symmetry, is what tells you where to repair next.
      </div>
      <ul>
        <li>Pick the best answer; you can change it before the next question.</li>
        <li>You'll get a per-hub breakdown at the end with weak nodes flagged + repair links.</li>
        <li>Misses save to your Ace Cards automatically.</li>
        <li>Results save to this device only &mdash; retake any time.</li>
      </ul>
      <button class="btn primary lg" id="dgStart" type="button">Begin pulse check</button>
      ${last ? `
        <div style="margin-top:18px;padding:14px 16px;background:var(--paper-2);border-radius:9px;font-size:13px;color:var(--ink-2);line-height:1.5">
          <b>Last attempt:</b> ${last.score}/${QUESTIONS.length} on ${new Date(last.ts).toLocaleDateString()}.
          <button class="btn ghost sm" id="dgViewLast" style="margin-left:10px" type="button">View last results</button>
        </div>
      ` : ''}
    </div>
  `;
  document.getElementById('dgStart').addEventListener('click', start);
  if (last) document.getElementById('dgViewLast').addEventListener('click', () => renderResults(last, last.wrong || []));
}

function start(){
  DG_STATE.i = 0; DG_STATE.answers = {}; DG_STATE.started = Date.now(); DG_STATE.finished = false;
  renderQuestion();
}

function renderQuestion(){
  const Q = QUESTIONS[DG_STATE.i];
  const total = QUESTIONS.length;
  const sel = DG_STATE.answers[DG_STATE.i];
  document.getElementById('dgStage').innerHTML = `
    <div class="dg-runtop">
      <span>Q ${DG_STATE.i+1} / ${total}</span>
      <div class="dg-progress"><div class="dg-progress-fill" style="width:${(DG_STATE.i)*100/total}%"></div></div>
      <span>${Q.hub}</span>
    </div>
    <div class="dg-runbody">
      <div class="dg-tag">${Q.hub}</div>
      <div class="dg-q">${Q.q}</div>
      <div class="dg-opts">
        ${Q.opts.map((o,i) => `<div class="dg-opt ${sel===i?'selected':''}" data-i="${i}"><span class="let">${'ABCD'[i]}</span><span>${o}</span></div>`).join('')}
      </div>
      <div class="dg-foot">
        <button class="btn ghost" id="dgPrev" ${DG_STATE.i === 0 ? 'disabled' : ''}>&larr; Back</button>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute)">${Object.keys(DG_STATE.answers).length} answered</span>
        <button class="btn primary" id="dgNext">${DG_STATE.i === total-1 ? 'Finish &rarr;' : 'Next &rarr;'}</button>
      </div>
    </div>
  `;
  document.querySelectorAll('.dg-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      DG_STATE.answers[DG_STATE.i] = parseInt(opt.dataset.i);
      document.querySelectorAll('.dg-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    });
  });
  document.getElementById('dgPrev').addEventListener('click', () => { if (DG_STATE.i > 0){ DG_STATE.i--; renderQuestion(); } });
  document.getElementById('dgNext').addEventListener('click', () => {
    if (DG_STATE.i === total-1){ finish(); }
    else { DG_STATE.i++; renderQuestion(); }
  });
}

function hubKey(hubName){
  const R = window.BIO_REGISTRY;
  if (!R) return 'cell';
  const direct = R.HUBS.find(h => h.title.toLowerCase() === hubName.toLowerCase());
  if (direct) return direct.subjectKey;
  return 'cell';
}

function finish(){
  DG_STATE.finished = true;
  let score = 0;
  const byHub = {};
  const wrong = [];
  QUESTIONS.forEach((q, i) => {
    if (!byHub[q.hub]) byHub[q.hub] = { correct:0, total:0 };
    byHub[q.hub].total++;
    if (DG_STATE.answers[i] === q.correct){ byHub[q.hub].correct++; score++; }
    else { wrong.push({ q:q.q, hub:q.hub, node:q.node, correct:q.correct, picked:DG_STATE.answers[i], opts:q.opts, why:q.why }); }
  });
  const record = { score, total:QUESTIONS.length, byHub, wrong, ts:Date.now(), durationSec: Math.round((Date.now()-DG_STATE.started)/1000) };
  saveRun(record);
  pushBioMisses(record);
  renderResults(record, wrong);
}

function pushBioMisses(record){
  if (typeof addBioMissCard !== 'function') return;
  const R = window.BIO_REGISTRY;
  (record.wrong || []).forEach(w => {
    const subject = hubKey(w.hub);
    const node = R && w.node ? R.resolve(w.node, subject) : null;
    addBioMissCard({
      prompt: w.q,
      answer: w.opts[w.correct],
      summary: w.why,
      detail: 'You picked: ' + (w.picked != null ? w.opts[w.picked] : 'no answer') + '. Repair the underlying concept in the linked node, then retest in your primary resource.',
      subject: subject,
      nodeId: node ? node.id : (w.node || ''),
      nodeTitle: node ? node.title : '',
      route: node && R ? R.repairLink(node) : '',
      originLabel: 'Pulse check miss'
    });
  });
}

function repairLinkFor(item){
  const R = window.BIO_REGISTRY;
  if (!R || !item.node) return null;
  const node = R.resolve(item.node, hubKey(item.hub));
  return node ? { url: R.repairLink(node), label: node.title } : null;
}

function renderResults(record, wrong){
  wrong = wrong || record.wrong || [];
  const pct = Math.round(100 * record.score / record.total);
  const hubRows = Object.entries(record.byHub).map(([hub, r]) => {
    const p = Math.round(100 * r.correct / r.total);
    const cls = p >= 75 ? 'strong' : p < 50 ? 'weak' : '';
    return `<tr><td>${hub}</td><td>${r.correct}/${r.total}</td><td class="${cls}">${p}%</td></tr>`;
  }).join('');
  document.getElementById('dgStage').innerHTML = `
    <div class="dg-result">
      <h2>Pulse check <em>complete</em>.</h2>
      <div style="margin:0 0 16px;font-size:13px;color:var(--ink-2)">
        Practice signal from the covered questions only. Not a DAT score prediction.
      </div>
      <div class="dg-scores">
        <div class="dg-scorecard"><div class="lbl">Raw</div><div class="num"><em>${record.score}</em>/${record.total}</div></div>
        <div class="dg-scorecard"><div class="lbl">Covered-section signal</div><div class="num">${pct}%</div></div>
        <div class="dg-scorecard gold"><div class="lbl">Time</div><div class="num">${Math.floor(record.durationSec/60)}m</div></div>
      </div>
      <h3 style="font-family:'Playfair Display',serif;font-size:20px;margin:18px 0 6px;font-weight:700">Per-hub <em>breakdown</em></h3>
      <table class="dg-hubtable">
        <thead><tr><th>Hub</th><th>Hit</th><th>%</th></tr></thead>
        <tbody>${hubRows}</tbody>
      </table>
      ${wrong && wrong.length > 0 ? `
        <div class="dg-review">
          <h3>Repair these <em>nodes</em> (${wrong.length})</h3>
          ${wrong.map(w => {
            const yourLetter = w.picked !== undefined && w.picked !== null ? 'ABCD'[w.picked] : '—';
            const link = repairLinkFor(w);
            return `<div class="dg-review-item">
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--gold-d);font-weight:700;text-transform:uppercase;margin-bottom:6px">${w.hub}</div>
              <b>${w.q}</b>
              <div class="why">You picked <em>${yourLetter}</em>. Correct: <b>${'ABCD'[w.correct]}.</b> ${w.opts[w.correct]} &middot; ${w.why}</div>
              ${link ? `<a class="repair-link" href="${link.url}">Repair: ${link.label} &rarr;</a>` : ''}
            </div>`;
          }).join('')}
        </div>
      ` : '<p style="margin-top:20px;font-size:14px;color:var(--good-d);font-weight:600">Clean run on the pulse check. Move on to the weakness scan to test under a heavier load.</p>'}
      <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">
        <button class="btn primary lg" id="dgRetake">Retake</button>
        <a class="btn lg" href="bio-mock.html">Run weakness scan &rarr;</a>
        <a class="btn ghost lg" href="bio-analytics.html">See analytics</a>
      </div>
    </div>
  `;
  document.getElementById('dgRetake').addEventListener('click', start);
}

renderIntro();
</script>
<script src="/tools/bio/bio-registry.js"></script>
<script src="/tools/bio/bio-shared.js"></script>
</body>
</html>
