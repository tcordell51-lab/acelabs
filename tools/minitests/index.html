<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Climb — Ace Labs Mini Tests</title>
<meta name="description" content="Ten DAT mini tests that climb in difficulty, sciences + QR, timed. Every miss lands on a master mistake list and routes to the exact trick, night, and drill that fixes it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1310; --bg2:#0a0f0d; --panel:#12180f; --panel2:#111a15; --raise:#17201a;
    --line:rgba(201,168,76,.18); --line2:rgba(201,168,76,.34);
    --ink:#efe9db; --ink2:#b9b1a0; --ink3:#8a8375;
    --gold:#C9A84C; --goldhi:#E6D08A; --gold-bg:rgba(201,168,76,.10);
    --bio:#57b487; --gchem:#5b8fd6; --ochem:#9b7bd0; --qr:#d98aa8;
    --ok:#57b487; --bad:#d98a7e; --warn:#d8a24a;
    --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1000px 560px at 85% -10%,rgba(201,168,76,.07),transparent 60%),var(--bg);
    color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.01em}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px 90px}
  .top{display:flex;align-items:center;gap:16px;padding:20px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-family:var(--serif);font-size:20px;font-weight:800}
  .brand em{font-style:italic;color:var(--gold)}
  .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-left:2px}
  .top .sp{flex:1}
  .streak{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:6px 13px}
  .streak b{color:var(--gold);font-weight:700}
  .navlink{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-decoration:none;padding:7px 12px;border-radius:8px;cursor:pointer;position:relative}
  .navlink:hover{background:var(--gold-bg);color:var(--ink)}
  .navlink.on{background:var(--ink);color:var(--bg)}
  .navlink .ct{font-size:10px;color:var(--bad);font-weight:700;margin-left:5px}

  .hero{padding:38px 0 10px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  h1.big{font-size:clamp(34px,6.5vw,54px);line-height:1.03;margin:12px 0 0}
  h1.big em{font-style:italic;color:var(--gold)}
  .lede{color:var(--ink2);font-size:17px;max-width:66ch;margin:16px 0 0}
  .lede b{color:var(--ink)}

  /* mistake banner (ladder) */
  .mbanner{margin-top:26px;background:linear-gradient(160deg,rgba(217,138,126,.12),#101813 70%);border:1px solid rgba(217,138,126,.4);border-radius:16px;padding:18px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .mbanner .t{font-family:var(--serif);font-size:20px}
  .mbanner .t b{color:var(--bad)}
  .mbanner p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
  .mbanner .sp{flex:1}

  .daily{margin-top:14px;background:linear-gradient(160deg,#17140c,#101813);border:1px solid var(--line2);border-radius:16px;padding:16px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .daily .t{font-family:var(--serif);font-size:18px}
  .daily p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
  .daily .sp{flex:1}

  .ladder{display:grid;gap:12px;margin-top:26px}
  .rung{display:grid;grid-template-columns:66px 1fr auto;gap:18px;align-items:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:16px;padding:16px 20px;cursor:pointer;transition:transform .14s,border-color .14s,background .14s;text-decoration:none;color:inherit}
  .rung:hover{transform:translateY(-2px);border-color:var(--gold);background:var(--raise)}
  .rung .tier{font-family:var(--serif);font-size:30px;font-weight:800;color:var(--gold);text-align:center;line-height:1}
  .rung .tier small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink3);margin-top:3px}
  .rung h3{font-size:20px}
  .rung .meta{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:4px;letter-spacing:.03em}
  .rung .right{text-align:right;min-width:96px}
  .badge{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:99px;display:inline-block}
  .badge.new{color:var(--gold);border:1px solid var(--line2)}
  .badge.pass{color:var(--bg);background:var(--ok)}
  .badge.try{color:var(--warn);border:1px solid rgba(216,162,74,.4)}
  .rung .best{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink)}
  .rung .best span{font-size:13px;color:var(--ink3)}
  .pbar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:9px}
  .pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--goldhi))}
  .subrow{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px;color:var(--ink2)}
  .chip.bio{background:rgba(87,180,135,.14);color:var(--bio)} .chip.gchem{background:rgba(91,143,214,.14);color:var(--gchem)}
  .chip.ochem{background:rgba(155,123,208,.14);color:var(--ochem)} .chip.qr{background:rgba(217,138,168,.14);color:var(--qr)}

  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:11px 18px;transition:background .14s,border-color .14s}
  button:hover{background:var(--raise)}
  button.gold{background:linear-gradient(180deg,var(--goldhi),var(--gold));color:#1a1206;border:none;font-weight:700;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
  button.gold:hover{filter:brightness(1.05)}
  button.bad{background:linear-gradient(180deg,#e6b0a6,var(--bad));color:#2a1410;border:none;font-weight:700;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
  button:disabled{opacity:.4;cursor:default}
  button.ghost{background:transparent}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* test player */
  .thead{display:flex;align-items:center;gap:14px;padding:18px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .thead h2{font-size:22px}
  .thead .sp{flex:1}
  .timer{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
  .timer.warn{color:var(--bad)}
  .tgrid{display:grid;grid-template-columns:1fr 200px;gap:24px;margin-top:22px;align-items:start}
  @media(max-width:820px){.tgrid{grid-template-columns:1fr}}
  .qcard{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:26px 28px;min-height:340px}
  .qtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;display:inline-block;padding:4px 10px;border-radius:6px;margin-bottom:14px}
  .qtag.bio{background:rgba(87,180,135,.16);color:var(--bio)} .qtag.gchem{background:rgba(91,143,214,.16);color:var(--gchem)}
  .qtag.ochem{background:rgba(155,123,208,.16);color:var(--ochem)} .qtag.qr{background:rgba(217,138,168,.16);color:var(--qr)}
  .qnum{font-family:var(--mono);font-size:11px;color:var(--ink3);float:right}
  .stem{font-size:18px;line-height:1.5;margin:0 0 6px;color:var(--ink)}
  .fig{margin:14px 0;text-align:center}.fig svg{max-width:100%;max-height:260px}
  .choices{display:grid;gap:9px;margin-top:18px}
  .choice{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;transition:all .12s;width:100%;color:var(--ink);font-size:15.5px}
  .choice:hover{border-color:var(--line2);background:var(--raise)}
  .choice.sel{border-color:var(--gold);background:var(--gold-bg)}
  .choice .ltr{font-family:var(--mono);font-weight:700;color:var(--gold);flex:0 0 16px}
  .choice.correct{border-color:var(--ok);background:rgba(87,180,135,.12)}
  .choice.wrong{border-color:var(--bad);background:rgba(217,138,126,.12)}
  .choice.correct .ltr{color:var(--ok)} .choice.wrong .ltr{color:var(--bad)}
  .side{position:sticky;top:14px}
  .navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .navgrid button{padding:0;height:34px;border-radius:8px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--panel)}
  .navgrid button.answered{background:var(--gold-bg);border-color:var(--line2);color:var(--gold)}
  .navgrid button.cur{outline:2px solid var(--gold);outline-offset:1px}
  .navgrid button.marked{border-color:var(--warn);color:var(--warn)}
  .sidebtns{display:grid;gap:8px;margin-top:14px}
  .tfoot{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
  .tfoot .sp{flex:1}

  /* results */
  .rwrap{max-width:760px;margin:0 auto;padding-top:20px;text-align:center}
  .score-big{font-family:var(--serif);font-size:76px;font-weight:800;line-height:1;color:var(--gold);margin:10px 0 0}
  .score-big small{font-size:26px;color:var(--ink3)}
  .verdict-pill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 16px;border-radius:99px;margin-top:16px}
  .verdict-pill.pass{background:var(--ok);color:var(--bg)} .verdict-pill.miss{background:rgba(216,162,74,.16);color:var(--warn);border:1px solid rgba(216,162,74,.4)}
  .sectbars{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:30px 0 0;text-align:left}
  @media(max-width:560px){.sectbars{grid-template-columns:1fr}}
  .sb{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:15px 17px}
  .sb .lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
  .sb .n{font-family:var(--serif);font-size:22px;font-weight:700;margin-top:4px}
  .sb .track{height:6px;border-radius:3px;background:rgba(255,255,255,.06);margin-top:8px;overflow:hidden}.sb .track > i{display:block;height:100%}
  .rbtns{display:flex;gap:12px;justify-content:center;margin-top:32px;flex-wrap:wrap}

  /* review + mistakes */
  h2.view{font-size:28px;margin-top:26px}
  .rev{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:14px}
  .rev.correct{border-left:3px solid var(--ok)} .rev.wrong{border-left:3px solid var(--bad)}
  .rev .rt{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
  .rev .st{font-size:16px;color:var(--ink);margin-bottom:10px}
  .rev .ans{font-size:13.5px;margin:4px 0}
  .rev .ans b.ok{color:var(--ok)} .rev .ans b.no{color:var(--bad)}
  .rev .exp{font-size:13.5px;color:var(--ink2);margin-top:10px;line-height:1.55;border-top:1px solid var(--line);padding-top:10px}
  .fixrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .fixrow .fx{font-family:var(--mono);font-size:11px;letter-spacing:.03em;text-decoration:none;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink)}
  .fixrow .fx:hover{background:var(--gold-bg)}
  .fixrow .fx.trick{border-color:rgba(201,168,76,.6);color:var(--goldhi);background:var(--gold-bg)}
  .fixrow .fx.learn{color:var(--gold)} .fixrow .fx.drill{color:var(--ink2)}
  .trick-embed{margin-top:12px;display:none}
  .trick-embed.on{display:block}
  .trick-embed iframe{width:100%;max-width:400px;height:720px;border:1px solid var(--line2);border-radius:16px;background:#000;display:block}

  .weak{display:grid;gap:10px;margin-top:14px}
  .wk{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px 18px}
  .wk .rk{font-family:var(--mono);font-size:12px;color:var(--ink3);width:20px;text-align:right}
  .wk .tp{font-size:15px;color:var(--ink)}
  .wk .tp small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:2px}
  .wk .rate{font-family:var(--serif);font-size:20px;font-weight:700;text-align:right;min-width:64px}
  .wk .rate small{font-size:11px;color:var(--ink3)}
  .wkfix{grid-column:1 / -1;margin-top:2px}
  .section-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:26px 0 4px}
  .empty{color:var(--ink3);font-size:14px;text-align:center;padding:44px 0}
  .empty b{color:var(--ink)}
  .back{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--gold);cursor:pointer;text-decoration:none;display:inline-block;margin-top:22px}
  .mhead{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-top:6px}
  .mhead .big-n{font-family:var(--serif);font-size:52px;font-weight:800;color:var(--bad);line-height:.9}
  .mhead .big-n.zero{color:var(--ok)}
  .mhead .msub{font-size:14px;color:var(--ink2)}
  .mhead .sp{flex:1}

  /* Phase 1: Today (Daily Check) + the Check player + the Test Check */
  .today-hero{padding:34px 0 6px}
  .tq-head{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
  .tqn{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 20px;min-width:112px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
  .tqn b{font-family:var(--serif);font-size:38px;font-weight:800;color:var(--gold);display:block;line-height:1;margin-bottom:5px}
  .tqn.new b{color:var(--ink)}
  .why-line{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:15.5px;margin:20px 0 0;border-left:2px solid var(--gold);padding-left:14px;max-width:62ch}
  .today-state{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 2px}
  .tstate{font-family:var(--mono);font-size:11px;letter-spacing:.04em;border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--ink2)}
  .tstate b{color:var(--ink)} .tstate.good b{color:var(--ok)} .tstate.gold b{color:var(--gold)}
  .today-cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}

  .check-wrap{max-width:760px;margin:0 auto}
  .cprog{display:flex;align-items:center;gap:12px;padding:18px 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase}
  .cprog .bar{flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .cprog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--goldhi));transition:width .3s}
  .cprog .kind{color:var(--gold)}
  .cbtnrow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
  .cq-ans{font-size:13.5px;margin:12px 0 0;color:var(--ink2)}
  .cq-ans b.ok{color:var(--ok)} .cq-ans b.no{color:var(--bad)}

  .diag{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .diag h4{font-family:var(--serif);font-size:18px;margin:0 0 11px}
  .diag .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px}
  .diagbtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  @media(max-width:520px){.diagbtns{grid-template-columns:1fr}}
  .dbtn{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 15px;color:var(--ink);font-size:14.5px;font-family:var(--sans);transition:all .12s}
  .dbtn:hover{border-color:var(--line2);background:var(--raise)}
  .dbtn small{display:block;font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:4px;letter-spacing:.02em}
  .dbtn.sel{border-color:var(--gold);background:var(--gold-bg);color:var(--ink)}
  .confbtns{display:flex;gap:9px}
  .confbtns .dbtn{flex:1;text-align:center}
  .correct-note{margin-top:16px;border-left:3px solid var(--ok);background:rgba(87,180,135,.08);border-radius:0 10px 10px 0;padding:14px 18px;font-size:14px;color:var(--ink2);line-height:1.55}
  .correct-note b{color:var(--ok)}
  .fixpanel{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .fixpanel .fx-lead{font-family:var(--serif);font-size:17px;margin:0 0 8px;color:var(--ink)}
  .lock-note{margin-top:16px;border-radius:0 10px 10px 0;padding:14px 18px;font-size:14px;color:var(--ink2);line-height:1.55}
  .lock-note.ok{border-left:3px solid var(--ok);background:rgba(87,180,135,.08)} .lock-note.ok b{color:var(--ok)}
  .lock-note.stay{border-left:3px solid var(--warn);background:rgba(216,162,74,.08)} .lock-note.stay b{color:var(--warn)}
  .check-done{max-width:640px;margin:0 auto;text-align:center;padding-top:34px}
  .check-done .score-big{font-size:60px}
  .cd-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .cd-stats{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:24px 0 0}
  .cd-stats .s{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
  .cd-stats .s b{display:block;font-family:var(--serif);font-size:30px;color:var(--ink);margin-bottom:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><span class="brand">Ace<em>The</em>DAT</span> <span class="kick">The Climb</span></div>
    <div class="sp"></div>
    <span class="streak" id="streak">STREAK <b>0</b></span>
    <a class="navlink on" id="nav-today" onclick="go('today')">Today<span class="ct" id="navDueCt"></span></a>
    <a class="navlink" id="nav-ladder" onclick="go('ladder')">The Ladder</a>
    <a class="navlink" id="nav-mistakes" onclick="go('mistakes')">Mistake List<span class="ct" id="navMistCt"></span></a>
  </div>
  <div id="app"></div>
</div>

<script src="remediation-map.js"></script>
<script src="bank.js"></script>
<script>
/* ============================================================ data ============================================================ */
var BANK = window.MINITEST_BANK || {tests:[]};
var REM  = window.MINITEST_REMEDIATION || {};
var TK   = window.MINITEST_TRICKS || {series:{}, seriesBase:''};
var BK   = window.MINITEST_BLACK || {base:'/tricks/videos/', map:{}};
var LETTERS = ['A','B','C','D','E'];
var SECT = {bio:'Biology', gchem:'General Chemistry', ochem:'Organic Chemistry', qr:'Quantitative Reasoning'};
var RUNG_NAME = ['Foothills','First Ascent','The Ridge','The Steep Face','High Camp','The Traverse','The Ice Wall','The Cornice','The Death Zone','The Summit'];
var PASS = 0.75;
var LS = 'atDAT_minitest';
function load(){ try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}} }
function save(){ try{localStorage.setItem(LS, JSON.stringify(store))}catch(e){} }
var store = load();
store.best     = store.best     || {};
store.attempts = store.attempts || [];
store.mistakes = store.mistakes || {};   // key -> {section,topic,tier,q,wrong,lapses,reps,streak,box,due,diag,conf,resolved,ts}
store.streak   = store.streak   || 0;
store.lastDay  = store.lastDay  || null;
store.reviews  = store.reviews  || [];   // FSRS-schema review log, written on every answer (can't be retrofitted)
store.seen     = store.seen     || {};   // qkey -> ts of NEW items answered right (known, not re-served)

/* stable per-question key (content-based, survives across sessions/tiers) */
function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function qkey(q){ return q.section+'|'+q.topic+'|'+hash(q.stem); }
function trickUrl(section, topic){
  var b = BK.map && BK.map[section] && BK.map[section][topic];   // prefer the black bespoke video
  if(b) return BK.base + b + '.html';
  var m = TK.series && TK.series[section]; var k = m && m[topic];
  return k ? (TK.seriesBase + k) : null;
}
function openMistakes(){ return Object.keys(store.mistakes).filter(function(k){return !store.mistakes[k].resolved;}); }
var DAY=86400000, INTERVAL=[0, DAY, 3*DAY, 7*DAY];   // spaced-review intervals by box level
function dueMistakes(){ var now=Date.now(); return Object.keys(store.mistakes).filter(function(k){var m=store.mistakes[k];return !m.resolved && (m.due||0)<=now;}); }
function scheduledMistakes(){ var now=Date.now(); return Object.keys(store.mistakes).filter(function(k){var m=store.mistakes[k];return !m.resolved && (m.due||0)>now;}); }

/* streak: bump on a completed session on a new day */
function bumpStreak(nowISO){
  var t = nowISO.slice(0,10);
  if(store.lastDay === t) return;
  if(store.lastDay){ var days=Math.round((new Date(t)-new Date(store.lastDay))/86400000); store.streak = days===1 ? store.streak+1 : 1; }
  else store.streak = 1;
  store.lastDay = t;
}
function renderStreak(){
  document.getElementById('streak').innerHTML = 'STREAK <b>'+(store.streak||0)+'</b>';
  var n = openMistakes().length;
  document.getElementById('navMistCt').textContent = n ? ('· '+n) : '';
  var d = dueMistakes().length + maintenanceDue().length, dc = document.getElementById('navDueCt');
  if(dc){ dc.textContent = d ? ('· '+d) : ''; dc.style.color = 'var(--gold)'; }
}

/* ============================================================ router ============================================================ */
var T = {};
function go(view, arg){
  document.getElementById('nav-today').classList.toggle('on', view==='today'||view==='check');
  document.getElementById('nav-ladder').classList.toggle('on', view==='ladder');
  document.getElementById('nav-mistakes').classList.toggle('on', view==='mistakes');
  if(T.ticker){ clearInterval(T.ticker); T.ticker=null; }
  window.scrollTo(0,0);
  if(view==='today') return renderToday();
  if(view==='check') return renderCheck();
  if(view==='ladder') return renderLadder();
  if(view==='test') return startTest(arg);
  if(view==='results') return renderResults();
  if(view==='review') return renderReview();
  if(view==='mistakes') return renderMistakes();
  if(view==='retry') return startRetry(arg);
}

/* ============================================================ ladder ============================================================ */
function testByN(n){ return BANK.tests.find(function(t){return t.n===n}); }
function tierLabel(t){ return t<=2?'foundational':t<=4?'standard':t<=6?'multi-step':t<=8?'integrated':'brutal'; }
function renderLadder(){
  var rows = '';
  for(var n=1;n<=10;n++){
    var t = testByN(n), name = RUNG_NAME[n-1], best = store.best[n], has = !!t;

                           : (has ? '<span class="badge new">Open</span>' : '<span class="badge new" style="opacity:.5">Soon</span>');
    var right = best!=null ? '<div class="best">'+best+'<span>%</span></div>' : '';
    rows += '<a class="rung" '+(has?('onclick="go(\'test\','+n+')"'):'style="opacity:.5;cursor:default"')+'>'+
      '<div class="tier">'+n+'<small>TIER</small></div>'+
      '<div><h3>'+name+'</h3><div class="meta">40 questions'+(t?'':' · coming soon')+' · '+tierLabel(n)+'</div>'+
        '<div class="subrow"><span class="chip bio">Bio</span><span class="chip gchem">Gen Chem</span><span class="chip ochem">Orgo</span><span class="chip qr">QR</span></div>'+
        '<div class="pbar"><i style="width:'+(best!=null?best:0)+'%"></i></div></div>'+
      '<div class="right">'+badge+right+'</div></a>';
  }
  var doneCount = Object.keys(store.best).filter(function(k){return store.best[k]>=PASS*100}).length;
  var dueN = dueMistakes().length, openN = openMistakes().length;
  var mbanner = dueN ?
    '<div class="mbanner"><div><div class="t"><b>'+dueN+'</b> question'+(dueN===1?'':'s')+' due for review</div>'+
      '<p>Spaced review - master them now while they are due. Each hands you the trick, the night, and the drill that fixes it.</p></div>'+
      '<div class="sp"></div><button class="bad" onclick="go(\'mistakes\')">Review now</button></div>'
    : (openN ?
    '<div class="mbanner" style="border-color:var(--line2);background:linear-gradient(160deg,rgba(201,168,76,.08),#101813 70%)"><div><div class="t"><b style="color:var(--gold)">'+openN+'</b> scheduled on your mistake list</div>'+
      '<p>Nothing due this moment - they resurface on schedule. Peek the list any time.</p></div>'+
      '<div class="sp"></div><button class="ghost" onclick="go(\'mistakes\')">Open mistake list</button></div>' : '');
  document.getElementById('app').innerHTML =
    '<div class="hero"><div class="eyebrow">Sciences + QR · ten rungs · timed</div>'+
    '<h1 class="big">The <em>Climb</em>.</h1>'+
    '<p class="lede">Ten mini tests, 40 questions each across Biology, Gen Chem, Orgo and QR. Same topics every rung - the <b>difficulty climbs</b> to the summit. But the climb is not the point: <b>every miss lands on your mistake list</b> and routes to the exact fix. Clear '+(PASS*100)+'% to log a rung.</p>'+
    mbanner+
    '<div class="daily"><div><div class="t">Cleared '+doneCount+' of 10 rungs</div><p>Come back daily to keep your streak alive.</p></div><div class="sp"></div>'+
      '<button class="gold" onclick="dailyDrop()">Daily Drop · quick 5</button></div>'+
    '<div class="ladder">'+rows+'</div></div>';
}

/* ============================================================ test player ============================================================ */
function startTest(n){
  var t = testByN(n); if(!t) return renderLadder();
  var qs = t.questions.map(function(q){ return q; });
  var minutes = Math.max(6, Math.round((48 - (t.tier-1)*0.9) * (qs.length/40)));
  T = { mode:'test', n:n, tier:t.tier, qs:qs, cur:0, ans:new Array(qs.length).fill(-1), mark:new Array(qs.length).fill(false),
        secsLeft:minutes*60, ticker:null, submitted:false, title:'Tier '+t.tier+' · '+RUNG_NAME[n-1] };
  runPlayer();
}
function startRetry(scope){
  var keys = scope==='all' ? openMistakes() : dueMistakes();
  if(!keys.length) return renderMistakes();
  var qs = keys.map(function(k){ return store.mistakes[k].q; });
  for(var i=qs.length-1;i>0;i--){ var j=Math.floor((i*2654435761)%(i+1)); var tmp=qs[i];qs[i]=qs[j];qs[j]=tmp; }
  T = { mode:'retry', n:0, tier:0, qs:qs, cur:0, ans:new Array(qs.length).fill(-1), mark:new Array(qs.length).fill(false),
        secsLeft:qs.length*70, ticker:null, submitted:false, title:(scope==='all'?'Retry all mistakes':'Retry due mistakes') };
  runPlayer();
}
function dailyDrop(){
  var all=[]; BANK.tests.forEach(function(t){ t.questions.forEach(function(q){ all.push(q); }); });
  if(!all.length) return;
  for(var i=all.length-1;i>0;i--){ var j=Math.floor((i*40503)%(i+1)); var tmp=all[i];all[i]=all[j];all[j]=tmp; }
  var qs=all.slice(0,Math.min(5,all.length));
  T = { mode:'daily', n:0, tier:0, qs:qs, cur:0, ans:new Array(qs.length).fill(-1), mark:new Array(qs.length).fill(false),
        secsLeft:qs.length*60, ticker:null, submitted:false, title:'Daily Drop' };
  runPlayer();
}
function runPlayer(){
  renderTest();
  T.ticker = setInterval(function(){ T.secsLeft--; paintTimer(); if(T.secsLeft<=0){ clearInterval(T.ticker); submitTest(); } }, 1000);
}
function fmt(s){ var m=Math.floor(s/60), sec=s%60; return m+':'+(sec<10?'0':'')+sec; }
function paintTimer(){ var el=document.getElementById('timer'); if(!el)return; el.textContent=fmt(T.secsLeft); el.classList.toggle('warn', T.secsLeft<=60); }
function renderTest(){
  var q=T.qs[T.cur], grid='';
  for(var i=0;i<T.qs.length;i++) grid += '<button class="'+(T.ans[i]>-1?'answered ':'')+(T.mark[i]?'marked ':'')+(i===T.cur?'cur':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  var choices = q.choices.map(function(c,i){ return '<button class="choice'+(T.ans[T.cur]===i?' sel':'')+'" onclick="pick('+i+')"><span class="ltr">'+LETTERS[i]+'</span><span>'+c+'</span></button>'; }).join('');
  var answered = T.ans.filter(function(a){return a>-1}).length;
  document.getElementById('app').innerHTML =
    '<div class="thead"><h2>'+T.title+'</h2><div class="sp"></div>'+
      '<span style="font-family:var(--mono);font-size:11px;color:var(--ink3)">'+answered+' / '+T.qs.length+' answered</span>'+
      '<span class="timer" id="timer">'+fmt(T.secsLeft)+'</span></div>'+
    '<div class="tgrid"><div class="qcard">'+
      '<span class="qnum">Question '+(T.cur+1)+' of '+T.qs.length+'</span>'+
      '<span class="qtag '+q.section+'">'+SECT[q.section]+' · '+q.topic+'</span>'+
      '<p class="stem">'+q.stem+'</p>'+(q.figureSvg?('<div class="fig">'+q.figureSvg+'</div>'):'')+
      '<div class="choices">'+choices+'</div>'+
      '<div class="tfoot"><button class="ghost" onclick="nav(-1)" '+(T.cur===0?'disabled':'')+'>Previous</button>'+
        '<button class="'+(T.mark[T.cur]?'gold':'ghost')+'" onclick="toggleMark()">'+(T.mark[T.cur]?'Marked':'Mark for review')+'</button>'+
        '<div class="sp"></div><button class="ghost" onclick="nav(1)" '+(T.cur===T.qs.length-1?'disabled':'')+'>Next</button></div>'+
    '</div><div class="side"><div class="navgrid">'+grid+'</div>'+
      '<div class="sidebtns"><button class="gold" onclick="confirmSubmit()">Submit</button>'+
      '<button class="ghost" onclick="quitTest()">Leave</button></div></div></div>';
  paintTimer();
}
function pick(i){ T.ans[T.cur]=i; renderTest(); }
function jump(i){ T.cur=i; renderTest(); }
function nav(d){ T.cur=Math.min(T.qs.length-1,Math.max(0,T.cur+d)); renderTest(); }
function toggleMark(){ T.mark[T.cur]=!T.mark[T.cur]; renderTest(); }
function quitTest(){ if(confirm('Leave? Progress on this attempt is not saved.')){ clearInterval(T.ticker); go(T.mode==='test'?'ladder':'mistakes'); } }
function confirmSubmit(){
  var un=T.ans.filter(function(a){return a<0}).length;
  if(un>0 && !confirm(un+' still blank. Submit anyway? (No penalty for wrong answers - a guess beats a blank.)')) return;
  submitTest();
}
function submitTest(){
  if(T.submitted) return; T.submitted=true; clearInterval(T.ticker);
  var correct=0, misses=[], sect={}, nowISO=new Date().toISOString();
  T.qs.forEach(function(q,i){
    sect[q.section]=sect[q.section]||{c:0,t:0}; sect[q.section].t++;
    var right = T.ans[i]===q.correct, key=qkey(q);
    if(right){
      correct++; sect[q.section].c++;
      var mr=store.mistakes[key];
      if(mr && !mr.resolved){ schedLearnCorrect(mr); }                    // advance toward mastery via SM-2
    } else {
      var m = store.mistakes[key]; var fresh=!m;
      if(fresh) m = { section:q.section, topic:q.topic, tier:(T.tier||1), q:q, wrong:0 };
      store.mistakes[key]=m;
      schedLapse(m);                                                      // wrong -> lapse (learning or maintenance)
      misses.push({section:q.section, topic:q.topic, qi:i, picked:T.ans[i]});
      emitMiss(q, i, T.ans[i]);
    }
  });
  var pct=Math.round(100*correct/T.qs.length);
  if(T.mode==='test'){ store.best[T.n]=Math.max(store.best[T.n]||0, pct); }
  store.attempts.push({mode:T.mode, n:T.n, tier:T.tier, pct:pct, correct:correct, total:T.qs.length, dateISO:nowISO});
  bumpStreak(nowISO); save(); renderStreak();
  T.result = {correct:correct, total:T.qs.length, pct:pct, sect:sect, misses:misses};
  go('results');
}
function emitMiss(q,i,picked,mode){
  try{ window.parent.postMessage({type:'acedat:tool-miss', tool:'minitest', section:SECT[q.section],
    questionId:'minitest_'+qkey(q), hub:'minitest-'+(mode||T.mode||'test'), stem:q.stem,
    pickedKey:String(picked), pickedText:String(picked>-1?q.choices[picked]:'(blank)').slice(0,120),
    correctKey:String(q.correct), correctText:String(q.choices[q.correct]).slice(0,120), ts:Date.now()},'*'); }catch(e){}
}

/* ============================================================ results ============================================================ */
function renderResults(){

      (r.misses.length?'<button class="gold" onclick="go(\'review\')">Review your '+r.misses.length+' miss'+(r.misses.length===1?'':'es')+' now</button>':'')+
      (openN?'<button class="bad" onclick="go(\'mistakes\')">Mistake list ('+openN+')</button>':'')+
      (isTest && pass && testByN(T.n+1)?'<button onclick="go(\'test\','+(T.n+1)+')">Next rung</button>':(isTest?'<button onclick="go(\'test\','+T.n+')">Retry rung</button>':''))+
      '<button class="ghost" onclick="go(\'ladder\')">The Ladder</button></div></div>';
}

/* ============================================================ per-miss card (shared by review + mistake list) ============================================================ */
var _tid=0;
function missCard(q, pickedIdx, opts){
  opts=opts||{};
  var right = pickedIdx===q.correct;
  var rem=(REM[q.section]||{}), learn=rem.learn||'/retold/', review=rem.review||'/ace-labs.html#tools';
  var hint=(rem.topics&&rem.topics[q.topic])||q.topic;
  var trick=trickUrl(q.section, q.topic);
  var id='tk'+(_tid++);
  var wrongN = opts.wrongN;
  var h='<div class="rev '+(right?'correct':'wrong')+'">'+
    '<div class="rt">'+SECT[q.section]+' · '+q.topic+(opts.tier?' · tier '+opts.tier:'')+(wrongN?' · missed '+wrongN+'x':'')+(opts.status?' · <span style="color:'+opts.status.color+'">'+opts.status.text+'</span>':'')+'</div>'+
    '<div class="st">'+q.stem+'</div>'+
    (q.figureSvg?('<div class="fig" style="text-align:left">'+q.figureSvg+'</div>'):'')+
    (pickedIdx>-1 && !right ? '<div class="ans">You chose <b class="no">'+LETTERS[pickedIdx]+') '+q.choices[pickedIdx]+'</b> · correct is <b class="ok">'+LETTERS[q.correct]+') '+q.choices[q.correct]+'</b></div>'
       : '<div class="ans">Correct: <b class="ok">'+LETTERS[q.correct]+') '+q.choices[q.correct]+'</b></div>')+
    '<div class="exp">'+q.explanation+'</div>'+
    '<div class="fixrow">'+
      (trick?'<a class="fx trick" onclick="toggleTrick(\''+id+'\',\''+trick+'\')">Watch the trick</a>':'')+
      '<a class="fx learn" href="'+learn+'" target="_blank" rel="noopener">Learn it · Retold ('+hint+')</a>'+
      '<a class="fx drill" href="'+review+'" target="_blank" rel="noopener">Drill it · engine</a>'+
    '</div><div class="trick-embed" id="'+id+'"></div>'+
  '</div>';
  return h;
}
function toggleTrick(id, url){
  var el=document.getElementById(id); if(!el)return;
  if(el.classList.contains('on')){ el.classList.remove('on'); el.innerHTML=''; }
  else { el.innerHTML='<iframe src="'+url+'" title="Trick short" loading="lazy" allow="autoplay"></iframe>'; el.classList.add('on'); }
}

/* ============================================================ review (immediate, misses from the last attempt) ============================================================ */
function renderReview(){
  var r=T.result;
  var wrong = T.qs.map(function(q,i){ return {q:q,i:i}; }).filter(function(x){ return T.ans[x.i]!==x.q.correct; });
  var html='<h2 class="view">Review - '+T.title+'</h2>'+
    '<p class="lede" style="margin-top:6px">'+(wrong.length?'Fix each one at the source. Watch the trick, walk the night, drill it - then retry them from your mistake list until they stick.':'No misses on this attempt. Onward.')+'</p>';
  wrong.forEach(function(x){ html += missCard(x.q, T.ans[x.i], {tier:(T.tier||undefined)}); });
  html+='<div class="rbtns" style="justify-content:flex-start">'+
    (openMistakes().length?'<button class="bad" onclick="go(\'mistakes\')">Your full mistake list</button>':'')+
    '<button class="ghost" onclick="go(\'results\')">Back to results</button></div>';
  document.getElementById('app').innerHTML=html;
}

/* ============================================================ MISTAKE LIST (the centerpiece) ============================================================ */
function renderMistakes(){
  var app=document.getElementById('app');
  var open=openMistakes(), due=dueMistakes(), sched=scheduledMistakes();
  var masteredN=Object.keys(store.mistakes).filter(function(k){return store.mistakes[k].resolved;}).length;
  if(!open.length){
    app.innerHTML='<h2 class="view">Your Mistake List</h2>'+
      '<div class="empty"><b>Nothing to master right now.</b><br>'+
      (masteredN?('You have mastered '+masteredN+' question'+(masteredN===1?'':'s')+' off this list. '):'')+
      'Take a rung on the Ladder - anything you miss lands here on a spaced-review schedule until you own it.</div>'+
      '<a class="back" onclick="go(\'ladder\')">To the Ladder</a>';
    return;
  }
  var agg={}, order=[];
  open.forEach(function(k){ var m=store.mistakes[k], ky=m.section+'|'+m.topic;
    if(!agg[ky]){ agg[ky]={section:m.section,topic:m.topic,n:0}; order.push(ky);} agg[ky].n++; });
  order.sort(function(a,b){return agg[b].n-agg[a].n;});
  var rankRows=order.slice(0,6).map(function(ky,idx){
    var a=agg[ky], rem=(REM[a.section]||{}), hint=(rem.topics&&rem.topics[a.topic])||'';
    var trick=trickUrl(a.section,a.topic), tid='wt'+(_tid++);
    return '<div class="wk"><div class="rk">'+(idx+1)+'</div>'+
      '<div class="tp">'+a.topic+'<small>'+SECT[a.section]+(hint?' · '+hint:'')+'</small></div>'+
      '<div class="rate" style="color:var(--'+a.section+')">'+a.n+'<small> open</small></div>'+
      '<div class="wkfix fixrow">'+
        (trick?'<a class="fx trick" onclick="toggleTrick(\''+tid+'\',\''+trick+'\')">Watch the trick</a>':'')+
        '<a class="fx learn" href="'+(rem.learn||'/retold/')+'" target="_blank" rel="noopener">Learn</a>'+
        '<a class="fx drill" href="'+(rem.review||'/ace-labs.html#tools')+'" target="_blank" rel="noopener">Drill</a>'+
      '</div><div class="trick-embed" id="'+tid+'" style="grid-column:1/-1"></div></div>';
  }).join('');
  var now=Date.now();
  open.sort(function(a,b){ return (store.mistakes[a].due||0)-(store.mistakes[b].due||0); });
  var listHtml='';
  ['bio','gchem','ochem','qr'].forEach(function(s){
    var ks=open.filter(function(k){return store.mistakes[k].section===s;});
    if(!ks.length) return;
    listHtml+='<div class="section-h" style="color:var(--'+s+')">'+SECT[s]+' · '+ks.length+'</div>';
    ks.forEach(function(k){ var m=store.mistakes[k];
      var isDue=(m.due||0)<=now, days=Math.max(1,Math.ceil(((m.due||0)-now)/DAY));
      var st={ text:(isDue?'due now':'back in '+days+'d')+' · '+(m.streak||0)+'/2 mastered', color:isDue?'var(--bad)':'var(--ink3)' };
      listHtml += missCard(m.q, -1, {tier:m.tier, wrongN:m.wrong, status:st});
    });
  });
  var retryBtn = due.length
    ? '<button class="bad" onclick="go(\'retry\',\'due\')">Retry '+due.length+' due now</button>'
    : (sched.length ? '<button disabled>All caught up · next due in '+Math.max(1,Math.ceil((Math.min.apply(null,sched.map(function(k){return store.mistakes[k].due;}))-now)/DAY))+'d</button>' : '');
  var allBtn = (open.length>due.length) ? '<button class="ghost" onclick="go(\'retry\',\'all\')">Drill all '+open.length+' now</button>' : '';
  app.innerHTML=
    '<h2 class="view">Your Mistake List</h2>'+
    '<div class="mhead"><div class="big-n">'+open.length+'</div>'+
      '<div class="msub">open · <b style="color:var(--bad)">'+due.length+' due now</b>'+(sched.length?(' · '+sched.length+' scheduled'):'')+(masteredN?(' · <b style="color:var(--ok)">'+masteredN+' mastered</b>'):'')+
      '<br>Spaced review: a question needs <b>two correct, spaced out,</b> to master. Miss it and it comes back sooner.</div>'+
      '<div class="sp"></div>'+retryBtn+allBtn+'</div>'+
    '<div class="section-h">Work on these most</div><div class="weak">'+rankRows+'</div>'+
    '<div class="section-h" style="margin-top:30px">Every open mistake</div>'+listHtml+
    '<a class="back" onclick="go(\'ladder\')">To the Ladder</a>';
}

/* ============================================================ PHASE 1: Daily Check + Test Check + review log ============================================================ */
var NEW_CAP = 5;                                   // 4-6 new/day after due reviews clear (Thomas's call)
var GRADE = { again:1, hard:2, good:3, easy:4 };   // FSRS-schema grades

/* FSRS-schema review log - card id, timestamp, grade, prior state - written on EVERY answer from day one. */
function logReview(o){
  store.reviews = store.reviews || [];
  store.reviews.push({ k:o.key, t:Date.now(), g:o.grade, correct:!!o.correct,
    sec:o.section, top:o.topic, tier:o.tier||null, diag:o.diag||null, conf:o.conf||null,
    box:(o.box==null?null:o.box), due:(o.due||null) });
  if(store.reviews.length>4000) store.reviews = store.reviews.slice(-4000);
}

/* every spaced re-test pulls a NOT-just-seen question on the SAME concept - proves understanding, not memorized answer. */
function bankByTopic(section, topic){
  var out=[]; BANK.tests.forEach(function(t){ t.questions.forEach(function(q){ if(q.section===section && q.topic===topic) out.push(q); }); });
  return out;
}
function pickVariant(section, topic, excludeKey){
  var pool=bankByTopic(section, topic);
  var alt=pool.filter(function(q){ return qkey(q)!==excludeKey; });
  var pick = alt.length ? alt : pool;
  if(!pick.length) return null;
  var seen=(store.reviews||[]).filter(function(r){ return r.sec===section && r.top===topic; }).length;
  return pick[seen % pick.length];   // rotate deterministically so a review isn't the same item twice
}

/* the day's queue: due review cards (risk-ordered, served as fresh variants), then capped-new, each interleaved by section. */
function buildNew(cap){
  var out=[], usedTopic={};
  for(var ti=0; ti<BANK.tests.length && out.length<cap; ti++){
    var qs=BANK.tests[ti].questions;
    for(var qi=0; qi<qs.length && out.length<cap; qi++){
      var q=qs[qi], k=qkey(q);
      if(store.mistakes[k]) continue;                       // already in the system
      if(store.seen && store.seen[k]) continue;             // already answered right as new
      if(usedTopic[q.section+'|'+q.topic]) continue;        // at most one new per topic per day (variety)
      out.push({kind:'new', key:k, q:q, section:q.section, topic:q.topic, tier:BANK.tests[ti].tier});
      usedTopic[q.section+'|'+q.topic]=1;
    }
  }
  return out;
}
function interleave(arr){                                   // round-robin by section so confusable types don't block
  var by={}, order=[];
  arr.forEach(function(x){ (by[x.section]=by[x.section]||[]).push(x); if(order.indexOf(x.section)<0) order.push(x.section); });
  var out=[], any=true;
  while(any){ any=false; order.forEach(function(s){ if(by[s].length){ out.push(by[s].shift()); any=true; } }); }
  return out;
}
/* ---- SM-2-lite scheduler (Phase 2): per-card ease governs the spacing. Two spaced novel wins
   still master (Thomas's bar). But a mastered concept doesn't vanish - it enters MAINTENANCE and
   resurfaces at growing intervals (21d -> ~50d -> ...) so it can't silently decay; forget it and
   it lapses straight back into learning. ---- */
function cardEF(m){ return m.ef==null ? 2.5 : m.ef; }
function schedLearnCorrect(m){                 // correct on an open (learning) card
  m.reps=(m.reps||0)+1; m.streak=(m.streak||0)+1; m.ts=Date.now();
  if(m.streak>=2){ schedMaster(m); return 'mastered'; }
  m.ivl=1; m.box=Math.min((m.box||0)+1,3); m.due=Date.now()+m.ivl*DAY;   // one spaced win in; next win masters
  return 'advanced';
}
function schedMaster(m){                        // retire from the daily queue, begin maintenance
  m.resolved=true; m.phase='maintain'; m.ef=cardEF(m);
  m.ivl=21; m.due=Date.now()+m.ivl*DAY;
}
function schedMaintainCorrect(m){               // a mastered concept, still sharp -> push it further out
  m.reps=(m.reps||0)+1; m.ts=Date.now(); m.ef=cardEF(m);
  m.ivl=Math.min(Math.round((m.ivl||21)*m.ef), 180); m.due=Date.now()+m.ivl*DAY;
}
function schedLapse(m){                          // wrong on a learning OR a maintained card
  m.ef=Math.max(1.3, cardEF(m)-0.2);            // keep easiness, nudge down (SM-2 lapse)
  m.resolved=false; m.phase='learn'; m.streak=0; m.reps=0; m.box=0; m.ivl=0; m.due=Date.now();
  m.wrong=(m.wrong||0)+1; m.lapses=(m.lapses||0)+1; m.ts=Date.now();
}
function maintenanceDue(){ var now=Date.now();
  return Object.keys(store.mistakes).filter(function(k){ var m=store.mistakes[k]; return m.resolved && m.phase==='maintain' && (m.due||0)<=now; }); }

function buildDailyQueue(){
  var dueKeys=dueMistakes();
  dueKeys.sort(function(a,b){ var ma=store.mistakes[a], mb=store.mistakes[b];   // highest-risk first
    return (mb.lapses||mb.wrong||0)-(ma.lapses||ma.wrong||0) || (ma.due||0)-(mb.due||0); });
  var due=dueKeys.map(function(k){ var m=store.mistakes[k];
    return {kind:'review', key:k, q:(pickVariant(m.section,m.topic,k)||m.q), section:m.section, topic:m.topic, tier:m.tier}; });
  var maint=maintenanceDue().map(function(k){ var m=store.mistakes[k];
    return {kind:'maintain', key:k, q:(pickVariant(m.section,m.topic,k)||m.q), section:m.section, topic:m.topic, tier:m.tier}; });
  return interleave(due).concat(interleave(maint)).concat(interleave(buildNew(NEW_CAP)));
}

function weakThree(){
  var agg={}, order=[];
  openMistakes().forEach(function(k){ var m=store.mistakes[k], ky=m.section+'|'+m.topic;
    if(!agg[ky]){ agg[ky]={t:m.topic,n:0}; order.push(ky); } agg[ky].n++; });
  order.sort(function(a,b){ return agg[b].n-agg[a].n; });
  return order.slice(0,3).map(function(k){ return agg[k].t; });
}
function stateChips(){
  var masteredN=Object.keys(store.mistakes).filter(function(k){return store.mistakes[k].resolved;}).length;
  var learnN=openMistakes().length, w=weakThree();
  return '<div class="today-state">'+
    (masteredN?'<span class="tstate good">Mastered <b>'+masteredN+'</b></span>':'')+
    '<span class="tstate">Learning <b>'+learnN+'</b></span>'+
    (w.length?'<span class="tstate gold">Weak: <b>'+w.join(', ')+'</b></span>':'')+
    '</div>';
}

/* ---- Today (the one screen) ---- */
function renderToday(){
  var q=buildDailyQueue();
  var dueN=q.filter(function(x){return x.kind==='review';}).length;
  var maintN=q.filter(function(x){return x.kind==='maintain';}).length;
  var newN=q.filter(function(x){return x.kind==='new';}).length;
  var openN=openMistakes().length;
  var app=document.getElementById('app');
  if(!q.length){
    var sched=scheduledMistakes().length;
    app.innerHTML='<div class="today-hero"><div class="eyebrow">Today</div>'+
      '<h1 class="big">All <em>caught up</em>.</h1>'+
      '<p class="lede">Nothing is due right now'+(sched?(' - '+sched+' concept'+(sched===1?' is':'s are')+' resting on the schedule and will resurface the day they are due.'):'.')+' Add fresh challenges from the Ladder whenever you are ready.</p>'+
      stateChips()+
      '<div class="today-cta"><button class="gold" onclick="go(\'ladder\')">Take a rung on the Ladder</button>'+
      (openN?'<button class="ghost" onclick="go(\'mistakes\')">See your mistake list</button>':'')+'</div></div>';
    return;
  }
  var why;
  if(dueN){ var fk=q.filter(function(x){return x.kind==='review';})[0];
    why='Why this order: your '+(fk?fk.topic:'weakest topic')+' is the shakiest thing you own right now, so it leads.'; }
  else why='Fresh ground today - the next rung of the climb, one concept at a time.';
  app.innerHTML='<div class="today-hero"><div class="eyebrow">Today</div>'+
    '<h1 class="big">Today\'s <em>climb</em>.</h1>'+
    '<div class="tq-head">'+
      (dueN?'<div class="tqn"><b>'+dueN+'</b>due for review</div>':'')+
      (maintN?'<div class="tqn"><b>'+maintN+'</b>keeping sharp</div>':'')+
      (newN?'<div class="tqn new"><b>'+newN+'</b>new to learn</div>':'')+
      '<div class="tqn new"><b>'+q.length+'</b>total today</div>'+
    '</div>'+
    '<p class="why-line">'+why+'</p>'+
    stateChips()+
    '<div class="today-cta"><button class="gold" onclick="startCheck()">Start today\'s '+q.length+'</button></div>'+
    '<p class="lede" style="font-size:13.5px;color:var(--ink3);margin-top:20px">Due reviews come first, and each is a <b>fresh question on the same idea</b> - proof you own it, not that you memorized an answer. Miss one and you diagnose why, get the exact fix, and lock it back in.</p></div>';
}

/* ---- the Check player (per-question, untimed, learning mode) ---- */
var C = {};
function startCheck(){
  C = { queue:buildDailyQueue(), i:0, stage:'answer', pick:-1, done:0, right:0, mastered:0,
        diag:null, conf:null, lockPick:-1, locked:undefined };
  if(!C.queue.length) return renderToday();
  document.getElementById('nav-today').classList.add('on');
  document.getElementById('nav-ladder').classList.remove('on');
  document.getElementById('nav-mistakes').classList.remove('on');
  renderCheck();
}
function choiceHtml(q, sel, revealed){
  return q.choices.map(function(c,i){
    var cls='choice';
    if(revealed){ if(i===q.correct) cls+=' correct'; else if(i===C.pick) cls+=' wrong'; }
    else if(sel===i) cls+=' sel';
    return '<button class="'+cls+'"'+(revealed?' disabled':' onclick="checkPick('+i+')"')+'><span class="ltr">'+LETTERS[i]+'</span><span>'+c+'</span></button>';
  }).join('');
}
function renderCheck(){
  var app=document.getElementById('app');
  if(!C.queue || C.i>=C.queue.length) return renderCheckDone();
  var it=C.queue[C.i], q=it.q, prog=Math.round(100*C.i/C.queue.length);
  var head='<div class="check-wrap"><div class="cprog"><span>'+(C.i+1)+' / '+C.queue.length+'</span>'+
    '<div class="bar"><i style="width:'+prog+'%"></i></div><span class="kind">'+(it.kind==='new'?'new':it.kind==='maintain'?'keep sharp':'review')+'</span></div>'+
    '<div class="qcard"><span class="qtag '+q.section+'">'+SECT[q.section]+' · '+q.topic+'</span>'+
    '<p class="stem">'+q.stem+'</p>'+(q.figureSvg?('<div class="fig">'+q.figureSvg+'</div>'):'');
  var body='';
  if(C.stage==='answer'){
    body='<div class="choices">'+choiceHtml(q,C.pick,false)+'</div>'+
      '<div class="cbtnrow"><button class="gold" '+(C.pick<0?'disabled':'')+' onclick="checkSubmit()">Check answer</button>'+
      '<button class="ghost" onclick="quitCheck()">Leave</button></div>';
  } else if(C.stage==='correct'){
    var mc=store.mistakes[it.key], tail='';
    if(it.kind==='review') tail = (mc&&mc.resolved) ? ' &nbsp;Two spaced wins - mastered. It moves to maintenance so it stays sharp.' : ' &nbsp;One spaced win in - one more, on a fresh question, and the concept is yours.';
    else if(it.kind==='maintain') tail = ' &nbsp;Still sharp - back in '+(mc?mc.ivl:'')+' days.';
    body='<div class="choices">'+choiceHtml(q,C.pick,true)+'</div>'+
      '<div class="correct-note"><b>Correct.</b> '+q.explanation+tail+'</div>'+
      '<div class="cbtnrow"><button class="gold" onclick="checkNext()">'+(C.i+1>=C.queue.length?'Finish':'Next')+'</button></div>';
  } else if(C.stage==='lockin'){
    body=lockPanel(it,q);
  } else {
    body='<div class="choices">'+choiceHtml(q,C.pick,true)+'</div>'+
      '<p class="cq-ans">You chose <b class="no">'+LETTERS[C.pick]+') '+q.choices[C.pick]+'</b> · correct is <b class="ok">'+LETTERS[q.correct]+') '+q.choices[q.correct]+'</b></p>'+
      (C.stage==='diagnose'?diagPanel():fixPanel(it,q));
  }
  app.innerHTML=head+body+'</div></div>';
}
function checkPick(i){ C.pick=i; renderCheck(); }
function checkSubmit(){
  var it=C.queue[C.i], q=it.q, right=C.pick===q.correct;
  C.done++;
  if(right){
    C.right++;
    if(it.kind==='review'){
      var m=store.mistakes[it.key];
      if(m && !m.resolved){ if(schedLearnCorrect(m)==='mastered') C.mastered++; }
      logReview({key:it.key, grade:GRADE.good, correct:true, section:q.section, topic:q.topic, tier:it.tier, box:m?m.box:null, due:m?m.due:null, ef:m?m.ef:null, ivl:m?m.ivl:null});
    } else if(it.kind==='maintain'){
      var mM=store.mistakes[it.key];
      if(mM && mM.resolved) schedMaintainCorrect(mM);
      logReview({key:it.key, grade:GRADE.good, correct:true, section:q.section, topic:q.topic, tier:it.tier, due:mM?mM.due:null, ef:mM?mM.ef:null, ivl:mM?mM.ivl:null});
    } else {
      store.seen[qkey(q)]=Date.now();                                     // new answered right = known
      logReview({key:qkey(q), grade:GRADE.good, correct:true, section:q.section, topic:q.topic, tier:it.tier});
    }
    C.stage='correct'; save(); renderStreak();
  } else {
    var key=it.key || qkey(q);
    var mm=store.mistakes[key] || {section:q.section, topic:q.topic, tier:it.tier||1, q:q, wrong:0};
    if(it.kind!=='review' && it.kind!=='maintain') mm.q=q;                // review/maintain cards keep their canonical question
    store.mistakes[key]=mm; it.key=key;
    schedLapse(mm);                                                       // wrong -> lapse (learning or maintenance)
    emitMiss(q, 0, C.pick, 'check');
    C.diag=null; C.conf=null; C.locked=undefined; C.lockPick=-1;
    C.stage='diagnose'; save(); renderStreak();
  }
  renderCheck();
}
function diagPanel(){
  var D=[['gap','Concept gap',"I didn't know the idea"],['slip','Procedure slip','Knew it, executed wrong'],
         ['misread','Misread / trap','Fell for a distractor or misread'],['guess','Guessed','No real basis']];
  var dg=D.map(function(d){ return '<button class="dbtn'+(C.diag===d[0]?' sel':'')+'" onclick="setDiag(\''+d[0]+'\')">'+d[1]+'<small>'+d[2]+'</small></button>'; }).join('');
  var cf=[['sure','Sure'],['unsure','Unsure']].map(function(c){ return '<button class="dbtn'+(C.conf===c[0]?' sel':'')+'" onclick="setConf(\''+c[0]+'\')">'+c[1]+'</button>'; }).join('');
  return '<div class="diag"><h4>Why did you miss it?</h4><div class="diagbtns">'+dg+'</div>'+
    '<div class="sub">How sure were you?</div><div class="confbtns">'+cf+'</div>'+
    '<div class="cbtnrow"><button class="gold" '+((C.diag&&C.conf)?'':'disabled')+' onclick="checkToFix()">See the fix</button></div></div>';
}
function setDiag(d){ C.diag=d; renderCheck(); }
function setConf(c){ C.conf=c; renderCheck(); }
function checkToFix(){
  var it=C.queue[C.i], q=it.q, key=it.key||qkey(q), m=store.mistakes[key];
  if(m){ m.diag=C.diag; m.conf=C.conf; }
  logReview({key:key, grade:GRADE.again, correct:false, section:q.section, topic:q.topic, tier:it.tier, diag:C.diag, conf:C.conf, box:0, due:m?m.due:Date.now()});
  save(); C.stage='fix'; renderCheck();
}
function fixPanel(it,q){
  var rem=(REM[q.section]||{}), learn=rem.learn||'/retold/', review=rem.review||'/ace-labs.html#tools';
  var hint=(rem.topics&&rem.topics[q.topic])||q.topic;
  var trick=trickUrl(q.section,q.topic), id='ck'+(_tid++), order, lead;
  if(C.diag==='gap'){ lead='Re-teach the idea, then drill it.'; order=['trick','learn','drill']; }
  else if(C.diag==='slip'){ lead='You know it - put reps on the mechanics.'; order=['drill','trick','learn']; }
  else if(C.diag==='misread'){ lead='The trap you fell for: '+(C.pick>-1?('"'+q.choices[C.pick]+'"'):'the distractor')+'. Slow the read, then confirm.'; order=['trick','learn','drill']; }
  else { lead='Treat it as new - learn it from the ground up.'; order=['learn','trick','drill']; }
  var link={
    trick: trick?'<a class="fx trick" onclick="toggleTrick(\''+id+'\',\''+trick+'\')">Watch the trick</a>':'',
    learn: '<a class="fx learn" href="'+learn+'" target="_blank" rel="noopener">Learn it · Retold ('+hint+')</a>',
    drill: '<a class="fx drill" href="'+review+'" target="_blank" rel="noopener">Drill it · engine</a>'
  };
  var fixes=order.map(function(o){return link[o];}).filter(Boolean).join('');
  return '<div class="fixpanel"><p class="fx-lead">'+lead+'</p>'+
    '<div class="exp">'+q.explanation+'</div>'+
    '<div class="fixrow">'+fixes+'</div><div class="trick-embed" id="'+id+'"></div>'+
    '<div class="cbtnrow"><button class="gold" onclick="checkToLock()">I\'ve got it - lock it in</button></div></div>';
}
function checkToLock(){ C.stage='lockin'; C.locked=undefined; C.lockPick=-1; renderCheck(); }
function lockPanel(it,q){
  if(C.locked===undefined){
    var ch=q.choices.map(function(c,i){ return '<button class="choice'+(C.lockPick===i?' sel':'')+'" onclick="lockPick('+i+')"><span class="ltr">'+LETTERS[i]+'</span><span>'+c+'</span></button>'; }).join('');
    return '<div class="fixpanel"><p class="fx-lead">Lock it in - answer it once more.</p>'+
      '<div class="choices">'+ch+'</div>'+
      '<div class="cbtnrow"><button class="gold" '+(C.lockPick<0?'disabled':'')+' onclick="lockSubmit()">Lock in</button></div></div>';
  }
  var revealed='<div class="choices">'+q.choices.map(function(c,i){
    var cls='choice'; if(i===q.correct)cls+=' correct'; else if(i===C.lockPick)cls+=' wrong';
    return '<button class="'+cls+'" disabled><span class="ltr">'+LETTERS[i]+'</span><span>'+c+'</span></button>'; }).join('')+'</div>';
  var note = C.locked
    ? '<div class="lock-note ok"><b>Locked.</b> It comes back in a day on a fresh question - two spaced wins and the concept is yours.</div>'
    : '<div class="lock-note stay"><b>Not yet - and that is fine.</b> It stays on today\'s list and resurfaces soon; the fix is above whenever you want another look.</div>';
  return '<div class="fixpanel">'+revealed+note+
    '<div class="cbtnrow"><button class="gold" onclick="checkNext()">'+(C.i+1>=C.queue.length?'Finish':'Next')+'</button></div></div>';
}
function lockPick(i){ C.lockPick=i; renderCheck(); }
function lockSubmit(){
  var it=C.queue[C.i], q=it.q, ok=C.lockPick===q.correct, key=it.key||qkey(q), m=store.mistakes[key];
  C.locked=ok;
  if(m){ m.reps=(m.reps||0)+1; if(ok){ m.ivl=1; m.box=1; m.due=Date.now()+DAY; } else { m.ivl=0; m.box=0; m.due=Date.now(); } }  // same-item lock-in: no streak/mastery credit
  logReview({key:key, grade:ok?GRADE.hard:GRADE.again, correct:ok, section:q.section, topic:q.topic, tier:it.tier, diag:C.diag, conf:C.conf, box:m?m.box:0, due:m?m.due:0});
  save(); renderStreak(); renderCheck();
}
function checkNext(){ C.i++; C.stage='answer'; C.pick=-1; C.diag=null; C.conf=null; C.locked=undefined; C.lockPick=-1; renderCheck(); }
function quitCheck(){ if(confirm('Leave today\'s check? Everything you have answered is already saved.')){ bumpStreak(new Date().toISOString()); save(); renderStreak(); go('today'); } }
function renderCheckDone(){
  bumpStreak(new Date().toISOString()); save(); renderStreak();
  var app=document.getElementById('app'), dueLeft=dueMistakes().length;
  app.innerHTML='<div class="check-done"><div class="eyebrow">Today · done</div>'+
    '<div class="score-big">'+C.right+'<small> / '+C.done+'</small></div>'+
    '<p class="lede" style="margin:14px auto 0">'+
      (C.mastered?('You mastered <b>'+C.mastered+'</b> concept'+(C.mastered===1?'':'s')+' today - '):'')+
      'every miss is diagnosed, fixed, and back on the schedule. That is the climb.</p>'+
    '<div class="cd-stats">'+
      '<div class="s"><b>'+C.done+'</b>worked</div>'+
      '<div class="s"><b style="color:var(--ok)">'+C.right+'</b>first-try right</div>'+
      '<div class="s"><b style="color:var(--gold)">'+C.mastered+'</b>mastered</div>'+
      '<div class="s"><b>'+dueLeft+'</b>still due</div>'+
    '</div>'+
    '<div class="cd-row">'+
      (dueLeft?'<button class="gold" onclick="startCheck()">Keep going · '+dueLeft+' due</button>':'<button class="gold" onclick="go(\'ladder\')">Take a rung on the Ladder</button>')+
      '<button class="ghost" onclick="go(\'mistakes\')">Your mistake list</button>'+
      '<button class="ghost" onclick="go(\'today\')">Done for now</button>'+
    '</div></div>';
}

/* one-time migration: pull misses from pre-existing attempts (old shape carried misses[])
   into the new master list, reconstructing each question from the bank by test + index. Idempotent. */
(function migrateMisses(){
  if(!store.attempts||!store.attempts.length) return; var changed=false;
  store.attempts.forEach(function(a){
    if(!a.misses||!a.misses.length||!(a.n>=1)) return;
    var t=testByN(a.n); if(!t) return;
    a.misses.forEach(function(mm){
      var q=t.questions[mm.qi]; if(!q) return; var key=qkey(q);
      if(store.mistakes[key]) return;
      store.mistakes[key]={section:q.section,topic:q.topic,tier:a.tier||t.tier,q:q,wrong:1,streak:0,box:0,due:Date.now(),resolved:false,ts:Date.now()}; changed=true;
    });
  });
  if(changed) save();
})();

/* boot */
renderStreak(); renderToday();
</script>
