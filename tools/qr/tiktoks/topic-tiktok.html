<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080,initial-scale=1"/>
<title>Ace The DAT — QR TikTok (Sarah)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=DM+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
<style>
:root{
  --sb:#0d2018; --ink:#f5f0e8;
  --muted:rgba(245,240,232,.55); --dim:rgba(245,240,232,.32);
  --gold:#C9A84C; --gold-m:#E2C97A; --gold-d:#8C7235;
  --teal:#5fa3ff; --teal-d:#2c6fc4;
  --warm:#ff8a3a; --warm-d:#cc5a14;
  --good:#7be08a; --good-d:#3f9a52;
  --trap:#f59e0b; --trap-deep:#b45309;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;overflow:hidden;font-family:'DM Sans',sans-serif;color:var(--ink);}
.stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;transform-origin:center center;overflow:hidden;transition:background 0.8s ease;}
/* Hook background varies by tier — visual differentiation across the 29 templated TikToks */
.stage[data-phase="hook"]{background:linear-gradient(175deg,#0a1812 0%,#0d2018 50%,#08120c 100%);}
.stage[data-tier="0"][data-phase="hook"]{background:linear-gradient(175deg,#0a2018 0%,#10362a 50%,#08120c 100%);} /* foundations: green-leaning */
.stage[data-tier="1"][data-phase="hook"]{background:linear-gradient(175deg,#1f1606 0%,#2c2009 50%,#08120c 100%);} /* quant: warm gold */
.stage[data-tier="2"][data-phase="hook"]{background:linear-gradient(175deg,#08161e 0%,#0d2030 50%,#08120c 100%);} /* patterns: teal-leaning */
.stage[data-phase="demo"]{background:linear-gradient(175deg,#0a1830 0%,#0d2040 50%,#06122a 100%);}
.stage[data-tier="0"][data-phase="demo"]{background:linear-gradient(175deg,#0d2520 0%,#143c30 50%,#06120c 100%);}
.stage[data-tier="1"][data-phase="demo"]{background:linear-gradient(175deg,#2c1f08 0%,#3d2c0c 50%,#1a1206 100%);}
.stage[data-tier="2"][data-phase="demo"]{background:linear-gradient(175deg,#0a1830 0%,#0d2040 50%,#06122a 100%);}
.stage[data-phase="trap"]{background:linear-gradient(175deg,#3d2706 0%,#5c3608 50%,#2c1d04 100%);}
.stage[data-phase="lock"]{background:linear-gradient(175deg,#0a1812 0%,#1a3322 50%,#0d2018 100%);}
/* Tier badges in the brand area */
.tier-pill{position:absolute;top:130px;left:70px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:rgba(245,240,232,.10);border:1px solid rgba(201,168,76,.35);color:var(--gold-m);}
.tier-pill[data-t="0"]{border-color:#5fa874;color:#7be08a;background:rgba(95,168,116,.12);}
.tier-pill[data-t="1"]{border-color:var(--gold-d);color:var(--gold-m);background:rgba(201,168,76,.12);}
.tier-pill[data-t="2"]{border-color:#3a6b54;color:#5fa3ff;background:rgba(58,107,84,.15);}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:99;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:220px;}

.brand{position:absolute;left:0;right:0;top:50px;display:flex;align-items:center;justify-content:space-between;padding:0 70px;z-index:20;}
.brand-word{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:#fff;}
.brand-word span{color:var(--gold);}
.brand-tag{font-size:18px;font-weight:600;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;}

.voice-toggle{position:absolute;top:130px;right:70px;z-index:30;width:64px;height:64px;border-radius:50%;background:rgba(13,32,24,.85);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);}
.voice-toggle.active{background:var(--gold);}
.voice-toggle svg{width:30px;height:30px;fill:var(--gold);}
.voice-toggle.active svg{fill:#0d2018;}
.voice-tooltip{position:absolute;top:210px;right:70px;z-index:30;background:rgba(13,32,24,.92);color:var(--gold-m);font-size:14px;padding:8px 12px;border-radius:6px;border:1px solid rgba(201,168,76,.3);opacity:0;pointer-events:none;transition:opacity .2s;max-width:200px;}

/* HOOK */
.hook{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:25;opacity:1;pointer-events:none;text-align:center;padding:0 80px;}
.hook-tag{font-size:24px;font-weight:700;color:var(--gold);letter-spacing:.22em;text-transform:uppercase;margin-bottom:30px;display:flex;align-items:center;gap:18px;}
.hook-tag::before,.hook-tag::after{content:'';width:30px;height:1px;background:var(--gold);}
.hook-word{font-family:'Playfair Display',serif;font-size:200px;font-weight:900;color:#fff;letter-spacing:-.04em;line-height:.92;text-shadow:0 0 60px rgba(201,168,76,.4);}
.hook-word em{color:var(--gold);font-style:italic;}
.hook-sub{font-size:32px;font-weight:600;color:var(--muted);margin-top:30px;letter-spacing:.04em;max-width:840px;line-height:1.3;}

/* DEMO — formula + bullets */
.formula-hero{position:absolute;left:60px;right:60px;top:330px;text-align:center;z-index:15;opacity:0;}
.formula-line{font-family:'JetBrains Mono',monospace;font-size:80px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.2;}
.formula-line .gold{color:var(--gold-m);}
.formula-line .teal{color:var(--teal);}
.formula-line .warm{color:var(--warm);}
.formula-sub{font-size:28px;font-weight:600;color:var(--muted);margin-top:16px;letter-spacing:.04em;line-height:1.4;}

.bullets{position:absolute;left:80px;right:80px;top:680px;z-index:15;opacity:0;background:rgba(13,32,24,.65);border:2px solid rgba(201,168,76,.30);border-radius:24px;padding:36px 40px;backdrop-filter:blur(10px);}
.bullets-h{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;margin-bottom:24px;}
.bullet{display:flex;gap:20px;margin-bottom:20px;font-family:'Playfair Display',serif;font-size:36px;font-weight:600;color:#fff;line-height:1.35;opacity:0;transform:translateY(18px);transition:all .5s;}
.bullet.show{opacity:1;transform:translateY(0);}
.bullet:last-child{margin-bottom:0;}
.bullet .num{font-family:'JetBrains Mono',monospace;font-size:36px;color:var(--gold);font-weight:700;flex-shrink:0;width:48px;}
.bullet .text{flex:1;}
.bullet .text em{font-style:italic;color:var(--gold-m);}
.bullet .text .teal{color:var(--teal);}
.bullet .text .warm{color:var(--warm);}

/* Caption — fixed belt at y=1500 */
.caption{position:absolute;left:50%;top:1500px;transform:translateX(-50%);z-index:18;background:#000;color:#fff;font-size:50px;font-weight:900;padding:22px 44px;border-radius:14px;letter-spacing:-.01em;line-height:1.1;box-shadow:0 12px 40px rgba(0,0,0,.6);text-align:center;opacity:0;max-width:920px;}

/* Trap */
.trap{position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(135deg,rgba(245,158,11,.95),rgba(180,83,9,.95));z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 70px;opacity:0;pointer-events:none;}
.trap-ribbon{background:#0d2018;color:var(--gold);font-size:32px;font-weight:900;letter-spacing:.20em;padding:18px 40px;border-radius:8px;margin-bottom:50px;text-transform:uppercase;border:2px solid var(--gold);}
.trap-h{font-family:'Playfair Display',serif;font-size:140px;font-weight:900;color:#fff;line-height:.95;letter-spacing:-.03em;margin-bottom:36px;max-width:920px;}
.trap-h em{font-style:italic;color:#0d2018;}
.trap-sub{font-size:42px;font-weight:600;color:rgba(13,32,24,.92);line-height:1.3;max-width:880px;}
.trap-sub em{font-style:italic;font-weight:800;}

/* Lock */
.lock{position:absolute;left:0;right:0;top:0;bottom:0;z-index:35;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;pointer-events:none;text-align:center;padding:0 70px;}
.lock-tag{font-size:28px;font-weight:700;color:var(--gold);letter-spacing:.22em;text-transform:uppercase;margin-bottom:30px;}
.lock-word{font-family:'Playfair Display',serif;font-size:160px;font-weight:900;color:var(--gold);line-height:.95;letter-spacing:-.04em;text-shadow:0 0 80px rgba(201,168,76,.5);max-width:920px;}
.lock-word em{font-style:italic;}
.lock-decode{font-size:36px;font-weight:600;color:#fff;margin-top:50px;line-height:1.55;max-width:880px;}
.lock-decode .gold{color:var(--gold-m);}
.lock-decode .teal{color:var(--teal);}
.lock-decode .warm{color:var(--warm);}

/* Foot */
.foot{position:absolute;left:80px;right:80px;bottom:80px;z-index:50;}
.scrub-wrap{position:relative;height:8px;background:rgba(245,240,232,.1);border-radius:4px;cursor:pointer;}
.scrub-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--gold-m),var(--gold));border-radius:4px;}
.scrub-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;background:var(--gold);border-radius:50%;box-shadow:0 0 0 4px rgba(201,168,76,.22);}
.foot-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:18px;color:var(--dim);letter-spacing:.1em;}
.foot-cta{color:var(--gold);font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.play-btn{background:var(--gold);color:#0d2018;border:none;padding:10px 22px;border-radius:6px;font-weight:700;letter-spacing:.08em;font-size:16px;cursor:pointer;font-family:inherit;}
.play-btn:hover{background:var(--gold-m);}
.watermark{position:absolute;left:80px;bottom:30px;font-size:14px;letter-spacing:.2em;color:rgba(245,240,232,.28);text-transform:uppercase;z-index:50;}

/* Face PiP — universal across all topic TikToks */
.face-pip{position:absolute;right:60px;bottom:240px;width:320px;height:320px;border-radius:50%;overflow:hidden;border:5px solid var(--gold);box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 0 3px rgba(13,32,24,.3);background:#000;z-index:48;display:none;}
.face-pip.show{display:block;}
.face-pip video{width:100%;height:100%;object-fit:cover;}
.face-pip-tag{position:absolute;bottom:-36px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.2em;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.6);}

/* Empty/error state */
.empty-state{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 80px;z-index:60;}
.empty-state h2{font-family:'Playfair Display',serif;font-size:80px;color:var(--gold);margin-bottom:30px;}
.empty-state p{font-size:32px;color:var(--muted);max-width:760px;line-height:1.4;}
.empty-state code{font-family:'JetBrains Mono',monospace;color:var(--gold-m);background:rgba(245,240,232,.08);padding:4px 12px;border-radius:6px;}
</style>
</head>
<body>
<div class="stage" id="stage" data-phase="hook" data-tier="">
  <div class="tier-pill" id="tierPill" data-t="" style="display:none"></div>

  <div class="brand">
    <div class="brand-word">Ace The <span>DAT</span></div>
    <div class="brand-tag" id="brandTag">QR · Sarah</div>
  </div>

  <button class="voice-toggle" id="voiceBtn" aria-label="Toggle voice">
    <svg viewBox="0 0 24 24"><path d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z"/></svg>
  </button>
  <div class="voice-tooltip" id="voiceTip">Click to enable voice</div>

  <div class="hook" id="hook">
    <div class="hook-tag" id="hookTag">Topic</div>
    <div class="hook-word" id="hookWord">—</div>
    <div class="hook-sub" id="hookSub">—</div>
  </div>

  <div class="formula-hero" id="formulaHero">
    <div class="formula-line" id="formulaLine">—</div>
    <div class="formula-sub" id="formulaSub"></div>
  </div>

  <div class="bullets" id="bullets">
    <div class="bullets-h" id="bulletsH">The pattern</div>
    <div id="bulletList"></div>
  </div>

  <div class="caption" id="caption">caption</div>

  <div class="trap" id="trap">
    <div class="trap-ribbon">⚠ DAT Trap</div>
    <div class="trap-h" id="trapH">—</div>
    <div class="trap-sub" id="trapSub">—</div>
  </div>

  <div class="lock" id="lock">
    <div class="lock-tag">Lock it in</div>
    <div class="lock-word" id="lockWord">—</div>
    <div class="lock-decode" id="lockDecode">—</div>
  </div>

  <div class="empty-state" id="emptyState" style="display:none">
    <h2>No topic loaded.</h2>
    <p>Add <code>?topic=&lt;skill-id&gt;</code> to the URL.<br/><br/>Examples: <code>?topic=p-cond</code> · <code>?topic=zscore</code> · <code>?topic=count-pc</code></p>
  </div>

  <div class="foot">
    <div class="scrub-wrap" id="scrubBar">
      <div class="scrub-fill" id="scrubFill"></div>
      <div class="scrub-thumb" id="scrubThumb" style="left:0%"></div>
    </div>
    <div class="foot-row">
      <button class="play-btn" id="playBtn">▶ Play</button>
      <div class="foot-cta">acethedat.com</div>
    </div>
  </div>

  <div class="watermark" id="watermark">Ace The DAT · QR · Sarah</div>

  <div class="face-pip" id="facePip">
    <video id="facePipVideo" autoplay loop muted playsinline></video>
    <div class="face-pip-tag">Sarah</div>
  </div>
</div>

<script src="topics.js"></script>
<script>
function fitStage(){
  const s=document.getElementById('stage');
  const scale=Math.min(window.innerWidth/1080,window.innerHeight/1920);
  s.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
window.addEventListener('resize',fitStage); fitStage();

/* Resolve topic from ?topic=X URL param */
const params = new URLSearchParams(window.location.search);
const topicKey = params.get('topic');
const topic = (topicKey && window.TOPICS && window.TOPICS[topicKey]) || null;
/* Redirect to bespoke file if topic has one */
if (topic && topic.customFile && !params.get('force')){
  const face = params.get('face');
  window.location.replace(topic.customFile + (face ? '?face=' + encodeURIComponent(face) : ''));
}

if (!topic){
  document.getElementById('hook').style.display = 'none';
  document.getElementById('emptyState').style.display = 'flex';
} else {
  // Tier-aware visual identity — accent color + pill
  const tierMatch = (topic.tag || '').match(/Tier (\d)/);
  const tier = tierMatch ? tierMatch[1] : '';
  const stage = document.getElementById('stage');
  stage.setAttribute('data-tier', tier);
  if (tier){
    const pill = document.getElementById('tierPill');
    pill.setAttribute('data-t', tier);
    pill.textContent = ['Foundations','Building Blocks','Patterns','Test-day'][tier] || ('Tier ' + tier);
    pill.style.display = 'inline-block';
  }
  // Populate brand + content
  document.getElementById('brandTag').textContent = topic.tag || 'QR · Sarah';
  document.getElementById('watermark').textContent = 'Ace The DAT · ' + (topic.tag || 'QR · Sarah');
  document.title = 'Ace The DAT — ' + topic.title;
  document.getElementById('hookTag').textContent = topic.hookTag || topic.title;
  document.getElementById('hookWord').innerHTML = topic.hookWord;
  document.getElementById('hookSub').textContent = topic.hookSub;
  document.getElementById('formulaLine').innerHTML = topic.formula;
  document.getElementById('formulaSub').innerHTML = topic.formulaSub || '';
  document.getElementById('bulletsH').textContent = topic.bulletsHead || 'The pattern';
  document.getElementById('bulletList').innerHTML = (topic.bullets || []).map((b, i) =>
    `<div class="bullet" data-i="${i}"><span class="num">${(i+1).toString().padStart(2,'0')}</span><span class="text">${b}</span></div>`
  ).join('');
  document.getElementById('trapH').innerHTML = topic.trapH;
  document.getElementById('trapSub').innerHTML = topic.trapSub;
  document.getElementById('lockWord').innerHTML = topic.lockWord;
  document.getElementById('lockDecode').innerHTML = topic.lockDecode;
}

/* Face PiP */
(function(){
  if (!topic) return;
  let faceUrl = null;
  try {
    faceUrl = params.get('face') || (topicKey && localStorage.getItem('tt-face-' + topicKey));
  } catch(e){}
  if (faceUrl){
    const pip = document.getElementById('facePip');
    const vid = document.getElementById('facePipVideo');
    vid.src = faceUrl;
    pip.classList.add('show');
    vid.play().catch(()=>{});
  }
})();

/* Voice */
const synth = window.speechSynthesis;
let voices = [], selectedVoice = null, voiceEnabled = false;
function pickVoice(){
  if (!synth) return;
  voices = synth.getVoices();
  const prefs = ['Ava (Premium)','Ava','Allison','Samantha','Karen','Moira','Tessa','Susan','Veena','Microsoft Aria','Google US English'];
  for(const p of prefs){ const f = voices.find(v=>v.name===p||v.name.startsWith(p)); if(f){selectedVoice=f; return;}}
  selectedVoice = voices.find(v=>/female|samantha|allison|ava|karen|aria|moira/i.test(v.name) && /en/i.test(v.lang)) || voices[0];
}
if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;
if (synth) pickVoice();
function speak(t,o){if(!voiceEnabled||!t||!synth)return; synth.cancel(); const u=new SpeechSynthesisUtterance(t); if(selectedVoice)u.voice=selectedVoice; u.rate=(o&&o.rate)||0.94; u.pitch=(o&&o.pitch)||0.97; u.volume=1; synth.speak(u);}
const voiceBtn=document.getElementById('voiceBtn'),voiceTip=document.getElementById('voiceTip');
voiceBtn.addEventListener('click',()=>{
  voiceEnabled=!voiceEnabled; voiceBtn.classList.toggle('active',voiceEnabled);
  voiceTip.textContent = voiceEnabled?'Voice on':'Click to enable voice';
  voiceTip.style.opacity='1'; setTimeout(()=>voiceTip.style.opacity='0',1800);
  if(voiceEnabled && topic){const ph=document.getElementById('stage').getAttribute('data-phase'); if(ph==='hook') speak(topic.hookSpeak || topic.hookSub);}
  else if (synth) synth.cancel();
});

/* Animation timeline — universal */
if (topic){
  const stage = document.getElementById('stage');
  const hook = document.getElementById('hook');
  const formulaHero = document.getElementById('formulaHero');
  const bullets = document.getElementById('bullets');
  const bulletEls = bullets.querySelectorAll('.bullet');
  const caption = document.getElementById('caption');
  const trap = document.getElementById('trap');
  const lock = document.getElementById('lock');
  const scrubFill = document.getElementById('scrubFill');
  const scrubThumb = document.getElementById('scrubThumb');
  const playBtn = document.getElementById('playBtn');

  const SPEAK = topic.speak || {};
  const TIMELINE = [
    {t:0,    fn: () => { stage.dataset.phase='hook'; hook.style.opacity=1; formulaHero.style.opacity=0; bullets.style.opacity=0; caption.style.opacity=0; trap.style.opacity=0; lock.style.opacity=0; bulletEls.forEach(b=>b.classList.remove('show')); if(voiceEnabled) speak(SPEAK.hook || topic.hookSpeak); }},
    {t:4500, fn: () => { stage.dataset.phase='demo'; anime({targets:hook,opacity:0,duration:500,easing:'easeOutQuad'}); setTimeout(() => { formulaHero.style.opacity=1; anime({targets:formulaHero,scale:[0.85,1],opacity:[0,1],duration:700,easing:'easeOutQuad'}); }, 400); if(voiceEnabled) speak(SPEAK.formula || ''); }},
    {t:11000, fn: () => { bullets.style.opacity=1; anime({targets:bullets,translateY:[40,0],opacity:[0,1],duration:700,easing:'easeOutQuad'}); if(voiceEnabled) speak(SPEAK.bulletsIntro || 'Three things to remember.'); }},
    {t:15000, fn: () => { if(bulletEls[0]) bulletEls[0].classList.add('show'); }},
    {t:19000, fn: () => { if(bulletEls[1]) bulletEls[1].classList.add('show'); }},
    {t:23000, fn: () => { if(bulletEls[2]) bulletEls[2].classList.add('show'); }},
    {t:27000, fn: () => { if(bulletEls[3]) bulletEls[3].classList.add('show'); }},
    {t:31000, fn: () => { caption.innerHTML = topic.caption || ''; if(topic.caption){ caption.style.opacity=1; anime({targets:caption,translateY:[20,0],opacity:[0,1],duration:500}); } }},
    {t:36000, fn: () => { caption.style.opacity=0; stage.dataset.phase='trap'; trap.style.opacity=1; anime({targets:trap,opacity:[0,1],duration:600}); if(voiceEnabled) speak(SPEAK.trap || ''); }},
    {t:46000, fn: () => { trap.style.opacity=0; stage.dataset.phase='lock'; lock.style.opacity=1; anime({targets:lock,opacity:[0,1],scale:[0.9,1],duration:700,easing:'easeOutQuad'}); if(voiceEnabled) speak(SPEAK.lock || ''); }},
    {t:60000, fn: () => { /* hold */ }},
    {t:67000, fn: () => { stage.dataset.phase='hook'; lock.style.opacity=0; hook.style.opacity=1; if(voiceEnabled) speak(SPEAK.outro || (topic.lockWord && topic.lockWord.replace(/<[^>]+>/g,''))); }}
  ];
  const TOTAL = 72000;

  let startedAt = 0, paused = true, elapsed = 0;
  function tick(){
    if(paused) return;
    const now = Date.now();
    const t = elapsed + (now - startedAt);
    for(const e of TIMELINE){ if(!e._fired && t >= e.t){ e._fired = true; e.fn(); } }
    scrubFill.style.width = Math.min(100, t / TOTAL * 100) + '%';
    scrubThumb.style.left = Math.min(100, t / TOTAL * 100) + '%';
    if(t >= TOTAL){ paused = true; playBtn.textContent = '↻ Replay'; return; }
    requestAnimationFrame(tick);
  }
  function play(){
    if(elapsed >= TOTAL){ TIMELINE.forEach(e => e._fired = false); elapsed = 0; }
    paused = false; startedAt = Date.now();
    playBtn.textContent = '⏸ Pause';
    tick();
  }
  function pause(){ paused = true; elapsed += Date.now() - startedAt; playBtn.textContent = '▶ Resume'; }
  playBtn.addEventListener('click', () => { if(paused) play(); else pause(); });
  document.getElementById('scrubBar').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - r.left) / r.width;
    elapsed = Math.max(0, Math.min(TOTAL, pct * TOTAL));
    TIMELINE.forEach(e => e._fired = e.t < elapsed);
    for(let i = TIMELINE.length - 1; i >= 0; i--){ if(TIMELINE[i].t <= elapsed){ TIMELINE[i].fn(); break; } }
    if(!paused){ startedAt = Date.now(); }
    scrubFill.style.width = (elapsed / TOTAL * 100) + '%';
    scrubThumb.style.left = (elapsed / TOTAL * 100) + '%';
  });
}
</script>
