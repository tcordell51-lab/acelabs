<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · Ace Labs</title>
<meta name="description" content="Every finished test and set, question by question, with the one-tap reason for each miss. Every miss is already in Repair.">
<link rel="icon" type="image/svg+xml" href="/shared/ace-dat-mark.svg">
<link rel="stylesheet" href="/shared/ace-ui.css?v=8">
<link rel="stylesheet" href="/shared/ace-loop.css?v=4">
<style>
  .rv-head { margin-bottom: 4px; }
  .rv-secs { display: flex; flex-wrap: wrap; gap: 8px; }
  .rv-sec { display: flex; flex-direction: column; padding: 8px 12px; border-radius: 14px; border: 1px solid #e6dccb; background: #FCFAF6; font-size: 13px; }
  .rv-sec b { font-size: 14px; }
  .rv-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .rv-tabs button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid rgba(27,58,45,.3); background: #FCFAF6; font: 600 14px 'DM Sans', system-ui, sans-serif; color: #0d2018; cursor: pointer; }
  .rv-tabs button[aria-pressed="true"] { background: #1B3A2D; border-color: #1B3A2D; color: #F5F0E8; }
  .rv-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; overflow-wrap: anywhere; }
  .rv-q { padding: 16px; border-radius: 18px; border: 1px solid #e6dccb; background: #FCFAF6; display: flex; flex-direction: column; gap: 10px; }
  .rv-q.miss { border-left: 5px solid #b5482f; }
  .rv-q.ok { border-left: 5px solid #007a59; }
  .rv-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .rv-mark { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .rv-mark.ok { color: #007a59; } .rv-mark.miss { color: #b5482f; }
  .rv-stem { margin: 0; font-size: 16px; line-height: 1.5; color: #0d2018; }
  .rv-note { color: #3a4a42; font-size: 14px; }
  .rv-choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .rv-choices li { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 12px; border: 1px solid #ece4d5; font-size: 14.5px; }
  .rv-choices li b { flex-shrink: 0; width: 18px; }
  .rv-choices li em { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .rv-choices li.right { background: #e6f1ea; border-color: #9cc9ad; }
  .rv-choices li.yours { background: #f8e6df; border-color: #e0a894; }
  .rv-why { margin: 0; } .rv-why dt { font-weight: 700; font-size: 13px; color: #3a4a42; } .rv-why dd { margin: 2px 0 0; font-size: 14.5px; line-height: 1.5; }
  .rv-reason { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 10px; border-top: 1px dashed rgba(27,58,45,.18); }
  .rv-reason__h { font-size: 13px; font-weight: 700; color: #3a4a42; margin-right: 4px; flex-basis: 100%; }
  .rv-reason__b { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid rgba(27,58,45,.3); background: #fffdf7; font: 500 13.5px 'DM Sans', system-ui, sans-serif; color: #0d2018; cursor: pointer; }
  .rv-reason__b[aria-pressed="true"] { background: #C9A84C; border-color: #C9A84C; font-weight: 700; }
  .rv-reason__line { flex-basis: 100%; margin: 4px 0 0; font-size: 13.5px; color: #3a4a42; }
  .see-it { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; min-height: 38px; padding: 0 14px; border-radius: 999px; background: #C9A84C; color: #0d2018; font-weight: 700; font-size: 14px; text-decoration: none; }
  .rv-runs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .rv-runs a { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 16px; border: 1px solid #e6dccb; background: #FCFAF6; color: #0d2018; text-decoration: none; }
  .rv-runs a b { font-size: 16px; } .rv-runs a span { font-size: 13px; color: #3a4a42; }
  .rv-empty { padding: 14px; border-radius: 14px; background: #FCFAF6; border: 1px dashed #d8ccb6; }
  .rv-legacy { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .rv-legacy li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid #ece4d5; }
</style>
</head>
<body class="aui">
<main class="aui-wrap loop" id="main">
  <div id="rv" class="aui-stack"></div>
  <a class="loop-go" id="rv-next" href="/">Back to today's plan</a>
  <div id="rv-more" class="aui-stack"></div>
</main>
<script src="/shared/ace-skills.js?v=2"></script>
<script src="/shared/ace-progress.js?v=6"></script>
<script src="/shared/ace-record.js?v=6"></script>
<script src="/shared/ace-visuals.js?v=4"></script>
<script src="/shared/ace-test-review.js?v=6"></script>
<script src="/shared/ace-ui.js?v=5" defer></script>
<script>
(function () {
  'use strict';
  var R = window.AceRecord, host = document.getElementById('rv'), more = document.getElementById('rv-more'), next = document.getElementById('rv-next');
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmt(t) { var d = new Date(t); return MON[d.getMonth()] + ' ' + d.getDate(); }
  var id = new URLSearchParams(location.search).get('run');
  var runs = R.runs().slice().reverse();
  var run = id ? R.run(id) : null;
  if (run) {
    window.AceTestReview.render(host, run);
    var c = R.missCounts();
    next.textContent = c.open ? 'Done: back to today’s plan' : 'Back to today’s plan';
  } else {
    var head = el('header', 'loop-head');
    head.appendChild(el('p', 'loop-date', 'Review'));
    head.appendChild(el('h1', 'aui-h1', 'Every test, question by question'));
    head.appendChild(el('p', 'aui-lede', 'Open a finished test or set to go through it one question at a time and tag why you missed each one. Every miss is already in Repair.'));
    host.appendChild(head);
    if (id) host.appendChild(el('p', 'rv-empty', 'That test is no longer saved in this browser (the last eight are kept). Pick one below.'));
    if (!runs.length) {
      host.appendChild(el('p', 'rv-empty', 'Nothing to review yet. Take the diagnostic: when you finish, it opens here question by question.'));
      next.textContent = 'Take the diagnostic'; next.href = '/diagnostic.html';
    } else {
      var ul = el('ul', 'rv-runs');
      runs.forEach(function (x) {
        var li = el('li'), a = el('a'); a.href = '/review/?run=' + encodeURIComponent(x.id); a.setAttribute('data-run', x.id);
        var left = el('span'); left.appendChild(el('b', null, x.title)); left.appendChild(document.createElement('br')); left.appendChild(el('span', null, fmt(x.at) + ' · ' + x.right + ' of ' + x.total + ' right'));
        a.appendChild(left); a.appendChild(el('span', null, (x.total - x.right) + ' to review'));
        li.appendChild(a); ul.appendChild(li);
      });
      host.appendChild(ul);
    }
  }
  // Misses saved by older tools before they moved onto the shared record: listed, not scheduled.
  try {
    var old = window.AceProgress ? window.AceProgress.misses({}).filter(function (m) { return !/^record:/.test(m.id); }) : [];
    if (old.length && !run) {
      more.appendChild(el('h2', 'aui-h2', 'From older tools'));
      more.appendChild(el('p', 'aui-small', old.length + ' miss' + (old.length === 1 ? '' : 'es') + ' saved by tools before they wrote to Repair. They are listed here so nothing is lost; new misses from every tool go to Repair.'));
      var lu = el('ul', 'rv-legacy');
      old.slice(0, 40).forEach(function (m) { var li = el('li'); li.appendChild(el('span', null, m.concept || m.topic || 'Miss')); li.appendChild(el('span', 'aui-small', m.sourceLabel || '')); lu.appendChild(li); });
      more.appendChild(lu);
    }
  } catch (e) { /* an old adapter failed: nothing to list */ }
})();
</script>
<script src="/shared/ace-tabs.js?v=4" defer></script>
</body>
</html>
