<!doctype html>
<html lang="en" data-door="practice">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bio Practice Set | Ace Labs</title>
<link rel="icon" href="assets/ace-dat-mark-reversed.svg">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/kit.css">
<link rel="stylesheet" href="assets/exam.css">
</head>
<body>
<!-- Player mode: the shell is hidden; the exam bars are the only chrome. -->
<div class="exam" aria-label="DAT-style question screen">
  <header class="x-top">
    <div class="l"><span class="big" id="qpos">Question 4 of 10</span><span class="sm" id="qset">Bio practice set</span></div>
    <div class="c"><span class="big" id="qsec">Survey of the Natural Sciences</span></div>
    <div class="r"><span class="sm" id="clockLbl">Untimed practice</span><span class="clock timed-only" id="clock">1:12:40</span></div>
  </header>
  <div class="x-tools" role="toolbar" aria-label="Test tools">
    <button class="x-tool" id="hlBtn" type="button" aria-pressed="false"><span data-icon="marker"></span>Highlight</button>
    <button class="x-tool" id="xoBtn" type="button" aria-pressed="false"><span data-icon="strike"></span>Cross out</button>
    <span class="hint" id="toolHint" aria-live="polite"></span>
    <span class="sp"></span>
    <a class="practice-only" href="today.html">Exit to Ace Labs</a>
  </div>
  <div class="x-main" id="xmain">
    <div class="x-body" id="xbody">
      <section class="x-card" id="card" aria-labelledby="stem">
        <p class="x-stem" id="stem"></p>
        <div class="x-opts" role="radiogroup" aria-labelledby="stem" id="xopts"></div>
        <div class="checkrow practice-only" id="checkrow">
          <button class="btn-check" id="checkBtn" type="button" disabled><span data-icon="prove" data-icon-cls="sm"></span>Check</button>
          <button class="stuck-link" id="stuckBtn" type="button">Stuck?</button>
          <span class="note" id="checkNote">Pick an answer, then check it. There is no Check button on test day; here it opens the explainer.</span>
        </div>
      </section>
      <section class="x-review" id="review" hidden aria-labelledby="revH"></section>
      <div class="xp-inline practice-only" id="xpInline"></div>
    </div>
    <aside class="xp-side practice-only" id="xpSide" aria-label="Explainer"></aside>
  </div>
  <footer class="x-foot" role="toolbar" aria-label="Question navigation">
    <button class="x-btn" type="button" id="prevBtn"><u>P</u>revious</button>
    <button class="x-btn" type="button" id="nextBtn"><u>N</u>ext</button>
    <button class="x-btn" type="button" id="markBtn" aria-pressed="false"><u>M</u>ark</button>
    <button class="x-btn" type="button" id="revBtn"><u>R</u>eview</button>
    <button class="x-btn" type="button" id="exBtn" aria-pressed="false">E<u>x</u>hibit</button>
  </footer>
</div>

<script src="assets/kit.js"></script>
<script src="assets/bio-real.js"></script>
<script src="assets/tonicity.js"></script>
<script src="assets/loop.js"></script>
<script src="assets/question.js"></script>
</body>
</html>
