<body class="world-app">
<header class="gamebar">
  <a href="#" class="world-brand" aria-label="DAT: Ace of Realms"><div>ACE OF REALMS<small>AN ACE LABS ADVENTURE</small></div></a>
  <div class="gamebar-status"><span id="badgeCount">0 badges</span><span id="coinCount">0 coins</span><span id="saveLabel" aria-live="polite">Saved on this device</span></div>
  <div class="gamebar-actions"><button id="reviewButton" class="world-settings review-due" title="Spaced reviews">0 due</button><button id="soundButton" class="world-settings sound-toggle" aria-pressed="true">Sound on</button><button id="settingsButton" class="world-settings" aria-label="Adventure settings">Settings</button></div>
</header>
<nav class="world-navigation" aria-label="World menu">
  <button id="questButton" class="quest-nav">Field log</button>
  <button id="atlasMapButton">Realms map</button>
  <button id="teamButton">Team</button>
  <button id="bagButton">Bag</button>
  <button id="canonButton">DAT Canon</button>
  <button id="journalButton">Learning journal</button>
  <button id="topicButton">Topic map</button>
  <button id="reviewGroveButton">Return Grove</button>
  <button id="howToPlayButton">How to play</button>
</nav>
<div id="overworldHost" class="overworld-host"><canvas id="adventureCanvas" tabindex="0" role="img" aria-label="Walkable DAT world. Use arrows or WASD to walk, Enter to interact, or the on-screen pad and A button."></canvas><div id="bootStatus" role="status">Opening the realms...</div></div>
<button id="companionButton" class="companion-dock" aria-label="Your traveling companion"><canvas id="partnerPortrait" aria-hidden="true"></canvas><span><strong id="partnerName">Your companion</strong><small id="partnerLevel">Your adventure begins</small></span><span class="companion-chat-icon">?</span></button>
<div id="worldNotice" class="world-notice" role="status" hidden></div>
<dialog id="worldPanel" class="world-panel"><div class="world-panel-header"><h2 id="panelTitle"></h2><button id="closeWorldPanel" aria-label="Close panel">×</button></div><div id="panelBody"></div></dialog>
<input type="file" id="worldImportFile" accept="application/json,.json" hidden>
<script type="module" src="boot.mjs"></script>
</body>
</html>
