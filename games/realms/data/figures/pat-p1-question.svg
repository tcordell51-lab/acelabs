<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 240" role="img" aria-label="Paper fold sequence. Left half folds onto the right half. Punch at original row 1, column 3. The final unfolded pattern is not shown." style="font-family:system-ui,sans-serif"><rect x="22" y="37" width="112" height="112" fill="#edf0ed" stroke="#a8b6b9" stroke-dasharray="4 4"/><rect x="22" y="37" width="112" height="112" fill="#fffef7" stroke="#52728b" stroke-width="2"/><path d="M50 37v112" stroke="#ccd5dc"/><path d="M22 65h112" stroke="#ccd5dc"/><path d="M78 37v112" stroke="#ccd5dc"/><path d="M22 93h112" stroke="#ccd5dc"/><path d="M106 37v112" stroke="#ccd5dc"/><path d="M22 121h112" stroke="#ccd5dc"/><text x="78" y="177" font-size="12" text-anchor="middle" fill="#294638">1. Start flat</text><rect x="178" y="37" width="112" height="112" fill="#edf0ed" stroke="#a8b6b9" stroke-dasharray="4 4"/><rect x="234" y="37" width="56" height="112" fill="#fffef7" stroke="#52728b" stroke-width="2"/><path d="M234 65h56" stroke="#ccd5dc"/><path d="M234 93h56" stroke="#ccd5dc"/><path d="M262 37v112" stroke="#ccd5dc"/><path d="M234 121h56" stroke="#ccd5dc"/><text x="234" y="177" font-size="12" text-anchor="middle" fill="#294638">2. Fold right</text><rect x="334" y="37" width="112" height="112" fill="#edf0ed" stroke="#a8b6b9" stroke-dasharray="4 4"/><rect x="390" y="37" width="56" height="112" fill="#fffef7" stroke="#52728b" stroke-width="2"/><path d="M390 65h56" stroke="#ccd5dc"/><path d="M390 93h56" stroke="#ccd5dc"/><path d="M418 37v112" stroke="#ccd5dc"/><path d="M390 121h56" stroke="#ccd5dc"/><circle cx="404" cy="51" r="6.5" fill="#294a72"/><text x="390" y="177" font-size="12" text-anchor="middle" fill="#294638">3. Punch</text><text x="244" y="205" font-size="11" text-anchor="middle" fill="#294638">Left half folds onto the right half.</text><text x="244" y="223" font-size="10" text-anchor="middle" fill="#294638">Dashed square: original footprint. Solid outline: folded paper.</text></svg>
