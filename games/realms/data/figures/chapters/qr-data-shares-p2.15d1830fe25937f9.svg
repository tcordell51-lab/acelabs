<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Usable-scan percentages on a zero-to-100% axis: East 60%, total 50 scans; West 40%, total 100 scans.</title><desc id="desc">Usable-scan percentages on a zero-to-100% axis: East 60%, total 50 scans; West 40%, total 100 scans. Original figure with exact values; no interpolation is needed.</desc><rect width="800" height="460" rx="22" fill="#f2f8f6"/><text x="400" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" fill="#163945">Usable scans — share of each group</text><text x="400" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#163945">Every percentage uses its own group total</text><line x1="120" x2="740" y1="340" y2="340" stroke="#bfd3d6"/><text x="105" y="346" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">0%</text><line x1="120" x2="740" y1="290" y2="290" stroke="#bfd3d6"/><text x="105" y="296" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">20%</text><line x1="120" x2="740" y1="240" y2="240" stroke="#bfd3d6"/><text x="105" y="246" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">40%</text><line x1="120" x2="740" y1="190" y2="190" stroke="#bfd3d6"/><text x="105" y="196" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">60%</text><line x1="120" x2="740" y1="140" y2="140" stroke="#bfd3d6"/><text x="105" y="146" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">80%</text><line x1="120" x2="740" y1="90" y2="90" stroke="#bfd3d6"/><text x="105" y="96" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">100%</text><rect x="222" y="190" width="136" height="150" fill="#62aeba" stroke="#214f60" stroke-width="2"/><text x="290" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" fill="#163945">60%</text><text x="290" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#163945">East</text><text x="290" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#163945">Total: 50 scans</text><rect x="502" y="240" width="136" height="100" fill="#e9b962" stroke="#214f60" stroke-width="2"/><text x="570" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" fill="#163945">40%</text><text x="570" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#163945">West</text><text x="570" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#163945">Total: 100 scans</text><text x="400" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#163945">Vertical axis: percent usable</text></svg>
