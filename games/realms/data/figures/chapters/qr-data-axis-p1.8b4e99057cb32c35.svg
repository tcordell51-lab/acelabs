<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Count chart, vertical axis 40 to 60 readings with ticks every 5; North 48, South 56. The displayed baseline is 40, not zero.</title><desc id="desc">Count chart, vertical axis 40 to 60 readings with ticks every 5; North 48, South 56. The displayed baseline is 40, not zero. Original figure with exact values; no interpolation is needed.</desc><rect width="800" height="460" rx="22" fill="#f2f8f6"/><text x="400" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" fill="#163945">Recorded observations — counts</text><text x="400" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#163945">Axis begins at 40, not zero</text><line x1="120" x2="740" y1="340" y2="340" stroke="#bfd3d6"/><text x="105" y="346" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">40</text><line x1="120" x2="740" y1="277.5" y2="277.5" stroke="#bfd3d6"/><text x="105" y="283.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">45</text><line x1="120" x2="740" y1="215" y2="215" stroke="#bfd3d6"/><text x="105" y="221" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">50</text><line x1="120" x2="740" y1="152.5" y2="152.5" stroke="#bfd3d6"/><text x="105" y="158.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">55</text><line x1="120" x2="740" y1="90" y2="90" stroke="#bfd3d6"/><text x="105" y="96" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">60</text><rect x="222" y="240" width="136" height="100" fill="#62aeba" stroke="#214f60" stroke-width="2"/><text x="290" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" fill="#163945">48</text><text x="290" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#163945">North</text><rect x="502" y="140" width="136" height="200" fill="#e9b962" stroke="#214f60" stroke-width="2"/><text x="570" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" fill="#163945">56</text><text x="570" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#163945">South</text><text x="400" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#163945">Vertical axis: number of observations</text></svg>
