<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Frequency histogram of all 30 transit times. Count on vertical axis. Equal-width bins [0,5):8, [5,10):12, [10,15):10 minutes; lower endpoints included, upper excluded.</title><desc id="desc">Frequency histogram of all 30 transit times. Count on vertical axis. Equal-width bins [0,5):8, [5,10):12, [10,15):10 minutes; lower endpoints included, upper excluded. Original figure with exact values; no interpolation is needed.</desc><rect width="800" height="460" rx="22" fill="#f2f8f6"/><text x="400" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" fill="#163945">All 30 transit times</text><text x="400" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#163945">Vertical axis: frequency (count), not density</text><line x1="120" x2="720" y1="338" y2="338" stroke="#bfd3d6"/><text x="100" y="344" text-anchor="end" font-family="system-ui, sans-serif" font-size="20" fill="#163945">0</text><line x1="120" x2="720" y1="261.3333333333333" y2="261.3333333333333" stroke="#bfd3d6"/><text x="100" y="267.3333333333333" text-anchor="end" font-family="system-ui, sans-serif" font-size="20" fill="#163945">5</text><line x1="120" x2="720" y1="184.66666666666666" y2="184.66666666666666" stroke="#bfd3d6"/><text x="100" y="190.66666666666666" text-anchor="end" font-family="system-ui, sans-serif" font-size="20" fill="#163945">10</text><line x1="120" x2="720" y1="108" y2="108" stroke="#bfd3d6"/><text x="100" y="114" text-anchor="end" font-family="system-ui, sans-serif" font-size="20" fill="#163945">15</text><rect x="120" y="215.33333333333331" width="200" height="122.66666666666669" fill="#62aeba" stroke="#214f60" stroke-width="2"/><text x="220" y="205.33333333333331" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#163945">8</text><rect x="320" y="154" width="200" height="184" fill="#e9b962" stroke="#214f60" stroke-width="2"/><text x="420" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#163945">12</text><rect x="520" y="184.66666666666666" width="200" height="153.33333333333334" fill="#62aeba" stroke="#214f60" stroke-width="2"/><text x="620" y="174.66666666666666" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#163945">10</text><text x="120" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#163945">0</text><text x="320" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#163945">5</text><text x="520" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#163945">10</text><text x="720" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#163945">15</text><text x="400" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" fill="#163945">Time (minutes)</text><text x="400" y="441" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#163945">Each bin includes its lower boundary and excludes its upper boundary.</text></svg>
