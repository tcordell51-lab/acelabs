<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Common scale in seconds from 0 to 20. Min, Q1, median, Q3, max: A = 2,5,8,11,15; B = 1,4,10,12,17. Whiskers show minima and maxima.</title><desc id="desc">Common scale in seconds from 0 to 20. Min, Q1, median, Q3, max: A = 2,5,8,11,15; B = 1,4,10,12,17. Whiskers show minima and maxima. Original figure with exact values; no interpolation is needed.</desc><rect width="800" height="460" rx="22" fill="#f2f8f6"/><text x="400" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#163945">Transit times — common scale in seconds</text><text x="400" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#163945">Whiskers show minimum and maximum</text><line x1="140" x2="140" y1="95" y2="350" stroke="#bfd3d6"/><text x="140" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#163945">0</text><line x1="285" x2="285" y1="95" y2="350" stroke="#bfd3d6"/><text x="285" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#163945">5</text><line x1="430" x2="430" y1="95" y2="350" stroke="#bfd3d6"/><text x="430" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#163945">10</text><line x1="575" x2="575" y1="95" y2="350" stroke="#bfd3d6"/><text x="575" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#163945">15</text><line x1="720" x2="720" y1="95" y2="350" stroke="#bfd3d6"/><text x="720" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#163945">20</text><text x="55" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" fill="#163945">A</text><line x1="198" x2="575" y1="165" y2="165" stroke="#214f60" stroke-width="3"/><rect x="285" y="131" width="174" height="68" fill="#62aeba" stroke="#214f60" stroke-width="3"/><line x1="198" x2="198" y1="149" y2="181" stroke="#214f60" stroke-width="4"/><line x1="372" x2="372" y1="131" y2="199" stroke="#214f60" stroke-width="4"/><line x1="575" x2="575" y1="149" y2="181" stroke="#214f60" stroke-width="4"/><text x="55" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" fill="#163945">B</text><line x1="169" x2="633" y1="295" y2="295" stroke="#214f60" stroke-width="3"/><rect x="256" y="261" width="232" height="68" fill="#e9b962" stroke="#214f60" stroke-width="3"/><line x1="169" x2="169" y1="279" y2="311" stroke="#214f60" stroke-width="4"/><line x1="430" x2="430" y1="261" y2="329" stroke="#214f60" stroke-width="4"/><line x1="633" x2="633" y1="279" y2="311" stroke="#214f60" stroke-width="4"/><text x="400" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#163945">Median = inner line; IQR = Q3 − Q1</text></svg>
