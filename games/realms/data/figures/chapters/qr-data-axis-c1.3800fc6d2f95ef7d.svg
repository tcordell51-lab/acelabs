<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Pulses on a vertical axis beginning at 60 and ending at 90, ticks every 10: Day 1 = 72, Day 2 = 81.</title><desc id="desc">Pulses on a vertical axis beginning at 60 and ending at 90, ticks every 10: Day 1 = 72, Day 2 = 81. Original figure with exact values; no interpolation is needed.</desc><rect width="800" height="460" rx="22" fill="#f2f8f6"/><text x="400" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" fill="#163945">Recorded observations — counts</text><text x="400" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#163945">Axis begins at 60, not zero</text><line x1="120" x2="740" y1="340" y2="340" stroke="#bfd3d6"/><text x="105" y="346" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">60</text><line x1="120" x2="740" y1="256.66666666666663" y2="256.66666666666663" stroke="#bfd3d6"/><text x="105" y="262.66666666666663" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">70</text><line x1="120" x2="740" y1="173.33333333333331" y2="173.33333333333331" stroke="#bfd3d6"/><text x="105" y="179.33333333333331" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">80</text><line x1="120" x2="740" y1="89.99999999999997" y2="89.99999999999997" stroke="#bfd3d6"/><text x="105" y="95.99999999999997" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#163945">90</text><rect x="222" y="240" width="136" height="100" fill="#62aeba" stroke="#214f60" stroke-width="2"/><text x="290" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" fill="#163945">72</text><text x="290" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#163945">Day 1</text><rect x="502" y="165" width="136" height="175" fill="#e9b962" stroke="#214f60" stroke-width="2"/><text x="570" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" fill="#163945">81</text><text x="570" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#163945">Day 2</text><text x="400" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#163945">Vertical axis: number of observations</text></svg>
