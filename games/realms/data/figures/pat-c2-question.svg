<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 240" role="img" aria-label="Paper fold sequence. Bottom half folds onto the top half. Punch at original row 1, column 2. The final unfolded pattern is not shown." style="font-family:system-ui,sans-serif"><rect x="22" y="37" width="112" height="112" fill="#edf0ed" stroke="#a8b6b9" stroke-dasharray="4 4"/><rect x="22" y="37" width="112" height="112" fill="#fffef7" stroke="#52728b" stroke-width="2"/><path d="M50 37v112" stroke="#ccd5dc"/><path d="M22 65h112" stroke="#ccd5dc"/><path d="M78 37v112" stroke="#ccd5dc"/><path d="M22 93h112" stroke="#ccd5dc"/><path d="M106 37v112" stroke="#ccd5dc"/><path d="M22 121h112" stroke="#ccd5dc"/><text x="78" y="177" font-size="12" text-anchor="middle" fill="#294638">1. Start flat</text><rect x="178" y="37" width="112" height="112" fill="#edf0ed" stroke="#a8b6b9" stroke-dasharray="4 4"/><rect x="178" y="37" width="112" height="56" fill="#fffef7" stroke="#52728b" stroke-width="2"/><path d="M206 37v56" stroke="#ccd5dc"/><path d="M178 65h112" stroke="#ccd5dc"/><path d="M234 37v56" stroke="#ccd5dc"/><path d="M262 37v56" stroke="#ccd5dc"/><text x="234" y="177" font-size="12" text-anchor="middle" fill="#294638">2. Fold up</text><rect x="334" y="37" width="112" height="112" fill="#edf0ed" stroke="#a8b6b9" stroke-dasharray="4 4"/><rect x="334" y="37" width="112" height="56" fill="#fffef7" stroke="#52728b" stroke-width="2"/><path d="M362 37v56" stroke="#ccd5dc"/><path d="M334 65h112" stroke="#ccd5dc"/><path d="M390 37v56" stroke="#ccd5dc"/><path d="M418 37v56" stroke="#ccd5dc"/><circle cx="376" cy="51" r="6.5" fill="#294a72"/><text x="390" y="177" font-size="12" text-anchor="middle" fill="#294638">3. Punch</text><text x="244" y="205" font-size="11" text-anchor="middle" fill="#294638">Bottom half folds onto the top half.</text><text x="244" y="223" font-size="10" text-anchor="middle" fill="#294638">Dashed square: original footprint. Solid outline: folded paper.</text></svg>
