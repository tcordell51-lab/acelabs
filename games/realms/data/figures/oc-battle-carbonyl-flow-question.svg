<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 242" role="img" aria-label="A neutral aldehyde: carbon has a double bond to oxygen and single bonds to R and hydrogen. R represents the remaining substituent; for propanal, it is CH3CH2. No reaction arrows or partial-charge hints are shown." style="font-family:system-ui,sans-serif"><rect x="25" y="18" width="450" height="164" rx="20" fill="#eee6f5"/>
    <g stroke="#4f4260" stroke-width="3" fill="none"><path d="M245 55v35 M255 55v35 M235 116l-74 32 M265 116l74 32"/></g>
    <text x="250" y="45" font-size="25" text-anchor="middle" fill="#4f4260">O</text><text x="250" y="118" font-size="25" text-anchor="middle" fill="#4f4260">C</text><text x="146" y="160" font-size="25" text-anchor="middle" fill="#4f4260">R</text><text x="354" y="160" font-size="25" text-anchor="middle" fill="#4f4260">H</text>
    <text x="250" y="205" font-size="12" text-anchor="middle" fill="#294638">Neutral aldehyde group: R-C(=O)-H</text>
    <text x="250" y="225" font-size="10" text-anchor="middle" fill="#294638">R is the remaining substituent; for propanal, R = CH3CH2.</text></svg>
