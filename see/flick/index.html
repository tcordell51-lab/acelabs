<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Flick · Ace Labs</title>
<meta name="description" content="Flick each card up or down: does it increase or decrease? Ten quick rounds on periodic trends, gas laws, rates, acidity and more.">
<link rel="icon" type="image/svg+xml" href="/shared/ace-dat-mark.svg">
<link rel="stylesheet" href="/shared/ace-ui.css?v=9">

<style>
  .gm-back { display: inline-flex; align-items: center; gap: 6px; min-height: var(--aui-tap); font-weight: 700; text-decoration: none; }
  .gm-grid { display: grid; gap: var(--aui-3); grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
  .gm-pick { display: grid; gap: 4px; align-content: start; min-height: 96px; padding: var(--aui-4); background: var(--aui-paper); border: 1px solid var(--aui-line); border-left: 6px solid var(--c, var(--aui-forest)); border-radius: var(--aui-r); color: inherit; text-decoration: none; box-shadow: var(--aui-shadow); }
  .aui a.gm-pick { color: inherit; }
  .gm-pick small { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--c, var(--aui-ink-3)); }
  .gm-pick b { font-size: var(--aui-t-lg); line-height: 1.25; }
  .gm-pick span { font-size: 15px; color: var(--aui-ink-2); }
  .gm-pick .gm-best { color: var(--aui-good); font-weight: 700; }
  .gm-game { max-width: 560px; margin-inline: auto; }
  .gm-hud { display: grid; grid-template-columns: 1fr auto; gap: var(--aui-3); align-items: center; }
  .gm-dots { display: flex; gap: 5px; flex-wrap: wrap; }
  .gm-dots i { width: 18px; height: 10px; border-radius: 5px; background: var(--aui-line-2); }
  .gm-dots i[data-s="ok"] { background: #2f7d4f; } .gm-dots i[data-s="no"] { background: #a3405c; } .gm-dots i[data-s="now"] { background: #C9A84C; }
  .gm-streak { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; background: #1B3A2D; color: #F5F0E8; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .gm-streak[data-hot="true"] { background: #C9A84C; color: #1B3A2D; }
  .gm-fb { margin: 0; min-height: 4.6em; font-size: 17px; line-height: 1.4; }
  .gm-fb b { display: block; font-size: 19px; }
  .gm-fb[data-ok="true"] b { color: #2f7d4f; } .gm-fb[data-ok="false"] b { color: #a3405c; }
  .gm-bar { display: flex; flex-wrap: wrap; gap: var(--aui-3); align-items: center; }
  .gm-end { text-align: center; display: grid; gap: var(--aui-3); justify-items: center; padding: var(--aui-5) var(--aui-4); background: var(--aui-paper); border: 1px solid var(--aui-line); border-radius: var(--aui-r-lg); box-shadow: var(--aui-shadow); }
  .gm-end .gm-score { font: 700 56px/1 "Playfair Display", Georgia, serif; color: #1B3A2D; }
  .gm-end p { margin: 0; font-size: 17px; }
  .gm-choice { min-height: 64px; border-radius: 16px; border: 2px solid #1B3A2D; background: var(--aui-paper); color: #1B3A2D; font: 700 19px/1.2 "DM Sans", system-ui, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px; transition: transform .12s ease, background .12s ease; }
  .gm-choice:hover:not(:disabled) { background: #f1ece0; }
  .gm-choice:active:not(:disabled) { transform: scale(.97); }
  .gm-choice:focus-visible, .gm-card:focus-visible { outline: 3px solid #C9A84C; outline-offset: 3px; }
  .gm-choice:disabled { cursor: default; opacity: .5; }
  .gm-choice[data-s="ok"] { background: #2f7d4f; border-color: #2f7d4f; color: #fff; opacity: 1; }
  .gm-choice[data-s="no"] { background: #a3405c; border-color: #a3405c; color: #fff; opacity: 1; }
  .gm-choice svg { width: 26px; height: 26px; flex: none; }
  body[data-mode="menu"] #game, body[data-mode="game"] #menu { display: none; }
  @media (prefers-reduced-motion: reduce) { .gm-choice, .gm-card, .tug-knot { transition: none !important; } }
  .fl-stage { display: grid; gap: 12px; }
  .gm-card { position: relative; display: grid; place-items: center; text-align: center; min-height: 190px; padding: 22px 18px; background: #FDFCF8; border: 2px solid #1B3A2D; border-radius: 20px; box-shadow: 0 4px 0 rgba(27, 58, 45, .16); font: 700 24px/1.3 "Kalam ACE", "DM Sans", system-ui, sans-serif; color: #1B3A2D; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; transition: transform .2s ease, opacity .2s ease, border-color .2s ease, background .2s ease; }
  .gm-card sub, .gm-card sup { font-size: 68%; line-height: 0; }
  .gm-card[data-drag] { transition: none; cursor: grabbing; }
  .gm-card[data-tilt="up"] { border-color: #2f5f9e; background: #eef3fa; } .gm-card[data-tilt="down"] { border-color: #b5762a; background: #fbf4e8; }
  .gm-card[data-s="ok"] { border-color: #2f7d4f; background: #eef6ef; cursor: default; } .gm-card[data-s="no"] { border-color: #a3405c; background: #fbf0f3; cursor: default; }
  .fl-grip { position: absolute; left: 50%; top: 8px; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: rgba(27, 58, 45, .2); }
  @media (max-width: 480px) { .gm-card { font-size: 22px; min-height: 170px; } }
</style>
</head>
<body class="aui" data-mode="menu">
<main class="aui-wrap" id="main">
  <div id="menu" class="aui-stack">
    <header class="aui-stack">
      <a class="gm-back" href="/see/">&larr; All whiteboards</a>
      <p class="aui-kicker">Labs · Play</p>
      <h1 class="aui-h1">Trend Flick</h1>
      <p class="aui-lede">Up or down? Flick the card. Ten rounds, keep your streak.</p>
    </header>
    <div id="gm-grid" class="gm-grid"></div>
  </div>
  <div id="game" class="aui-stack gm-game">
    <a class="gm-back" href="/see/flick/">&larr; All decks</a>
    <header>
      <p class="aui-kicker" id="gm-kicker"></p>
      <h1 class="aui-h2" id="gm-title"></h1>
    </header>
    <div id="gm-play" class="aui-stack">
      <div class="gm-hud"><div class="gm-dots" id="gm-dots" role="img"></div><span class="gm-streak" id="gm-streak" aria-live="polite">Streak 0</span></div>
      <div class="fl-stage">
        <button type="button" class="gm-choice" id="fl-up" data-dir="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V5M5 12l7-7 7 7"/></svg><span id="fl-up-t"></span></button>
        <div class="gm-card" id="fl-card" tabindex="0" role="group" aria-describedby="fl-help"><span class="fl-grip" aria-hidden="true"></span><span id="fl-q"></span></div>
        <button type="button" class="gm-choice" id="fl-down" data-dir="down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M5 12l7 7 7-7"/></svg><span id="fl-down-t"></span></button>
      </div>
      <p id="fl-help" class="aui-sr">Swipe the card up or down, tap a button, or press the up or down arrow key.</p>
      <p class="gm-fb" id="gm-fb" role="status" aria-live="polite"></p>
      <div class="gm-bar"><button type="button" class="aui-btn aui-btn--gold" id="gm-next" hidden>Next</button></div>
    </div>
    <div id="gm-end" class="gm-end" hidden></div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var KEY = 'acelabs.flick', FEED = 'flick', PATH = '/see/flick/', ROUNDS = 10, EVENT = 'flick-done';
  var B = window.AceBoard;
  var COLOR = { bio: '#2f7d4f', gchem: '#2f5f9e', ochem: '#6b4fa0', qr: '#a3405c', pat: '#b5762a', rc: '#1B3A2D' };
  var ORDER = ['bio', 'gchem', 'ochem', 'pat', 'rc', 'qr'];
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function $(id) { return document.getElementById(id); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
  function save(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* private mode: the game still plays */ } }
  function shuffled(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function plain(s) { return String(s).replace(/[_^]\{([^}]*)\}/g, '$1'); }
  var decks = B.list().filter(function (b) { return b[FEED]; }).sort(function (a, b) { return ORDER.indexOf(a.section) - ORDER.indexOf(b.section); });
  var id = new URLSearchParams(location.search).get('d'), board = id && B.get(id);
  if ((!board || !board[FEED]) && decks.length === 1) board = decks[0];
  function menu() {
    var best = load(), grid = $('gm-grid');
    decks.forEach(function (b) {
      var a = el('a', 'gm-pick'); a.href = PATH + '?d=' + encodeURIComponent(b.id); a.style.setProperty('--c', COLOR[b.section] || '#1B3A2D'); a.setAttribute('data-deck', b.id);
      a.appendChild(el('small', null, B.SECTION[b.section] || ''));
      var t = el('b'); t.innerHTML = B.html(b[FEED].title); a.appendChild(t);
      a.appendChild(el('span', best[b.id] ? 'gm-best' : null, best[b.id] ? 'Best: ' + best[b.id].score + ' of ' + ROUNDS + ', streak ' + best[b.id].streak : ROUNDS + ' quick rounds'));
      grid.appendChild(a);
    });
  }
  function dots(res, n) {
    var d = $('gm-dots'); d.textContent = '';
    for (var i = 0; i < n; i++) { var s = el('i'); if (i < res.length) s.setAttribute('data-s', res[i] ? 'ok' : 'no'); else if (i === res.length) s.setAttribute('data-s', 'now'); d.appendChild(s); }
    d.setAttribute('aria-label', 'Round ' + Math.min(res.length + 1, n) + ' of ' + n);
  }
  function streakUI(st) { var s = $('gm-streak'); s.textContent = 'Streak ' + st; s.setAttribute('data-hot', st >= 3 ? 'true' : 'false'); }
  function finish(res, bestStreak, again) {
    var score = res.filter(Boolean).length, v = load(), prev = v[board.id];
    if (!prev || score > prev.score || (score === prev.score && bestStreak > prev.streak)) { v[board.id] = { score: score, streak: bestStreak, t: Date.now() }; save(v); }
    try { if (window.AceRecord && window.AceRecord.event) window.AceRecord.event(EVENT, { id: board.id, score: score, streak: bestStreak }); } catch (e) {}
    $('gm-play').hidden = true; var end = $('gm-end'); end.hidden = false; end.textContent = '';
    end.appendChild(el('div', 'gm-score', score + ' / ' + res.length));
    end.appendChild(el('p', null, score === res.length ? 'Perfect round. Longest streak: ' + bestStreak + '.' : score >= 8 ? 'Strong. Longest streak: ' + bestStreak + '.' : 'Longest streak: ' + bestStreak + '. See it drawn, then go again.'));
    var bar = el('div', 'gm-bar'); bar.style.justifyContent = 'center';
    var ag = el('button', 'aui-btn aui-btn--gold', 'Play again'); ag.type = 'button'; ag.id = 'gm-again'; ag.addEventListener('click', again); bar.appendChild(ag);
    var see = el('a', 'aui-btn aui-btn--quiet', 'See it drawn'); see.href = B.url(board.id); bar.appendChild(see);
    if (decks.length > 1) { var k = decks.indexOf(board), nx = decks[(k + 1) % decks.length]; var nb = el('a', 'aui-btn aui-btn--quiet'); nb.innerHTML = 'Next deck: ' + B.html(nx[FEED].title); nb.href = PATH + '?d=' + encodeURIComponent(nx.id); bar.appendChild(nb); }
    end.appendChild(bar); ag.focus({ preventScroll: true });
  }

  if (!board || !board.flick) { menu(); return; }
  document.body.setAttribute('data-mode', 'game');
  var F = board.flick, card = $('fl-card'), qEl = $('fl-q'), fb = $('gm-fb'), next = $('gm-next'), bUp = $('fl-up'), bDown = $('fl-down');
  $('gm-kicker').textContent = (B.SECTION[board.section] || '') + ' · Trend Flick';
  $('gm-title').innerHTML = B.html(F.title);
  document.title = plain(F.title) + ' · Trend Flick · Ace Labs';
  $('fl-up-t').textContent = F.up || 'Increases'; $('fl-down-t').textContent = F.down || 'Decreases';
  var deck, res, streak, bestStreak, cur, locked;
  function show() {
    cur = deck[res.length]; locked = false;
    qEl.innerHTML = B.html(cur.q); card.removeAttribute('data-s'); card.removeAttribute('data-tilt'); card.style.transform = ''; card.style.opacity = '';
    card.setAttribute('aria-label', plain(cur.q) + '. ' + (F.up || 'Increases') + ' or ' + (F.down || 'Decreases') + '?');
    [bUp, bDown].forEach(function (b) { b.disabled = false; b.removeAttribute('data-s'); });
    fb.textContent = ''; fb.removeAttribute('data-ok'); next.hidden = true; dots(res, ROUNDS); streakUI(streak);
  }
  function answer(up) {
    if (locked) return; locked = true;
    var ok = up === !!cur.up; res.push(ok); streak = ok ? streak + 1 : 0; bestStreak = Math.max(bestStreak, streak);
    card.setAttribute('data-s', ok ? 'ok' : 'no'); card.removeAttribute('data-tilt'); card.style.transform = 'translateY(' + (up ? -10 : 10) + 'px)';
    var right = cur.up ? bUp : bDown, picked = up ? bUp : bDown;
    bUp.disabled = bDown.disabled = true; right.setAttribute('data-s', 'ok'); if (!ok) picked.setAttribute('data-s', 'no');
    fb.setAttribute('data-ok', String(ok)); fb.textContent = '';
    fb.appendChild(el('b', null, (ok ? 'Yes. ' : 'Not this time. ') + (cur.up ? (F.up || 'Increases') : (F.down || 'Decreases')) + '.'));
    var w = el('span'); w.innerHTML = B.html(cur.why); fb.appendChild(w);
    dots(res, ROUNDS); streakUI(streak);
    next.textContent = res.length >= ROUNDS ? 'See my score' : 'Next'; next.hidden = false; next.focus({ preventScroll: true });
  }
  function advance() { if (!locked) return; if (res.length >= ROUNDS) finish(res, bestStreak, start); else { show(); card.focus({ preventScroll: true }); } }
  function start() { deck = shuffled(F.cards).slice(0, ROUNDS); res = []; streak = 0; bestStreak = 0; $('gm-end').hidden = true; $('gm-play').hidden = false; show(); }
  bUp.addEventListener('click', function () { answer(true); }); bDown.addEventListener('click', function () { answer(false); });
  next.addEventListener('click', advance);
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || $('gm-play').hidden) return;
    if (!locked && e.key === 'ArrowUp') { e.preventDefault(); answer(true); }
    else if (!locked && e.key === 'ArrowDown') { e.preventDefault(); answer(false); }
    else if (locked && (e.key === 'ArrowRight' || (e.key === 'Enter' && e.target === document.body))) { e.preventDefault(); advance(); }
  });
  /* Swipe: the card follows the finger; past 56px it commits. A tap on an answered card moves on. */
  card.addEventListener('pointerdown', function (e) {
    if (e.button) return;
    if (locked) return;
    var y0 = e.clientY, dy = 0; try { card.setPointerCapture(e.pointerId); } catch (x) {}
    card.setAttribute('data-drag', '');
    function mv(ev) { dy = ev.clientY - y0; card.style.transform = 'translateY(' + Math.max(-90, Math.min(90, dy)) + 'px) rotate(' + Math.max(-4, Math.min(4, dy / 24)) + 'deg)'; if (Math.abs(dy) > 24) card.setAttribute('data-tilt', dy < 0 ? 'up' : 'down'); else card.removeAttribute('data-tilt'); }
    function up() {
      card.removeEventListener('pointermove', mv); card.removeEventListener('pointerup', up); card.removeEventListener('pointercancel', cancel); card.removeAttribute('data-drag');
      if (Math.abs(dy) >= 56) answer(dy < 0); else { card.style.transform = ''; card.removeAttribute('data-tilt'); }
    }
    function cancel() { dy = 0; up(); }
    card.addEventListener('pointermove', mv); card.addEventListener('pointerup', up); card.addEventListener('pointercancel', cancel);
  });
  start();
  window.__flick = { answer: answer, advance: advance, current: function () { return cur; }, state: function () { return { round: res.length, streak: streak, locked: locked }; } };
})();
</script>
<script>
window.addEventListener('load', function () {
  Array.prototype.forEach.call(document.querySelectorAll('#ace-bar a[href^="/labs/"], #ace-tabs a[href^="/labs/"]'), function (a) { a.setAttribute('aria-current', 'page'); });
});
</script>
