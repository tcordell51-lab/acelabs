<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 880" role="img" aria-label="A cube and its unfolded net">
  <!-- Code-drawn so the geometry is exact: an isometric cube and a valid six-square cube net (the cross). -->
  <rect width="1168" height="880" fill="#F5F0E8"/>
  <path d="M150 470C150 300 330 215 560 220C800 225 1040 300 1040 480C1040 660 830 735 580 730C330 725 150 640 150 470Z" fill="#1B3A2D"/>
  <circle cx="300" cy="250" r="78" fill="#C9A84C"/>
  <!-- isometric cube: edge 150, 30 degree axes (dx = 129.9, dy = 75) -->
  <g stroke="#0d2018" stroke-width="3" stroke-linejoin="round">
    <polygon points="330,395 459.9,320 589.8,395 459.9,470" fill="#FCFAF6"/>
    <polygon points="330,395 459.9,470 459.9,620 330,545" fill="#EFE7D6"/>
    <polygon points="459.9,470 589.8,395 589.8,545 459.9,620" fill="#DCCFB2"/>
  </g>
  <!-- cube net: column of four squares with one square on each side of the second (6 squares) -->
  <g stroke="#0d2018" stroke-width="3" stroke-linejoin="round" fill="#FCFAF6">
    <rect x="790" y="250" width="100" height="100"/>
    <rect x="690" y="350" width="100" height="100" fill="#EFE7D6"/>
    <rect x="790" y="350" width="100" height="100"/>
    <rect x="890" y="350" width="100" height="100" fill="#EFE7D6"/>
    <rect x="790" y="450" width="100" height="100" fill="#E2C97A"/>
    <rect x="790" y="550" width="100" height="100"/>
  </g>
</svg>
