<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ace The DAT — Redox Balancing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0a0a0a}#root{position:fixed;inset:0}</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="js/redox-balancing.js?h=y12kta"></script>
<script>ReactDOM.render(React.createElement(window.RedoxVideo), document.getElementById('root'));</script>
<script>
/* Climb review embed: with ?embed=review, hide the social-only CTA (a review has no comments).
   The teaching + quiz + branding all stay; only "comment your pick / answer at the end" go. */
(function(){
  try{ if(new URLSearchParams(location.search).get('embed')!=='review') return; }catch(e){ return; }
  var RX=[/comment your (pick|answer)/i,/answer at the end/i,/reveal at the end/i,/follow for the rest/i,/is next/i];
  function hideIn(root){
    if(!root||root.nodeType!==1) return;
    var n=root.querySelectorAll('div,span,p'), i, el, t;
    for(i=0;i<n.length;i++){ el=n[i];
      t=(el.textContent||'').trim();
      if(t.length<=80 && RX.some(function(r){return r.test(t);})){
        if(el.style.getPropertyValue('display')!=='none') el.style.setProperty('display','none','important');
      }
    }
  }
  function boot(){
    var root=document.getElementById('root'); if(!root){ setTimeout(boot,40); return; }
    function tick(){ hideIn(root); }
    tick();
    // Triple-redundant so a matched CTA never survives a real (foreground) playback:
    //  - rAF fires before every paint while the player animates -> hidden before it can show
    //  - the observer catches mutations even in a background/hidden tab
    //  - the interval covers a foreground-paused frame
    (function raf(){ tick(); requestAnimationFrame(raf); })();
    try{ new MutationObserver(tick).observe(root,{childList:true,subtree:true,characterData:true}); }catch(e){}
    setInterval(tick, 250);
  }
  boot();
})();
</script>
<script>
/* Clean capture mode: with ?capture=1, hide the Ace Labs nav chip + the cursor for a pristine
   full-frame recording (the playback bar itself is skipped in the component at ?capture=1).
   The video autoplays from 0 and teaches via its on-screen text — record, add music, post. */
(function(){
  try{ if(new URLSearchParams(location.search).get('capture')!=='1') return; }catch(e){ return; }
  var s=document.createElement('style');
  s.textContent='#al-home{display:none!important}html,body{cursor:none!important}';
  document.head.appendChild(s);
})();
</script>
<script src="/shared/acelabs-nav.js" defer></script>
</body>
</html>
