[build]
  publish = "."
  # No build step — AceLabs is a static-asset deploy.

# Serverless functions (currently just the Casper practice grader).
# @netlify/blobs is provided by the Netlify runtime, so keep it external rather
# than vendoring it into this otherwise dependency-free static deploy.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[headers]]
  for = "/*"
  [headers.values]
    # Framing is controlled by CSP frame-ancestors below (X-Frame-Options is dropped
    # because it has no multi-origin form). 'self' keeps the in-app same-origin explainer
    # iframes working (e.g. GC "Watch" -> VID.open); the AceTheDAT portal is allowed so it
    # can embed the study tools (e.g. The Climb) same as a same-origin tool.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"
    # CSP: allow only same-origin + Google Fonts (used everywhere). No inline-script blocks
    # are eval'd — but Refused-Inline-Script is set to 'unsafe-inline' because the engine
    # HTMLs use inline <script> blocks for visualizations and event wiring. If we ever
    # extract those to external .js files, tighten this.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self' https://acethedat-portal.netlify.app; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tools/*"
  [headers.values]
    # Engine HTMLs are large — cache aggressively but allow revalidation.
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  # Retold narration clips (88 MB of MP3) never change once published.
  for = "/tools/:course/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    # HTML pages: short cache so copy/content edits propagate.
    Cache-Control = "public, max-age=300, must-revalidate"

[[redirects]]
  # Old portal-era /unified-mock URL — redirect to the new Prometric runner.
  from = "/unified-mock.html"
  to = "/prometric-mock.html"
  status = 301
  force = true

[[redirects]]
  # Old /ochem-v3 deprecation — redirect to the canonical OChem v1 (Reaction Maps).
  from = "/tools/ochem-v3/*"
  to = "/tools/ochem/index.html"
  status = 301
  force = true

[[redirects]]
  # Retired from navigation (Ace Labs shell); the URL keeps working.
  from = "/mocks-catalog.html"
  to = "/tests/"
  status = 301
  force = true

